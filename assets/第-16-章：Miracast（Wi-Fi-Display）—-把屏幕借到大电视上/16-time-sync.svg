   sodipodi:docname="16-time-sync.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview25"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.59"
     inkscape:cx="549.68553"
     inkscape:cy="280.18868"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg25" />
  <defs
     id="defs3">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <style
       id="style2">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
    <marker
       id="ar"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#cbd5e1"
         id="path2" />
    </marker>
    <marker
       id="arg"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#fbbf24"
         id="path3" />
    </marker>
  </defs>
  <rect
     width="1100"
     height="560"
     fill="url(#bg)"
     id="rect3" />
  <text
     x="550"
     y="34"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text3">Miracast 时间同步 — 投屏为什么不&quot;音画不同步&quot;</text>
  <text
     x="550"
     y="58"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12"
     id="text4">两台独立设备时钟不一 + 网络抖动 → 靠&quot;对表（gPTP）+ PCR/RTP 时间戳 + 去抖动缓冲&quot;兜底</text>
  <!-- Source box -->
  <rect
     x="60"
     y="92"
     width="300"
     height="180"
     rx="10"
     fill="#0c2a2a"
     stroke="#14b8a6"
     stroke-width="2"
     id="rect4" />
  <text
     x="210"
     y="116"
     text-anchor="middle"
     fill="#5eead4"
     font-size="15"
     font-weight="700"
     id="text5">WFD Source（手机）</text>
  <rect
     x="84"
     y="132"
     width="252"
     height="34"
     rx="6"
     fill="#134e4a"
     id="rect5" />
  <text
     x="210"
     y="154"
     text-anchor="middle"
     fill="#a7f3d0"
     font-size="12"
     id="text6">AV 编码 → MPEG2-TS（嵌 PCR）</text>
  <rect
     x="84"
     y="176"
     width="252"
     height="34"
     rx="6"
     fill="#7f1d1d"
     stroke="#fbbf24"
     stroke-width="1.5"
     id="rect6" />
  <text
     x="210"
     y="198"
     text-anchor="middle"
     fill="#fde68a"
     font-size="12"
     font-weight="700"
     id="text7">⏱ Grandmaster Clock（大师钟）</text>
  <text
     x="210"
     y="232"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text8">每个 RTP 包打 32-bit 时间戳</text>
  <text
     x="210"
     y="250"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text9">（90 kHz，1 tick = 11.11 µs）</text>
  <!-- Sink box -->
  <rect
     x="740"
     y="92"
     width="300"
     height="180"
     rx="10"
     fill="#0c1e3a"
     stroke="#3b82f6"
     stroke-width="2"
     id="rect9" />
  <text
     x="890"
     y="116"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="15"
     font-weight="700"
     id="text10">WFD Sink（电视）</text>
  <rect
     x="764"
     y="132"
     width="252"
     height="34"
     rx="6"
     fill="#1e3a5f"
     stroke="#fbbf24"
     stroke-width="1.5"
     id="rect10" />
  <text
     x="890"
     y="154"
     text-anchor="middle"
     fill="#fde68a"
     font-size="12"
     font-weight="700"
     id="text11">⏱ Slave Clock（对表到大师钟）</text>
  <rect
     x="764"
     y="176"
     width="252"
     height="34"
     rx="6"
     fill="#3a2a0a"
     stroke="#f59e0b"
     id="rect11" />
  <text
     x="890"
     y="198"
     text-anchor="middle"
     fill="#fed7aa"
     font-size="12"
     id="text12">去抖动缓冲（de-jitter buffer）</text>
  <text
     x="890"
     y="232"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text13">恢复 PCR → 平稳解码渲染</text>
  <text
     x="890"
     y="250"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text14">音视频严丝合缝对齐</text>
  <!-- data path -->
  <line
     x1="360"
     y1="150"
     x2="736"
     y2="150"
     stroke="#14b8a6"
     stroke-width="3"
     marker-end="url(#ar)"
     id="line14" />
  <text
     x="548"
     y="142"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11.5"
     id="text15">MPEG2-TS over RTP/UDP（带时间戳）</text>
  <text
     x="548"
     y="170"
     text-anchor="middle"
     fill="#f87171"
     font-size="10.5"
     id="text16">↯ 途中引入网络抖动 jitter</text>
  <!-- gPTP sync path (dashed two-way) -->
  <line
     x1="360"
     y1="194"
     x2="736"
     y2="194"
     stroke="#fbbf24"
     stroke-width="1.6"
     stroke-dasharray="6,3"
     marker-end="url(#arg)"
     id="line16" />
  <line
     x1="736"
     y1="216"
     x2="364"
     y2="216"
     stroke="#fbbf24"
     stroke-width="1.6"
     stroke-dasharray="6, 3"
     marker-end="url(#arg)"
     id="line17" />
  <text
     x="548"
     y="208"
     text-anchor="middle"
     fill="#fde68a"
     font-size="11"
     id="text17">gPTP（802.1AS）对表：交换 802.11v Timing Measurement</text>
  <!-- bottom: timeline illustration -->
  <rect
     x="60"
     y="300"
     width="980"
     height="156"
     rx="10"
     fill="#0f172a"
     stroke="#475569"
     stroke-width="1.5"
     id="rect17" />
  <text
     x="80"
     y="324"
     fill="#e2e8f0"
     font-size="13"
     font-weight="700"
     id="text18">为什么需要这一套？</text>
  <text
     x="80"
     y="352"
     fill="#f87171"
     font-size="11.5"
     font-weight="700"
     id="text19">❌ 不同步会怎样：</text>
  <text
     x="100"
     y="372"
     fill="#cbd5e1"
     font-size="11"
     id="text20">· 两设备时钟各跑各的 → 播放速度有微小差异 → 时间一长音画越漂越远</text>
  <text
     x="100"
     y="392"
     fill="#cbd5e1"
     font-size="11"
     id="text21">· 网络抖动 → 包到达忽快忽慢 → 画面卡顿、音频爆音</text>
  <text
     x="80"
     y="420"
     fill="#5eead4"
     font-size="11.5"
     font-weight="700"
     id="text22">✅ 三层兜底：</text>
  <text
     x="100"
     y="440"
     fill="#cbd5e1"
     font-size="11"
     id="text23">① PCR/RTP 时间戳定节奏　② gPTP 让 Sink 对表到 Source 大师钟　③ 去抖动缓冲抹平到达抖动（代价：一点固定延迟）</text>
  <text
     x="550"
     y="492"
     text-anchor="middle"
     fill="#64748b"
     font-size="11"
     id="text24">类比：两个鼓手各打各的拍子必乱 → 一个当节拍器、另一个时刻对表 → 再加缓冲蓄水池把忽快忽慢的水流抹匀</text>
  <text
     x="550"
     y="520"
     text-anchor="middle"
     fill="#64748b"
     font-size="10.5"
     id="text25">规范依据：§4.10.1（时间同步）· Time Synchronization 位在 WFD Device Info 子元素中声明（§5.1.2）</text>
</svg>
