  <style id="style1">
    text { font-family: 'Maple Mono Normal NL NF CN',monospace; }
  </style>
 <defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#0f0f1a"/>
   <stop offset="100%" stop-color="#1a1a2e"/>
  </linearGradient>
 </defs>
 <!--
    Plot: x=80..700, y=60..440
    X: Pin -10..+14 dBm (range=24, 620px/24=25.83 px/dBm)
    Y: Pout 0..50 dBm (range=50, 380px/50=7.6 px/dBm)

    Gain = 25 dB
    P1dB: Pin=1, Pout=25 (gain dropped 1dB)
    IP3: OIP3 = P1dB + 10 = 35 dBm, IIP3 = 35 - 25 = 10 dBm
    IM3 line: slope 3, passes through IP3
  -->
 <!-- Axes -->
 <!-- X ticks: -10, -5, 0, 5, 10 (and 14 for IP3) -->
 <!-- Y ticks: 0, 10, 20, 30, 40, 50 -->
 <!-- Grid lines at P1dB and IP3 -->
 <!-- Ideal fundamental line: Pout = Pin + 25, slope 1
       Pin=-10, Pout=15 -> (80, 326)
       Pin=14, Pout=39 -> (700, 144.4) -->
 <!-- IM3 line: slope 3, passes through OIP3 (Pin=10, Pout=35) -> (597, 174)
       At Pin=0: Pout = 35 - 3*10 = 5 -> (338, 402)
       At Pin=14: Pout = 35 + 3*4 = 47 -> (700, 81) -->
 <!-- Actual PA curve (compressed)
       Pin=-10, Pout=15 -> (80, 326)
       Pin=-5, Pout=20 -> (209, 288)
       Pin=0, Pout=24.5 -> (338, 252.2)
       Pin=1, Pout=25 -> (363, 250)
       Pin=3, Pout=26 -> (415, 242.4)
       Pin=5, Pout=26.7 -> (467, 237.1)
       Pin=8, Pout=27.5 -> (546, 231)
       Pin=10, Pout=28 -> (597, 227.2)
       Pin=14, Pout=28.8 -> (700, 221.1) -->
 <!-- P1dB point: Pin=1, Pout=25 -> (363, 250) -->
 <!-- P1dB label -->
 <!-- 1 dB gap at P1dB -->
 <!-- IP3 point: IIP3=10, OIP3=35 -> (597, 174) -->
 <!-- IP3 label (left of point, well above curve) -->
 <!-- Region labels -->
 <!-- Back-off annotation -->
 <!-- Operating point: 19 dBm -> (Pin~-7.8, Pout=19 -> x=138, y=296) -->
 <!-- Legend -->
