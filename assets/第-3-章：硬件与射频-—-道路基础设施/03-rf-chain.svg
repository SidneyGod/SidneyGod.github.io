     id="text58">Key Insights / 核心洞察:</text>
  <text
     x="60"
     y="428"
     fill="#94a3b8"
     font-size="10px"
     id="text59">1. PA 和 LNA 是最关键的射频组件 — PA 决定发射功率和线性度，LNA 决定接收灵敏度和噪声系数</text>
  <text
     x="60"
     y="444"
     fill="#94a3b8"
     font-size="10px"
     id="text60">2. FEM 将 PA + LNA + T/R Switch 集成为紧凑模块，T/R Switch 在收发之间快速切换（半双工）</text>
  <text
     x="60"
     y="460"
     fill="#94a3b8"
     font-size="10px"
     id="text61">3. PLL/Synthesizer 由晶振提供参考频率，生成精确的本振信号（LO）供 TX 上变频和 RX 下变频共用</text>
  <text
     x="60"
     y="476"
     fill="#94a3b8"
     font-size="10px"
     id="text62">4. WiFi 是半双工系统：TX 和 RX 共享本振，通过 T/R Switch 分时复用天线</text>
