     font-size="18"
     font-weight="700"
     id="text4">OFDMA Resource Units — Dividing One Road into Many Lanes</text>
  <text
     x="600"
     y="55"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13"
     id="text5">OFDMA 资源单元 — 把一条路分成多个车道，每辆车分配不同车道</text>
