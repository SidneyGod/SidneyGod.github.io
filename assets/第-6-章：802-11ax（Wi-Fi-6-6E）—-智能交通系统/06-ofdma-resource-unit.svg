     y="100"
     text-anchor="middle"
     fill="#ef4444"
     font-size="14"
     font-weight="700"
     id="text6">OFDM（802.11a/n/ac）</text>
  <text
     x="310"
     y="118"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text7">每次传输只服务一个用户</text>
