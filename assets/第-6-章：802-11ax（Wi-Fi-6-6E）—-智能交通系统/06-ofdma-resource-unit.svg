     y="160"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="14"
     font-weight="600"
     id="text8">用户 A 占用整个 20 MHz 信道</text>
  <text
     x="310"
     y="180"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text9">(即使只发 100 字节小数据)</text>
  <text
