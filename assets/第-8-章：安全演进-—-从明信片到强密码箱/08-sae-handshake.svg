<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1200 620"
   width="1200"
   height="620"
   version="1.1"
   id="svg27"
   sodipodi:docname="08-sae-handshake.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview27"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.33"
     inkscape:cx="600.37594"
     inkscape:cy="310.15038"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg27" />
  <style
     id="style1">
    text { font-family: 'Maple Mono Normal NL NF CN', monospace; }
  </style>
  <defs
     id="defs5">
    <linearGradient
       id="bg-grad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="card-grad"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
    <marker
       id="arrow-r"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="m0,0l10,5l-10,5l0,-10z"
         fill="#94a3b8"
         id="path4" />
    </marker>
    <marker
       id="arrow-p"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="m0,0l10,5l-10,5l0,-10z"
         fill="#8b5cf6"
         id="path5" />
    </marker>
  </defs>
  <rect
     width="1200"
     height="620"
     fill="url(#bg-grad)"
     id="rect5" />
  <text
     x="600"
     y="30"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="16"
     font-weight="700"
     id="text5">SAE (Dragonfly) 握手流程 — WPA3 密钥协商</text>
  <text
     x="600"
     y="48"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text6">802.11-2024 Section 12.5.2 (SAE) | Dragonfly Key Exchange (RFC 7664)</text>
  <!-- STA and AP -->
  <rect
     x="120"
     y="62"
     width="160"
     height="35"
     rx="6"
     fill="#1e1b4b"
     stroke="#8b5cf6"
     stroke-width="1.5"
     id="rect6" />
  <text
     x="200"
     y="84"
     text-anchor="middle"
     fill="#c4b5fd"
     font-size="12"
     font-weight="700"
     id="text7">STA (non-AP MLD)</text>
  <line
     x1="200"
     y1="97"
     x2="200"
     y2="600"
     stroke="#475569"
     stroke-width="1"
     stroke-dasharray="4,3"
     id="line7" />
  <rect
     x="920"
     y="62"
     width="160"
     height="35"
     rx="6"
     fill="#172554"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect7" />
  <text
     x="1000"
     y="84"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="12"
     font-weight="700"
     id="text8">AP (AP MLD)</text>
  <line
     x1="1000"
     y1="97"
     x2="1000"
     y2="600"
     stroke="#475569"
     stroke-width="1"
     stroke-dasharray="4,3"
     id="line8" />
  <!-- Phase 1: Hunting-and-Pecking -->
  <rect
     x="50"
     y="108"
     width="1100"
     height="100"
     rx="8"
     fill="#0f172a"
     stroke="#fbbf24"
     stroke-width="1"
     id="rect8" />
  <text
     x="70"
     y="128"
     fill="#fbbf24"
     font-size="11"
     font-weight="600"
     id="text9">Phase 1: Hunting-and-Pecking (or Hash-to-Curve)</text>
  <text
     x="70"
     y="148"
     fill="#94a3b8"
     font-size="10"
     id="text10">密码 + MAC → 哈希 → 是否在楚圆曲线上? → 否:重试 → 是:得到有效点 PWE</text>
  <text
     x="70"
     y="165"
     fill="#94a3b8"
     font-size="10"
     id="text11">终端同时计算，得到相同的有效点 PWE — 只有知道密码的人才能计算出来</text>
  <rect
     x="70"
     y="175"
     width="1060"
     height="22"
     rx="3"
     fill="#7c2d12"
     id="rect11" />
  <text
     x="600"
     y="191"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="10"
     id="text12">关键：PWE是有效点，不是随机数，故意计算密码的人也不能直接恢复密码</text>
  <!-- Commit Exchange -->
  <rect
     x="50"
     y="220"
     width="1100"
     height="110"
     rx="8"
     fill="#0f172a"
     stroke="#8b5cf6"
     stroke-width="1.5"
     id="rect12" />
  <text
     x="70"
     y="240"
     fill="#8b5cf6"
     font-size="11"
     font-weight="600"
     id="text13">Phase 2: Commit Exchange</text>
  <line
     x1="210"
     y1="260"
     x2="990"
     y2="260"
     stroke="#8b5cf6"
     stroke-width="1.5"
     marker-end="url(#arrow-p)"
     id="line13" />
  <text
     x="600"
     y="256"
     text-anchor="middle"
     fill="#8b5cf6"
     font-size="10"
     font-weight="600"
     id="text14">Commit: scalar(STA) + element(STA)</text>
  <line
     x1="990"
     y1="285"
     x2="210"
     y2="285"
     stroke="#8b5cf6"
     stroke-width="1.5"
     marker-end="url(#arrow-p)"
     id="line14" />
  <text
     x="600"
     y="281"
     text-anchor="middle"
     fill="#8b5cf6"
     font-size="10"
     font-weight="600"
     id="text15">Commit: scalar(AP) + element(AP)</text>
  <text
     x="70"
     y="310"
     fill="#94a3b8"
     font-size="10"
     id="text16">scalar = (rand + mask) mod r | element = -(mask × PWE)</text>
  <!-- Confirm Exchange -->
  <rect
     x="50"
     y="345"
     width="1100"
     height="110"
     rx="8"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect16" />
  <text
     x="70"
     y="365"
     fill="#10b981"
     font-size="11"
     font-weight="600"
     id="text17">Phase 3: Confirm Exchange</text>
  <line
     x1="990"
     y1="385"
     x2="210"
     y2="385"
     stroke="#10b981"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line17" />
  <text
     x="600"
     y="381"
     text-anchor="middle"
     fill="#10b981"
     font-size="10"
     font-weight="600"
     id="text18">Confirm = CN(SAE-KCK, send-confirm, scalar/element)</text>
  <line
     x1="210"
     y1="410"
     x2="990"
     y2="410"
     stroke="#10b981"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line18" />
  <text
     x="600"
     y="406"
     text-anchor="middle"
     fill="#10b981"
     font-size="10"
     font-weight="600"
     id="text19">Confirm = CN(SAE-KCK, send-confirm, scalar/element)</text>
  <text
     x="70"
     y="438"
     fill="#94a3b8"
     font-size="10"
     id="text20">双方验证 Confirm 值，确认双方都知道密码 — 但攻击者无法离线献测密码</text>
  <!-- PMK Derivation -->
  <rect
     x="50"
     y="470"
     width="1100"
     height="55"
     rx="8"
     fill="#065f46"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect20" />
  <text
     x="600"
     y="493"
     text-anchor="middle"
     fill="#10b981"
     font-size="12"
     font-weight="700"
     id="text21">PMK 流生</text>
  <text
     x="600"
     y="515"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="10"
     id="text22">共享点 K = rand_STA × rand_AP × PWE → PMK = KDF(K) → 进入 4-Way Handshake (与 WPA2 相同)</text>
  <!-- Why SAE is secure -->
  <rect
     x="50"
     y="540"
     width="1100"
     height="70"
     rx="8"
     fill="url(#card-grad)"
     stroke="#334155"
     stroke-width="1"
     id="rect22" />
  <text
     x="600"
     y="560"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="12"
     font-weight="700"
     id="text23">SAE 的安全性优势</text>
  <text
     x="62"
     y="580"
     fill="#94a3b8"
     font-size="10px"
     id="text24">• 前向保密：PMK 含临时 rand，即使密码泄露（能算 PWE），从 element = -mask×PWE 反推 mask 是离散对数难题 → 拿不到 rand → 算不出 K</text>
  <text
     x="62"
     y="598"
     fill="#94a3b8"
     font-size="10px"
     id="text25">• 离线字册攻击不可能：不像 PSK 可以在线下献测</text>
  <text
     x="834"
     y="580"
     fill="#94a3b8"
     font-size="10px"
     id="text26">• 抵抗防阻塞(Anti-Clogging)：阻止 Commit 涌入攻击</text>
  <text
     x="834"
     y="598"
     fill="#94a3b8"
     font-size="10px"
     id="text27">• 等价身份：双方都知道密码，没有主从关系</text>
</svg>
