     font-weight="700"
     id="text4">TKIP 密钥混合函数 — 每帧不同的加密密钥</text>
  <text
     x="600"
     y="48"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text5">802.11-2024 Section 12.3.4.5 (TKIP Key Mixing Function) | 解决 WEP 的 IV 重用问题</text>
  <!-- Input boxes -->
  <rect
     x="40"
     y="70"
     width="180"
     height="50"
     rx="6"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect5" />
  <text
     x="130"
     y="93"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="11"
     font-weight="600"
     id="text6">基密钥 TK</text>
  <text
     x="130"
     y="108"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text7">128 bit 传共享密钥</text>
  <rect
     x="250"
     y="70"
     width="180"
     height="50"
     rx="6"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect7" />
  <text
     x="340"
     y="93"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="11"
     font-weight="600"
