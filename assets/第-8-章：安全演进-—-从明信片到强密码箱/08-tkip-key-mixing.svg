  <text
     x="340"
     y="108"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text9">48 位 TKIP Sequence Counter</text>
  <rect
     x="460"
     y="70"
     width="180"
     height="50"
     rx="6"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect9" />
  <text
     x="550"
     y="93"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="11"
     font-weight="600"
