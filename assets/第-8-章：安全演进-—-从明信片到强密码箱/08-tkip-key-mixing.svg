  <text
     x="550"
     y="108"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text11">48 位 发送方地址</text>
  <!-- Phase 1 -->
  <rect
     x="40"
     y="150"
     width="600"
     height="130"
     rx="10"
     fill="url(#card-grad)"
     stroke="#f97316"
     stroke-width="1.5"
     id="rect11" />
  <text
     x="340"
     y="175"
     text-anchor="middle"
     fill="#f97316"
     font-size="13"
     font-weight="700"
     id="text12">Phase 1: 中间密钥生成</text>
  <text
     x="60"
     y="200"
     fill="#94a3b8"
     font-size="10"
     id="text13">输入: TK + TA + TSC[47:16] (高 32 位)</text>
  <rect
     x="60"
     y="210"
     width="560"
     height="28"
     rx="4"
     fill="#0f172a"
     stroke="#f97316"
     stroke-width="1"
     id="rect13" />
  <text
     x="340"
     y="229"
     text-anchor="middle"
     fill="#fdba74"
     font-size="11"
     id="text14">混合与轮换的操作 → 产生 TTAK (80 位中间密钥)</text>
  <text
     x="60"
     y="260"
     fill="#94a3b8"
     font-size="10"
     id="text15">输出: TTAK — 一个中间密钥，给 Phase 2 用</text>
