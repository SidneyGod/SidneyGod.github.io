  <line
     x1="130"
     y1="120"
     x2="130"
     y2="150"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line15" />
  <line
     x1="340"
     y1="120"
     x2="340"
     y2="150"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line16" />
  <line
     x1="550"
     y1="120"
     x2="550"
     y2="150"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line17" />
  <!-- Phase 2 -->
  <rect
     x="40"
     y="300"
     width="600"
     height="100"
     rx="10"
     fill="url(#card-grad)"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect17" />
  <text
     x="340"
     y="325"
     text-anchor="middle"
     fill="#10b981"
     font-size="13"
     font-weight="700"
     id="text17">Phase 2: 每帧密钥生成</text>
  <text
     x="60"
     y="350"
     fill="#94a3b8"
     font-size="10"
     id="text18">输入: TTAK + TK + TSC[15:0] (低 16 位)</text>
  <rect
     x="60"
     y="360"
     width="560"
     height="28"
     rx="4"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="1"
     id="rect18" />
  <text
     x="340"
     y="379"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="11"
     id="text19">每帧独立计算 → WEP IV (24位) + RC4 Key (104位)</text>
  <!-- Arrow from Phase 1 to Phase 2 -->
  <line
     x1="340"
     y1="280"
     x2="340"
     y2="300"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line19" />
  <!-- Result -->
  <rect
     x="700"
     y="150"
     width="460"
     height="250"
     rx="10"
     fill="url(#card-grad)"
     stroke="#334155"
     stroke-width="1"
     id="rect19" />
  <text
     x="930"
     y="175"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="13"
     font-weight="700"
     id="text20">密钥混合的效果</text>
  <rect
     x="720"
     y="190"
     width="420"
     height="50"
     rx="6"
     fill="#065f46"
     id="rect20" />
  <text
     x="930"
     y="212"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="11"
     font-weight="600"
     id="text21">单独的 IV 也会生成不同的密钥</text>
  <text
     x="930"
     y="228"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text22">因为 MAC 地址反映了记录的信息</text>
  <rect
     x="720"
     y="250"
     width="420"
     height="50"
     rx="6"
     fill="#0f172a"
     stroke="#ef4444"
     stroke-width="1"
     id="rect22" />
  <text
     x="930"
     y="272"
     text-anchor="middle"
     fill="#ef4444"
     font-size="11"
     font-weight="600"
     id="text23">比 WEP 的改进</text>
  <text
     x="930"
     y="288"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text24">WEP: 固定密钥 + 降列 IV → IV 重用无法防止</text>
  <rect
     x="720"
     y="310"
     width="420"
     height="50"
     rx="6"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="1"
     id="rect24" />
  <text
     x="930"
     y="332"
     text-anchor="middle"
     fill="#10b981"
     font-size="11"
     font-weight="600"
     id="text25">TKIP: MAC 地址参与 → 单独的 IV 也不同</text>
  <text
     x="930"
     y="348"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text26">即使两个 STA 用相同 IV，密钥也不同</text>
  <text
     x="930"
     y="385"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="10"
     id="text27">交通比喻：WEP 是固定钥匙，TKIP 是每车都有独立钥匙</text>
  <!-- Arrow from Phase 2 to result -->
  <line
     x1="640"
     y1="350"
     x2="700"
     y2="275"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line27" />
</svg>
