<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1200 580"
   width="1200"
   height="580"
   version="1.1"
   id="svg34"
   sodipodi:docname="08-aes-ccmp.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview34"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.3528978"
     inkscape:cx="599.82356"
     inkscape:cy="290.11799"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg34" />
  <style
     id="style1">
    text { font-family: 'Maple Mono Normal NL NF CN', monospace; }
  </style>
  <defs
     id="defs4">
    <linearGradient
       id="bg-grad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="card-grad"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
  </defs>
  <rect
     width="1200"
     height="580"
     fill="url(#bg-grad)"
     id="rect4" />
  <text
     x="600"
     y="30"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="16"
     font-weight="700"
     id="text4">AES-CCMP 加密与完整性校验</text>
  <text
     x="600"
     y="48"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text5">Counter Mode (CTR) 加密 + CBC-MAC 完整性校验 — 802.11-2024 Section 12.5.3.3</text>
  <!-- CCMP Header -->
  <rect
     x="40"
     y="65"
     width="540"
     height="130"
     rx="10"
     fill="url(#card-grad)"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect5" />
  <text
     x="310"
     y="88"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="13"
     font-weight="700"
     id="text6">CCMP 帧结构</text>
  <rect
     x="60"
     y="100"
     width="500"
     height="26"
     rx="3"
     fill="#1e3a5f"
     id="rect6" />
  <text
     x="310"
     y="117"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="10"
     id="text7">共同 8 字节: ExtIV(1) + Reserved(1) + PN(6) → 48-bit Packet Number</text>
  <rect
     x="60"
     y="130"
     width="500"
     height="26"
     rx="3"
     fill="#0f172a"
     id="rect7" />
  <text
     x="310"
     y="147"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text8">加密后整体: CCMP Header(8) + Encrypted Data + MIC(8)</text>
  <rect
     x="60"
     y="160"
     width="500"
     height="26"
     rx="3"
     fill="#0f172a"
     id="rect8" />
  <text
     x="310"
     y="177"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text9">完整性校验值(MIC): 8 字节 = 64 bit</text>
  <!-- Encryption Process -->
  <rect
     x="620"
     y="65"
     width="540"
     height="130"
     rx="10"
     fill="url(#card-grad)"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect9" />
  <text
     x="890"
     y="88"
     text-anchor="middle"
     fill="#10b981"
     font-size="13"
     font-weight="700"
     id="text10">AES-128 加密过程</text>
  <text
     x="640"
     y="112"
     fill="#94a3b8"
     font-size="10"
     id="text11">输入: Plaintext(128bit) + Key(128bit)</text>
  <text
     x="640"
     y="128"
     fill="#94a3b8"
     font-size="10"
     id="text12">输出: Ciphertext(128bit)</text>
  <text
     x="640"
     y="148"
     fill="#94a3b8"
     font-size="10"
     id="text13">转换 ×
10轮 SubBytes + ShiftRows + MixColumns + AddRoundKey</text>
  <text
     x="640"
     y="168"
     fill="#94a3b8"
     font-size="10"
     id="text14">每轮都是可逆的复杂性操作，阻止攻击者将明文的结构信息暴露到密文</text>
  <!-- Two parallel processes -->
  <text
     x="600"
     y="215"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="14"
     font-weight="700"
     id="text15">并行处理：加密(CTR) + 完整性(CBC-MAC)</text>
  <!-- CTR Mode (left) -->
  <rect
     x="40"
     y="235"
     width="540"
     height="200"
     rx="10"
     fill="url(#card-grad)"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect15" />
  <text
     x="310"
     y="258"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="12"
     font-weight="700"
     id="text16">CTR 模式 (加密)</text>
  <text
     x="60"
     y="280"
     fill="#94a3b8"
     font-size="10"
     id="text17">Counter = (PN || Nonce || 0x0001)</text>
  <text
     x="60"
     y="298"
     fill="#94a3b8"
     font-size="10"
     id="text18">每 128-bit 块用一个计数器:</text>
  <rect
     x="60"
     y="308"
     width="480"
     height="30"
     rx="3"
     fill="#1e3a5f"
     id="rect18" />
  <text
     x="300"
     y="327"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="10"
     id="text19">Counter → AES(Key) → Keystream → XOR Plaintext → Ciphertext</text>
  <text
     x="60"
     y="358"
     fill="#94a3b8"
     font-size="10"
     id="text20">每块的 Counter 不同，或许并行加密</text>
  <rect
     x="60"
     y="370"
     width="480"
     height="25"
     rx="4"
     fill="#1e3a5f"
     id="rect20" />
  <text
     x="300"
     y="387"
     text-anchor="middle"
     fill="#60a5fa"
     font-size="10"
     id="text21">优点：同一密钥用了 128 位，没有 IV重复问题</text>
  <!-- CBC-MAC Mode (right) -->
  <rect
     x="620"
     y="235"
     width="540"
     height="200"
     rx="10"
     fill="url(#card-grad)"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect21" />
  <text
     x="890"
     y="258"
     text-anchor="middle"
     fill="#10b981"
     font-size="12"
     font-weight="700"
     id="text22">CBC-MAC 模式 (完整性)</text>
  <text
     x="640"
     y="280"
     fill="#94a3b8"
     font-size="10"
     id="text23">每块与前一块的密文 XOR，再加密:</text>
  <rect
     x="640"
     y="290"
     width="480"
     height="30"
     rx="3"
     fill="#0e4429"
     id="rect23" />
  <text
     x="880"
     y="309"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="10"
     id="text24">Block1 → AES → XOR Block2 → AES → ... → MIC(8 bytes)</text>
  <text
     x="640"
     y="340"
     fill="#94a3b8"
     font-size="10"
     id="text25">包含: AAD(预备载荷) + Nonce + Plaintext</text>
  <text
     x="640"
     y="358"
     fill="#94a3b8"
     font-size="10"
     id="text26">最终输出 8 字节 MIC，阻止数据被等收</text>
  <rect
     x="640"
     y="370"
     width="480"
     height="25"
     rx="4"
     fill="#0e4429"
     id="rect26" />
  <text
     x="880"
     y="387"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="10"
     id="text27">优点：CBC-MAC 是密码学安全的 MAC，与 HMAC 同级</text>
  <!-- Security comparison -->
  <rect
     x="40"
     y="455"
     width="1120"
     height="110"
     rx="10"
     fill="url(#card-grad)"
     stroke="#334155"
     stroke-width="1"
     id="rect27" />
  <text
     x="600"
     y="478"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="13"
     font-weight="700"
     id="text28">安全性对比</text>
  <rect
     x="60"
     y="492"
     width="330"
     height="60"
     rx="6"
     fill="#7f1d1d"
     id="rect28" />
  <text
     x="225"
     y="512"
     text-anchor="middle"
     fill="#ef4444"
     font-size="11"
     font-weight="600"
     id="text29">WEP: RC4 + CRC-32</text>
  <text
     x="225"
     y="530"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text30">加密与完整性分离，CRC是线性的，可被等收</text>
  <rect
     x="430"
     y="492"
     width="330"
     height="60"
     rx="6"
     fill="#7c2d12"
     id="rect30" />
  <text
     x="595"
     y="512"
     text-anchor="middle"
     fill="#f97316"
     font-size="11"
     font-weight="600"
     id="text31">WPA/TKIP: RC4 + Michael MIC</text>
  <text
     x="595"
     y="530"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text32">改进了 MIC，但锁花还是 RC4，已被攻破</text>
  <rect
     x="800"
     y="492"
     width="340"
     height="60"
     rx="6"
     fill="#065f46"
     id="rect32" />
  <text
     x="970"
     y="512"
     text-anchor="middle"
     fill="#10b981"
     font-size="11"
     font-weight="600"
     id="text33">WPA2/CCMP: AES + CBC-MAC</text>
  <text
     x="970"
     y="530"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text34">同一算法(AES)同时做加密和完整性，自设计初起就安全</text>
</svg>
