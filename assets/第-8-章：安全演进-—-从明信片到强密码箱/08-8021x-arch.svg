     fill="#8b5cf6"
     font-size="10"
     id="text21">EAP 帧</text>
  <text
     x="385"
     y="140"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text22">(802.1X 框架)</text>
  <line
     x1="710"
     y1="130"
     x2="920"
     y2="130"
