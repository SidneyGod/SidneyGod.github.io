  <text
     x="815"
     y="125"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="10"
     id="text23">RADIUS 协议</text>
  <text
     x="815"
     y="140"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text24">(UDP 1812/1813)</text>
  <!-- EAP Methods -->
  <rect
     x="60"
     y="210"
     width="1100"
     height="100"
     rx="8"
     fill="url(#card-grad)"
     stroke="#334155"
     stroke-width="1"
     id="rect24" />
  <text
     x="600"
     y="232"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="13"
     font-weight="700"
     id="text25">常见 EAP 方法对比</text>
  <rect
     x="80"
     y="245"
     width="240"
     height="55"
     rx="6"
     fill="#065f46"
     stroke="#10b981"
     stroke-width="1"
     id="rect25" />
  <text
     x="200"
     y="265"
     text-anchor="middle"
     fill="#10b981"
     font-size="11"
     font-weight="600"
     id="text26">EAP-TLS</text>
  <text
     x="200"
     y="280"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text27">双向认证 + 密钥证书</text>
  <text
     x="200"
     y="293"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="9"
     id="text28">安全性最高(强制密钥)</text>
  <rect
     x="350"
     y="245"
     width="240"
     height="55"
     rx="6"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1"
     id="rect28" />
  <text
     x="470"
     y="265"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="11"
     font-weight="600"
     id="text29">PEAP</text>
  <text
     x="470"
     y="280"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text30">TLS集道 + 用户名/密码</text>
  <text
     x="470"
     y="293"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text31">最常用(单向认证)</text>
  <rect
     x="620"
     y="245"
     width="240"
     height="55"
     rx="6"
     fill="#1e3a5f"
     stroke="#f97316"
     stroke-width="1"
     id="rect31" />
  <text
     x="740"
     y="265"
     text-anchor="middle"
     fill="#fdba74"
     font-size="11"
     font-weight="600"
     id="text32">EAP-TTLS</text>
  <text
     x="740"
     y="280"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text33">类似 PEAP，但更灵活</text>
  <text
     x="740"
     y="293"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text34">支持多种内层认证</text>
  <rect
     x="890"
     y="245"
     width="240"
     height="55"
     rx="6"
     fill="#1e3a5f"
     stroke="#a78bfa"
     stroke-width="1"
     id="rect34" />
  <text
     x="1010"
     y="265"
     text-anchor="middle"
     fill="#c4b5fd"
     font-size="11"
     font-weight="600"
     id="text35">EAP-MSCHAPv2</text>
  <text
     x="1010"
     y="280"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text36">用户名/密码(弱于 TLS)</text>
  <text
     x="1010"
     y="293"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text37">常用于 PEAP 内层</text>
  <!-- Authentication Flow -->
  <rect
     x="60"
     y="330"
     width="1100"
     height="135"
     rx="8"
     fill="url(#card-grad)"
     stroke="#fbbf24"
     stroke-width="1"
     id="rect37" />
  <text
     x="600"
     y="352"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="12"
     font-weight="700"
     id="text38">认证流程高级视图</text>
  <text
     x="80"
     y="375"
     fill="#94a3b8"
     font-size="10"
     id="text39">1. STA → AP: EAP-Start (802.1X 框架)</text>
  <text
     x="80"
     y="392"
     fill="#94a3b8"
     font-size="10"
     id="text40">2. AP → RADIUS: Access-Request (EAP 帧转发)</text>
  <text
     x="80"
     y="409"
     fill="#94a3b8"
     font-size="10"
     id="text41">3. RADIUS → AP → STA: EAP-Challenge</text>
  <text
     x="80"
     y="426"
     fill="#94a3b8"
     font-size="10"
     id="text42">4. STA → AP → RADIUS: EAP-Response (认证数据)</text>
  <text
     x="600"
     y="375"
     fill="#94a3b8"
     font-size="10"
     id="text43">5. RADIUS 验证用户，生成 PMK</text>
  <text
     x="600"
     y="392"
     fill="#94a3b8"
     font-size="10"
     id="text44">6. RADIUS → AP: Access-Accept + PMK</text>
  <text
     x="600"
     y="409"
     fill="#94a3b8"
     font-size="10"
     id="text45">7. AP 安装 PMK，开始 4-Way Handshake</text>
  <text
     x="600"
     y="426"
     fill="#94a3b8"
     font-size="10"
     id="text46">8. 4-Way Handshake → PTK → 加寅连接</text>
  <rect
     x="80"
     y="438"
     width="540"
     height="22"
     rx="3"
     fill="#7c2d12"
     id="rect46" />
  <text
     x="350"
     y="453"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="10"
     id="text47">比喝：认证是“交给认证中心的身份证”，AP 是“门卫”，只转发不决定</text>
  <rect
     x="640"
     y="438"
     width="500"
     height="22"
     rx="3"
     fill="#065f46"
     id="rect47" />
  <text
     x="890"
     y="453"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="10"
     id="text48">优点：每个用户独立密钥，可单独撑销访问权限</text>
</svg>
