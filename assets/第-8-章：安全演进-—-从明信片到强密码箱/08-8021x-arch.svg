     text-anchor="middle"
     fill="#e2e8f0"
     font-size="16"
     font-weight="700"
     id="text4">802.1X / RADIUS 企业级认证架构</text>
  <text
     x="600"
     y="48"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text5">802.11-2024 Section 12.6 (RSNA) | WPA2/WPA3 Enterprise</text>
  <!-- Three entities -->
  <rect
     x="60"
     y="70"
     width="220"
     height="120"
     rx="10"
     fill="url(#card-grad)"
     stroke="#8b5cf6"
