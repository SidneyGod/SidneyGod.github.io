  <text
     x="170"
     y="95"
     text-anchor="middle"
     fill="#c4b5fd"
     font-size="14"
     font-weight="700"
     id="text6">Supplicant</text>
  <text
     x="170"
     y="115"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text7">客户端 STA</text>
  <text
     x="170"
     y="135"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text8">通过 EAP 协议验证身份</text>
  <text
     x="170"
     y="155"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text9">提供认证凭据(证书/密钥)</text>
  <text
     x="170"
     y="175"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text10">会话密钥由 RADIUS 生成</text>
  <rect
     x="490"
     y="70"
     width="220"
     height="120"
     rx="10"
     fill="url(#card-grad)"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect10" />
  <text
     x="600"
     y="95"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="14"
     font-weight="700"
     id="text11">Authenticator</text>
  <text
     x="600"
     y="115"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text12">AP / 控制器</text>
  <text
     x="600"
     y="135"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text13">中间人：转发 EAP 帧</text>
  <text
     x="600"
     y="155"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text14">不知道密码，只转发</text>
  <text
     x="600"
     y="175"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text15">最终从 RADIUS 获得 PMK</text>
  <rect
     x="920"
     y="70"
     width="220"
     height="120"
     rx="10"
     fill="url(#card-grad)"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect15" />
  <text
     x="1030"
     y="95"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="14"
     font-weight="700"
     id="text16">Authentication Server</text>
  <text
     x="1030"
     y="115"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text17">RADIUS 服务器</text>
  <text
     x="1030"
     y="135"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text18">验证用户身份</text>
  <text
     x="1030"
     y="155"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text19">生成会话密钥 PMK</text>
  <text
     x="1030"
     y="175"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text20">发送给 AP 安装</text>
  <!-- Connections -->
  <line
     x1="280"
     y1="130"
     x2="490"
     y2="130"
     stroke="#8b5cf6"
     stroke-width="2"
