  <style
     id="style1">
    text { font-family: 'Maple Mono Normal NL NF CN', monospace; }
  </style>
  <defs
     id="defs4">
    <linearGradient
       id="bg-grad"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="card-grad"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
  </defs>
  <rect
     width="1200"
     height="500"
     fill="url(#bg-grad)"
     id="rect4" />
  <text
     x="600"
     y="30"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="16"
     font-weight="700"
     id="text4">802.11w PMF — 管理帧保护</text>
  <text
     x="600"
     y="48"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text5">802.11-2024 Section 11.4.7 (Protected Management Frames) | 必须在 WPA3 中启用</text>
  <!-- The Problem -->
  <rect
     x="40"
     y="65"
     width="540"
     height="135"
     rx="10"
     fill="url(#card-grad)"
     stroke="#ef4444"
     stroke-width="1.5"
     id="rect5" />
  <text
     x="310"
     y="88"
     text-anchor="middle"
     fill="#ef4444"
     font-size="13"
     font-weight="700"
     id="text6">问题：Deauth 攻击</text>
  <text
     x="60"
     y="112"
     fill="#94a3b8"
     font-size="10"
     id="text7">攻击者发送伪造的 Deauthentication 帧</text>
  <text
     x="60"
     y="128"
     fill="#94a3b8"
     font-size="10"
     id="text8">给 STA 或 AP，强制断开连接</text>
  <rect
     x="60"
     y="140"
     width="480"
     height="25"
     rx="4"
     fill="#7f1d1d"
     id="rect8" />
  <text
     x="300"
     y="157"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="10"
     id="text9">理论上：优势地位攻击 — 不需要知道密码，只需要知道 MAC 地址</text>
  <text
     x="60"
     y="182"
     fill="#fbbf24"
     font-size="10"
     id="text10">传统WiFi中管理帧无加密保护，任人都可以伪造</text>
  <!-- The Solution -->
  <rect
     x="620"
     y="65"
     width="540"
     height="135"
     rx="10"
     fill="url(#card-grad)"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect10" />
  <text
     x="890"
     y="88"
     text-anchor="middle"
     fill="#10b981"
     font-size="13"
     font-weight="700"
     id="text11">解决：管理帧加密</text>
  <text
     x="640"
     y="112"
     fill="#94a3b8"
     font-size="10"
     id="text12">使用 CCMP 加密管理帧，阻止伪造</text>
  <text
     x="640"
     y="128"
     fill="#94a3b8"
     font-size="10"
     id="text13">重点保护: Deauth, Disassociation, Action</text>
  <rect
     x="640"
     y="140"
     width="480"
     height="25"
     rx="4"
     fill="#065f46"
     id="rect13" />
  <text
     x="880"
     y="157"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="10"
     id="text14">使用 SA Query 协议(Action 帧)验证对方身份后才接受 Deauth</text>
  <text
     x="640"
     y="182"
     fill="#fbbf24"
     font-size="10"
     id="text15">相当于给路牌加上防伪标签，伪造的“前方封闭”路牌不再能骗到车辆</text>
  <!-- PMF Modes -->
  <rect
     x="40"
     y="220"
     width="1120"
     height="110"
     rx="10"
     fill="url(#card-grad)"
     stroke="#334155"
     stroke-width="1"
     id="rect15" />
  <text
     x="600"
     y="243"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="13"
     font-weight="700"
     id="text16">PMF 模式对比</text>
  <rect
     x="60"
     y="258"
     width="520"
     height="60"
     rx="6"
     fill="#0f172a"
     stroke="#f97316"
     stroke-width="1"
     id="rect16" />
  <text
     x="320"
     y="278"
     text-anchor="middle"
     fill="#f97316"
     font-size="11"
     font-weight="600"
     id="text17">Optional PMF (可选)</text>
  <text
     x="320"
     y="295"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text18">只保护支持 PMF 的 STA，不支持的 STA 还能连接</text>
  <text
     x="320"
     y="310"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text19">WPA2: 可选 | WPA3: 不允许只是 Optional</text>
  <rect
     x="620"
     y="258"
     width="520"
     height="60"
     rx="6"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="1"
     id="rect19" />
  <text
     x="880"
     y="278"
     text-anchor="middle"
     fill="#10b981"
     font-size="11"
     font-weight="600"
     id="text20">Required PMF (必须)</text>
  <text
     x="880"
     y="295"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text21">所有 STA 必须支持 PMF，否则不允许连接</text>
  <text
     x="880"
     y="310"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text22">WPA3: 强制 Required | MLO: 强制 Required (802.11be Sec 35.3.4)</text>
  <!-- Protected Frames Table -->
  <rect
     x="40"
     y="345"
     width="1120"
     height="145"
     rx="10"
     fill="url(#card-grad)"
     stroke="#334155"
     stroke-width="1"
     id="rect22" />
  <text
     x="600"
     y="368"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="13"
     font-weight="700"
     id="text23">被保护的管理帧</text>
  <rect
     x="60"
     y="383"
     width="1080"
     height="26"
     rx="4"
     fill="#1e293b"
     id="rect23" />
  <text
     x="250"
     y="401"
     text-anchor="middle"
     fill="#60a5fa"
     font-size="10"
     font-weight="600"
     id="text24">帧类型</text>
  <text
     x="550"
     y="401"
     text-anchor="middle"
     fill="#60a5fa"
     font-size="10"
     font-weight="600"
     id="text25">是否保护</text>
  <text
     x="850"
     y="401"
     text-anchor="middle"
     fill="#60a5fa"
     font-size="10"
     font-weight="600"
     id="text26">说明</text>
  <rect
     x="60"
     y="409"
     width="1080"
     height="24"
     rx="0"
     fill="#0f172a"
     id="rect26" />
  <text
     x="250"
     y="425"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="9"
     id="text27">Deauthentication</text>
  <text
     x="550"
     y="425"
     text-anchor="middle"
     fill="#10b981"
     font-size="9"
     id="text28">强制 ✓</text>
  <text
     x="850"
     y="425"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text29">阻止伪造断开连接</text>
  <rect
     x="60"
     y="433"
     width="1080"
     height="24"
     rx="0"
     fill="#1e293b"
     id="rect29" />
  <text
     x="250"
     y="449"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="9"
     id="text30">Disassociation</text>
  <text
     x="550"
     y="449"
     text-anchor="middle"
     fill="#10b981"
     font-size="9"
     id="text31">强制 ✓</text>
  <text
     x="850"
     y="449"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text32">阻止伪造断开关联</text>
  <rect
     x="60"
     y="457"
     width="1080"
     height="24"
     rx="0"
     fill="#0f172a"
     id="rect32" />
  <text
     x="250"
     y="473"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="9"
     id="text33">Action (SA Query)</text>
  <text
     x="550"
     y="473"
     text-anchor="middle"
     fill="#10b981"
     font-size="9"
     id="text34">强制 ✓</text>
  <text
     x="850"
     y="473"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text35">用于 PMF 身份验证和 EML 状态切换</text>
  <rect
     x="60"
     y="481"
     width="1080"
     height="0"
     rx="0"
     fill="#1e293b"
     id="rect35" />
</svg>
