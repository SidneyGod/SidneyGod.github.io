  <rect
     width="1200"
     height="400"
     fill="url(#bg-grad)"
     id="rect4" />
  <text
     x="600"
     y="30"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="16"
     font-weight="700"
     id="text4">WEP 加密流程 — RC4 流密码加密</text>
  <text
     x="600"
     y="48"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text5">802.11-1999 Section 8.2 | IV(24bit) + Key → RC4 → XOR Plaintext → Ciphertext</text>
  <!-- Plaintext Input -->
  <rect
     x="40"
     y="75"
     width="180"
     height="70"
     rx="8"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect5" />
  <text
     x="130"
     y="100"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="12"
     font-weight="700"
     id="text6">明文 (M)</text>
  <text
     x="130"
     y="118"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text7">数据帧载荷</text>
  <text
     x="130"
     y="133"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text8">802.11 Header + Payload</text>
  <!-- CRC-32 -->
  <rect
     x="270"
     y="75"
     width="160"
     height="70"
     rx="8"
     fill="#0f172a"
     stroke="#ef4444"
     stroke-width="1.5"
     id="rect8" />
  <text
     x="350"
     y="100"
     text-anchor="middle"
     fill="#ef4444"
     font-size="12"
     font-weight="700"
     id="text9">CRC-32</text>
  <text
     x="350"
     y="118"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text10">计算校验和 (ICV)</text>
  <text
     x="350"
     y="133"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="9"
     id="text11">不是密码学安全的 MAC</text>
  <!-- M || ICV -->
  <rect
     x="480"
     y="75"
     width="140"
     height="70"
     rx="8"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect11" />
  <text
     x="550"
     y="100"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="12"
     font-weight="700"
     id="text12">M || ICV</text>
  <text
     x="550"
     y="118"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text13">拼接后的数据</text>
  <!-- Arrows -->
  <line
     x1="220"
     y1="110"
     x2="270"
     y2="110"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line13" />
  <line
     x1="430"
     y1="110"
     x2="480"
     y2="110"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line14" />
  <!-- RC4 Key Generation -->
  <rect
     x="40"
     y="175"
     width="280"
     height="90"
     rx="8"
     fill="#0f172a"
     stroke="#f97316"
     stroke-width="1.5"
     id="rect14" />
  <text
     x="180"
     y="200"
     text-anchor="middle"
     fill="#f97316"
     font-size="12"
     font-weight="700"
     id="text14">RC4 密钥生成</text>
  <text
     x="60"
     y="220"
     fill="#94a3b8"
     font-size="10"
     id="text15">IV (24 bit) → 拼接</text>
  <text
     x="60"
     y="238"
     fill="#94a3b8"
     font-size="10"
     id="text16">Key (104 bit)</text>
  <text
     x="60"
     y="256"
     fill="#94a3b8"
     font-size="10"
     id="text17">= RC4 种子 (128 bit)</text>
  <!-- RC4 KSA + PRGA -->
  <rect
     x="370"
     y="175"
     width="250"
     height="90"
     rx="8"
     fill="#0f172a"
     stroke="#f97316"
     stroke-width="1.5"
     id="rect17" />
  <text
     x="495"
     y="200"
     text-anchor="middle"
     fill="#f97316"
     font-size="12"
     font-weight="700"
     id="text18">RC4 (KSA + PRGA)</text>
  <text
     x="390"
     y="220"
     fill="#94a3b8"
     font-size="10"
     id="text19">KSA: 密钥制程 → S 结构未充分扰乱</text>
  <text
     x="390"
     y="238"
     fill="#94a3b8"
     font-size="10"
     id="text20">PRGA: 伪随机密钥流</text>
  <text
     x="390"
     y="256"
     fill="#94a3b8"
     font-size="10"
     id="text21">输出: Keystream (N bytes)</text>
  <!-- Arrows -->
  <line
     x1="320"
     y1="220"
     x2="370"
     y2="220"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line21" />
  <!-- XOR -->
  <rect
     x="680"
     y="140"
     width="120"
     height="80"
     rx="8"
     fill="#312e81"
     stroke="#8b5cf6"
     stroke-width="2"
     id="rect21" />
  <text
     x="740"
     y="175"
     text-anchor="middle"
     fill="#c4b5fd"
     font-size="14"
     font-weight="700"
     id="text22">XOR</text>
  <text
     x="740"
     y="195"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text23">密码流 ⊕ 明文</text>
  <!-- Arrows to XOR -->
  <line
     x1="620"
     y1="220"
     x2="680"
     y2="180"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line23" />
  <line
     x1="550"
     y1="145"
     x2="680"
     y2="160"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line24" />
  <!-- Ciphertext Output -->
  <rect
     x="860"
     y="140"
     width="200"
     height="80"
     rx="8"
     fill="#065f46"
     stroke="#10b981"
     stroke-width="2"
     id="rect24" />
  <text
     x="960"
     y="170"
     text-anchor="middle"
     fill="#10b981"
     font-size="13"
     font-weight="700"
     id="text24">密文 (C)</text>
  <text
     x="960"
     y="190"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text25">IV(3) + Encrypted(M||ICV)</text>
  <line
     x1="800"
     y1="180"
     x2="860"
     y2="180"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arrow-r)"
     id="line25" />
  <!-- Key issues -->
  <rect
     x="40"
     y="290"
     width="1120"
     height="95"
     rx="8"
     fill="url(#card-grad)"
     stroke="#334155"
     stroke-width="1"
     id="rect25" />
  <text
     x="600"
     y="313"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="13"
     font-weight="700"
     id="text26">WEP 加密的核心问题</text>
  <rect
     x="60"
     y="325"
     width="340"
     height="50"
     rx="4"
     fill="#7f1d1d"
     id="rect26" />
  <text
     x="230"
     y="345"
     text-anchor="middle"
     fill="#ef4444"
     font-size="10"
     font-weight="600"
     id="text27">IV 太短 (24 bit)</text>
  <text
     x="230"
     y="363"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text28">16.7M 种，几小时内重复 → 密钥流重用</text>
  <rect
     x="430"
     y="325"
     width="340"
     height="50"
     rx="4"
     fill="#7f1d1d"
     id="rect28" />
  <text
     x="600"
     y="345"
     text-anchor="middle"
     fill="#ef4444"
     font-size="10"
     font-weight="600"
     id="text29">CRC-32 不是 MAC</text>
  <text
     x="600"
     y="363"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text30">线性运算，可被等收而不被发现</text>
  <rect
     x="800"
     y="325"
     width="340"
     height="50"
     rx="4"
     fill="#7f1d1d"
     id="rect30" />
  <text
     x="970"
     y="345"
     text-anchor="middle"
     fill="#ef4444"
     font-size="10"
     font-weight="600"
     id="text31">IV 明文传输</text>
  <text
     x="970"
     y="363"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text32">攻击者可收集 IV 进行经统分析</text>
</svg>
