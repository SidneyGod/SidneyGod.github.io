  <text
     x="315"
     y="326"
     text-anchor="middle"
     fill="#22c55e"
     font-size="14"
     font-weight="700"
     id="text20">NAN Cluster 同步层级</text>
  <text
     x="110"
     y="354"
     fill="#cbd5e1"
     font-size="12"
     id="text21">· Cluster：对同一块表的一群设备（Cluster ID）</text>
  <text
     x="110"
     y="380"
     fill="#cbd5e1"
     font-size="12"
     id="text22">· Anchor Master：全簇时间基准（Master Rank 最高）</text>
  <text
     x="110"
     y="406"
     fill="#cbd5e1"
     font-size="12"
     id="text23">· 记录 AMR / Hop Count / AMBTT 逐跳传播同步</text>
  <text
     x="110"
     y="432"
     fill="#cbd5e1"
     font-size="12"
     id="text24">· 角色：Master / Non-Master Sync / Non-Master Non-Sync</text>
  <text
     x="110"
     y="458"
     fill="#fbbf24"
     font-size="12"
     id="text25">· AMBTT 连续 3 个 DW 未更新 → 自己顶上当基准</text>
  <text
     x="110"
     y="488"
     fill="#94a3b8"
     font-size="12"
     id="text26">· 同步 Beacon 与发现 Beacon 均以 6 Mbps 发送</text>
  <rect
     x="560"
     y="300"
     width="450"
     height="210"
     rx="8"
     fill="url(#card)"
     stroke="#3b82f6"
     id="rect26" />
  <text
     x="785"
     y="326"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="14"
     font-weight="700"
     id="text27">Master 选举与合并</text>
  <text
     x="580"
     y="354"
     fill="#cbd5e1"
     font-size="12"
     id="text28">· Master Rank = Master Preference(0-255) + Random Factor</text>
  <text
     x="580"
     y="380"
     fill="#cbd5e1"
     font-size="12"
     id="text29">· 基础设施设备 Preference ≥ 128，普通设备 &lt; 128</text>
  <text
     x="580"
     y="406"
     fill="#cbd5e1"
     font-size="12"
     id="text30">· 值 1 和 255 保留测试用；改值后 240 DW 内不可再改</text>
  <text
     x="580"
     y="432"
     fill="#cbd5e1"
     font-size="12"
     id="text31">· 加入 Cluster Grade(CG) 最高的簇；CG 相同选 AMR 最高</text>
  <text
     x="580"
     y="458"
     fill="#fbbf24"
     font-size="12"
     id="text32">· 听到不同 Cluster ID → 触发合并，收敛到 CG 更高者</text>
  <text
     x="580"
     y="488"
     fill="#94a3b8"
     font-size="12"
     id="text33">· 发现信道：2.4G 信道 6（可选 + 一个 5G 信道）</text>
</svg>
