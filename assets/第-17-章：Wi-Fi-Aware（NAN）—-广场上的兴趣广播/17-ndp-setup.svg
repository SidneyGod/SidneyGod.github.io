         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="card"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
    <style
       id="style4">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
  </defs>
  <rect
     width="1100"
     height="600"
     fill="url(#bg)"
     id="rect4" />
  <text
     x="550"
     y="36"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text4">NAN 数据路径（NDP）建立 — 发现后直接建通道，不经 AP</text>
  <!-- actors -->
  <rect
     x="170"
     y="60"
     width="220"
     height="46"
     rx="6"
     fill="#1d4ed8"
     stroke="#3b82f6"
     stroke-width="2"
     id="rect5" />
  <text
     x="280"
     y="82"
     text-anchor="middle"
     fill="#fff"
     font-size="14"
     font-weight="700"
     id="text5">订阅者 = NDP Initiator</text>
  <text
     x="280"
     y="99"
     text-anchor="middle"
     fill="#bfdbfe"
     font-size="10"
     id="text6">服务订阅方发起</text>
  <rect
     x="710"
     y="60"
     width="220"
     height="46"
     rx="6"
     fill="#0f766e"
     stroke="#14b8a6"
     stroke-width="2"
     id="rect6" />
  <text
     x="820"
     y="82"
     text-anchor="middle"
     fill="#fff"
     font-size="14"
     font-weight="700"
     id="text7">发布者 = NDP Responder</text>
  <text
     x="820"
     y="99"
     text-anchor="middle"
     fill="#99f6e4"
     font-size="10"
     id="text8">被发现的服务方</text>
  <line
     x1="280"
     y1="106"
     x2="280"
     y2="430"
     stroke="#334155"
     stroke-width="2"
     id="line8" />
  <line
     x1="820"
     y1="106"
     x2="820"
     y2="430"
     stroke="#334155"
     stroke-width="2"
     id="line9" />
  <!-- step 1 -->
  <line
     x1="280"
     y1="150"
     x2="820"
     y2="150"
     stroke="#3b82f6"
     stroke-width="2"
     id="line10" />
  <polygon
     points="820,150 808,144 808,156"
     fill="#3b82f6"
     id="polygon10" />
  <text
     x="550"
     y="142"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="13"
     font-weight="700"
     id="text10">① Data Path Request NAF</text>
  <text
     x="550"
     y="170"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text11">NDP 属性(Type=Request) · Device Capability · HT/VHT/HE Capability</text>
  <!-- step 2 -->
  <rect
     x="690"
     y="190"
     width="260"
     height="40"
     rx="5"
     fill="#0f3a3a"
     stroke="#14b8a6"
     id="rect11" />
  <text
     x="820"
     y="208"
     text-anchor="middle"
     fill="#5eead4"
     font-size="11"
     id="text12">② DataIndication（通知上层）</text>
  <text
     x="820"
     y="224"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text13">应用决定 Accept / Reject</text>
  <!-- step 3 -->
  <line
     x1="820"
     y1="260"
     x2="280"
     y2="260"
     stroke="#14b8a6"
     stroke-width="2"
     id="line13" />
  <polygon
     points="280,260 292,254 292,266"
     fill="#14b8a6"
     id="polygon13" />
  <text
     x="550"
     y="252"
     text-anchor="middle"
     fill="#5eead4"
     font-size="13"
     font-weight="700"
     id="text14">③ Data Path Response NAF（Accepted / Rejected）</text>
  <text
     x="550"
     y="280"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text15">同时建立 NDL Schedule（若两设备间尚无）</text>
  <!-- step 4 secure -->
  <line
     x1="280"
     y1="320"
     x2="820"
     y2="320"
     stroke="#a855f7"
     stroke-width="1.5"
     stroke-dasharray="5,3"
     id="line15" />
  <polygon
     points="820,320 810,315 810,325"
     fill="#a855f7"
     id="polygon15" />
  <line
     x1="820"
     y1="348"
     x2="280"
     y2="348"
     stroke="#a855f7"
     stroke-width="1.5"
     stroke-dasharray="5,3"
     id="line16" />
  <polygon
     points="280,348 290,343 290,353"
     fill="#a855f7"
     id="polygon16" />
  <text
     x="550"
     y="312"
     text-anchor="middle"
     fill="#d8b4fe"
     font-size="12"
     font-weight="700"
     id="text16">④ （需安全时）4 次握手 → 建立 ND-TKSA</text>
  <text
     x="550"
     y="372"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text17">附带安全属性(CSID / ND-PMKID)；双方 DataConfirm = Accepted</text>
  <!-- data -->
  <rect
     x="280"
     y="392"
     width="540"
     height="36"
     rx="6"
     fill="#7c2d12"
     opacity="0.5"
     stroke="#f97316"
     id="rect17" />
  <text
     x="550"
     y="415"
     text-anchor="middle"
     fill="#fdba74"
     font-size="12"
     font-weight="700"
     id="text18">▶ 用 NDI 在 NDC 约定的资源块/信道上传数据（全程不经 AP）</text>
  <!-- three layers card -->
  <rect
     x="90"
     y="455"
     width="920"
     height="125"
     rx="8"
     fill="url(#card)"
     stroke="#22c55e"
     id="rect18" />
  <text
     x="550"
     y="481"
     text-anchor="middle"
     fill="#22c55e"
     font-size="14"
     font-weight="700"
     id="text19">三个层次：NDP / NDL / NDC</text>
  <text
     x="110"
     y="509"
     fill="#cbd5e1"
     font-size="12"
     id="text20">· NDP（NAN Data Path）= 一条具体数据路径 → 一笔具体交易</text>
  <text
     x="110"
     y="533"
     fill="#cbd5e1"
     font-size="12"
     id="text21">· NDL（NAN Device Link）= 两设备间链路，由双方 NMI 唯一标识，可承载多条 NDP → 长期合作关系</text>
  <text
     x="110"
     y="557"
     fill="#cbd5e1"
     font-size="12"
     id="text22">· NDC（NAN Data Cluster）= 一组设备约定共同醒着收发的资源块时间表 → 固定碰头时段</text>
</svg>
