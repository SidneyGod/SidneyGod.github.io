     id="polygon9"
     transform="translate(-34,-78)" />
  <text
     x="516"
     y="138"
     text-anchor="middle"
     fill="#7dd3fc"
     font-size="12px"
     id="text10">ANQP Query：你支持哪些 realm / 漫游联盟？用什么 EAP？</text>
  <!-- ANQP Response -->
  <line
     x1="833.97101"
     y1="187"
     x2="145.85507"
     y2="187"
     stroke="#22d3ee"
     stroke-width="2"
     id="line10" />
  <polygon
     points="232,265 248,271 248,259 "
     fill="#22d3ee"
     id="polygon10"
     transform="translate(-100,-78)" />
  <text
     x="482"
     y="207"
     text-anchor="middle"
     fill="#67e8f9"
     font-size="12px"
     id="text11">ANQP Response：Operator Friendly Name / NAI Realm / Roaming Consortium / 3GPP Cellular Network …</text>
  <!-- GAS 容器标注 -->
  <rect
     x="336"
     y="82"
     width="360"
     height="26"
     rx="5"
     fill="none"
     stroke="#334155"
     stroke-dasharray="4, 3"
     id="rect11" />
  <text
     x="516"
     y="100"
     text-anchor="middle"
     fill="#64748b"
     font-size="11px"
     id="text12">都用 GAS（Public Action 帧）承载，无需先关联</text>
  <text
     x="516"
     y="258"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="13px"
     id="text13">设备拿查到的 realm/OI 与自己凭证比对 → 对得上就自动用对应 EAP 认证接入</text>
  <text
     x="516"
     y="284"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12px"
     id="text14">选网从&quot;猜 SSID 名字&quot;变成&quot;按运营商/漫游关系精确匹配&quot;——这就是无感漫游的基础</text>
