     y="0" />
  <text
     x="516"
     y="38"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20px"
     font-weight="700"
     id="text2">GAS / ANQP — 关联前的&quot;隔空问询&quot;</text>
  <text
     x="516"
     y="62"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13px"
     id="text3">设备在 association 之前就能查清 AP 背后是谁、收不收我的卡</text>
  <!-- STA -->
  <rect
     x="16"
     y="122"
     width="115.21739"
     height="90"
     rx="7.6811595"
     fill="#075985"
     stroke="#38bdf8"
     stroke-width="1.75284"
     id="rect3" />
  <text
     x="73"
     y="157"
     text-anchor="middle"
     fill="#7dd3fc"
     font-size="15px"
     font-weight="700"
     id="text4">手机 STA</text>
  <text
     x="73"
     y="180"
     text-anchor="middle"
     fill="#bae6fd"
     font-size="11px"
     id="text5">存有运营商凭证</text>
  <text
     x="73"
     y="198"
     text-anchor="middle"
     fill="#bae6fd"
     font-size="11px"
     id="text6">(SIM/证书/账号)</text>
  <!-- AP -->
  <rect
     x="834"
     y="122"
     width="150"
     height="90"
     rx="10"
     fill="#475569"
     stroke="#94a3b8"
     stroke-width="2"
     id="rect6" />
  <text
     x="909"
     y="157"
     text-anchor="middle"
     fill="#ffffff"
     font-size="15px"
     font-weight="700"
     id="text7">Passpoint AP</text>
  <text
     x="909"
     y="180"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11px"
     id="text8">背后是某运营商</text>
  <text
     x="909"
     y="198"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11px"
     id="text9">+ 漫游伙伴</text>
  <!-- ANQP Query -->
  <line
     x1="133.53622"
     y1="147"
     x2="826"
     y2="147"
     stroke="#38bdf8"
     stroke-width="2"
     id="line9" />
  <polygon
     points="868,225 852,231 852,219 "
