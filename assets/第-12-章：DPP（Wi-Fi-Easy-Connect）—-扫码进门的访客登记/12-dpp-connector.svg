   height="550"
   version="1.1"
   id="svg26"
   sodipodi:docname="12-dpp-connector.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview26"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.48"
     inkscape:cx="550.33784"
     inkscape:cy="280.06757"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg26" />
  <defs
     id="defs4">
    <linearGradient
       id="bg"
       x1="0"
       y1="0"
       x2="784.85669"
       y2="784.85669"
       gradientTransform="scale(1.2104121,0.70076489)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="card"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
    <style
       id="style4">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
    <marker
       id="ar"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#22d3ee"
         id="path4" />
    </marker>
    <linearGradient
       inkscape:collect="always"
       xlink:href="#card"
       id="linearGradient26"
       x1="60.712517"
       y1="344.49237"
       x2="60.712517"
       y2="482.28934"
       gradientTransform="matrix(1.465925,0,0,0.68216313,-76,-6)"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       inkscape:collect="always"
       xlink:href="#card"
       id="linearGradient27"
       x1="285.66165"
       y1="361.14401"
       x2="285.66165"
       y2="505.60162"
       gradientTransform="matrix(1.536783,0,0,0.65070994,-76,-6)"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       inkscape:collect="always"
       xlink:href="#card"
       id="linearGradient28"
       x1="551.87"
       y1="344.49237"
       x2="551.87"
       y2="482.28934"
       gradientTransform="matrix(1.465925,0,0,0.68216313,-76,-6)"
       gradientUnits="userSpaceOnUse" />
  </defs>
  <rect
     width="950"
     height="550"
     fill="url(#bg)"
     id="rect4"
     style="fill:url(#bg);stroke-width:0.920986"
     x="0"
     y="0" />
  <text
     x="474"
     y="30"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20px"
     font-weight="700"
     id="text4">Connector — 一张可全网验证的&quot;门禁卡&quot;</text>
  <text
     x="474"
     y="54"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13px"
     id="text5">设备与 AP 各持门卫签发的卡，互验签后 ECDH 算出 PMK，再走标准四次握手；无需共享同一个 WiFi 密码</text>
  <!-- Configurator 签发 -->
  <rect
     x="302.91891"
     y="78"
     width="342.83783"
     height="62"
     rx="12.244208"
     fill="#312e81"
     stroke="#818cf8"
     stroke-width="2.21307"
     id="rect5" />
  <text
     x="474"
     y="104"
     text-anchor="middle"
     fill="#c7d2fe"
     font-size="15px"
     font-weight="700"
     id="text6">Configurator（门卫）</text>
  <text
     x="474"
     y="125"
     text-anchor="middle"
     fill="#a5b4fc"
     font-size="10.5px"
     id="text7">持签名密钥 C-sign-key，给每台设备和 AP 签发 Connector</text>
  <!-- 签发箭头 (虚线) 到 STA A / STA B / AP -->
  <line
     x1="394"
     y1="140"
     x2="114"
     y2="226"
     stroke="#818cf8"
     stroke-width="1.5"
     stroke-dasharray="5, 4"
     id="line7" />
  <line
     x1="474"
     y1="140"
     x2="474"
     y2="226"
     stroke="#818cf8"
     stroke-width="1.5"
     stroke-dasharray="5, 4"
     id="line8" />
  <line
     x1="554"
     y1="140"
     x2="834"
     y2="226"
     stroke="#818cf8"
     stroke-width="1.5"
     stroke-dasharray="5, 4"
     id="line9" />
  <text
     x="164.32018"
     y="245.78195"
     fill="#a5b4fc"
     font-size="11px"
     transform="rotate(-17)"
     id="text9">签发卡</text>
  <text
     x="722.02942"
     y="-6.0819349"
     fill="#a5b4fc"
     font-size="11px"
     transform="rotate(15)"
     id="text10">签发卡</text>
  <!-- STA A -->
  <rect
     x="14"
     y="230"
     width="200"
     height="92"
     rx="10"
     fill="url(#card)"
     stroke="#a78bfa"
     stroke-width="2"
     id="rect10"
     style="fill:url(#linearGradient26)" />
  <text
     x="114"
     y="257"
     text-anchor="middle"
     fill="#ddd6fe"
     font-size="14px"
     font-weight="700"
     id="text11">STA A（灯泡）</text>
  <rect
     x="30.891891"
     y="272"
     width="158.10811"
     height="34"
     rx="5.2702703"
     fill="#3f2d6b"
     id="rect11"
     style="stroke-width:1.02667" />
  <text
     x="114"
     y="294"
     text-anchor="middle"
     fill="#ede9fe"
     font-size="10.5px"
     id="text12">Connector A（含公钥 NK）</text>
  <!-- AP（居中）-->
  <rect
     x="364"
     y="230"
     width="220"
     height="92"
     rx="10"
     fill="url(#card)"
     stroke="#34d399"
     stroke-width="2"
     id="rect12"
     style="fill:url(#linearGradient27)" />
  <text
     x="474"
     y="257"
     text-anchor="middle"
     fill="#a7f3d0"
     font-size="14px"
     font-weight="700"
     id="text13">AP（路由器）</text>
  <rect
     x="389"
     y="272"
     width="170"
     height="34"
     rx="5"
     fill="#0c3a2e"
     id="rect13" />
  <text
     x="474"
     y="294"
     text-anchor="middle"
     fill="#d1fae5"
     font-size="10.5px"
     id="text14">Connector AP（含公钥 PK）</text>
  <!-- STA B -->
  <rect
     x="734"
     y="230"
     width="200"
     height="92"
     rx="10"
     fill="url(#card)"
     stroke="#a78bfa"
     stroke-width="2"
     id="rect14"
     style="fill:url(#linearGradient28)" />
  <text
     x="834"
     y="257"
     text-anchor="middle"
     fill="#ddd6fe"
     font-size="14px"
     font-weight="700"
     id="text15">STA B（音箱）</text>
  <rect
     x="753.5946"
     y="272"
     width="155.40541"
     height="34"
     rx="5.1801801"
     fill="#3f2d6b"
     id="rect15"
     style="stroke-width:1.01786" />
  <text
     x="834"
     y="294"
     text-anchor="middle"
     fill="#ede9fe"
     font-size="10.5px"
     id="text16">Connector B（含公钥 NK）</text>
  <!-- 每台 STA 与 AP 互亮卡 (双向箭头)：左 STA A↔AP，右 AP↔STA B -->
  <line
     x1="216"
     y1="282"
     x2="362"
     y2="282"
     stroke="#22d3ee"
     stroke-width="2.5"
     marker-end="url(#ar)"
     id="line16" />
  <line
     x1="362"
     y1="298"
     x2="216"
     y2="298"
     stroke="#22d3ee"
     stroke-width="2.5"
     marker-end="url(#ar)"
     id="line17" />
  <line
     x1="586"
     y1="282"
     x2="732"
     y2="282"
     stroke="#22d3ee"
     stroke-width="2.5"
     marker-end="url(#ar)"
     id="line18" />
  <line
     x1="732"
     y1="298"
     x2="586"
     y2="298"
     stroke="#22d3ee"
     stroke-width="2.5"
     marker-end="url(#ar)"
     id="line19" />
  <text
     x="474"
     y="342"
     text-anchor="middle"
     fill="#67e8f9"
     font-size="11px"
     font-weight="700"
     id="text19">各 STA 与 AP 互亮卡·验签（Network Introduction）</text>
  <!-- 流程条：互认 -> ECDH -> PMK -> 四次握手 -->
  <rect
     x="14"
     y="352"
     width="920"
     height="48"
     rx="8"
     fill="#0c2a16"
     stroke="#22c55e"
     stroke-width="1.5"
     id="rect19" />
  <text
     x="474"
     y="374"
     text-anchor="middle"
     fill="#86efac"
     font-size="12.5px"
     font-weight="700"
     id="text20">① 交换 Connector，用门卫公钥 C-sign-key 验对方卡：是否门卫所签、是否同组授权</text>
  <text
     x="474"
     y="392"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11px"
     id="text21">② 各用「自己私钥 nk × 对方卡里公钥」做 ECDH → 双方算出同一把 PMK / PMKID</text>
  <rect
     x="14"
     y="410"
     width="920"
     height="44"
     rx="8"
     fill="#312e81"
     stroke="#6366f1"
     stroke-width="2"
     id="rect21" />
  <text
     x="474"
     y="432"
     text-anchor="middle"
     fill="#c7d2fe"
     font-size="12.5px"
     font-weight="700"
     id="text22">③ 把 PMK 喂给标准 WPA2/WPA3 四次握手 → 建 PTK → 加密上网（802.11 第 8 章）</text>
  <text
     x="474"
     y="447"
     text-anchor="middle"
     fill="#a5b4fc"
     font-size="10.5px"
     id="text23">DPP 只改变&quot;PMK 从哪来&quot;，链路加密本身仍是 802.11 那套</text>
  <text
     x="474"
     y="484"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="12.5px"
     id="text24">好处：每台设备各持一把私钥，<tspan
   fill="#fbbf24"
   id="tspan23">不共享同一个 WiFi 密码</tspan>；新增设备只需门卫发卡</text>
  <text
     x="474"
     y="508"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="12px"
     id="text25">撤销某台设备：只作废它的 Connector，不必改全网密码、不惊动其他设备</text>
  <text
     x="474"
     y="532"
     text-anchor="middle"
     fill="#64748b"
     font-size="10.5px"
     id="text26">注：Connector 也支持 STA 之间直接互认（P2P），但本章主线是&quot;设备连 AP&quot;，故以 STA↔AP 为例</text>
</svg>
