  <text
     x="627"
     y="694"
     text-anchor="middle"
     fill="#a5b4fc"
     font-size="10.5px"
     id="text34">把 ③ 算出的 PMK 喂进去 → 建 PTK → 加密上网（802.11 第 8 章）</text>
  <text
     x="627"
     y="708"
     text-anchor="middle"
     fill="#818cf8"
     font-size="9.5px"
     id="text35">DPP 负责&quot;发凭证 + 互认&quot;，真正的链路加密仍由 RSNA 四次握手完成</text>
  <text
     x="472"
     y="752"
     text-anchor="middle"
     fill="#64748b"
     font-size="11px"
     id="text36">帧类型小结：① ③ 为 Public Action 帧；② 的两帧借用 GAS（关联前查询载体），结果帧又回到 Public Action</text>
  <text
     x="472"
     y="772"
     text-anchor="middle"
     fill="#64748b"
     font-size="10.5px"
     id="text37">若 ② 下发的是 PSK/SAE（非 Connector），则跳过 ③，Enrollee 直接当普通 STA 用该密码连 AP</text>
