  <rect
     width="900"
     height="520"
     fill="url(#bg-grad)"
     id="rect5" />
  <text
     x="450"
     y="28"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="15"
     font-weight="700"
     id="text5">MTK: skb 拷贝机制</text>
  <text
     x="450"
     y="46"
     text-anchor="middle"
     fill="#64748b"
     font-size="10"
     id="text6">skb_realloc_headroom() + CFG_SUPPORT_SKB_CLONED_COPY = 每包 1~2 次 memcpy</text>
  <!-- Protocol Stack skb -->
  <rect
     x="100"
     y="70"
     width="200"
     height="70"
     rx="6"
     fill="#1e1b4b"
     stroke="#7c3aed"
     stroke-width="1.5"
     id="rect6" />
  <text
     x="200"
     y="95"
     text-anchor="middle"
     fill="#a855f7"
     font-size="12"
     font-weight="600"
     id="text7">协议栈下来的 skb</text>
  <text
     x="200"
     y="112"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text8">headroom: ~64 字节</text>
  <text
     x="200"
     y="126"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text9">data: 1500 字节 (MTU)</text>
  <!-- skb_realloc_headroom -->
  <rect
     x="340"
     y="70"
     width="280"
     height="70"
     rx="6"
     fill="#1c1917"
     stroke="#f97316"
     stroke-width="1.5"
     id="rect9" />
  <text
     x="450"
     y="93"
     text-anchor="middle"
     fill="#f97316"
     font-size="12"
     font-weight="600"
     id="text10">skb_realloc_headroom()</text>
  <text
     x="450"
     y="110"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="9"
     id="text11">headroom 不足 (&lt; 32 + txd_append_size)</text>
  <text
     x="450"
     y="124"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="9"
     id="text12">→ pskb_expand_head() + memcpy(1500B)</text>
  <line
     x1="300"
     y1="97"
     x2="335"
     y2="97"
     stroke="#f97316"
     stroke-width="1.5"
     marker-end="url(#arrow-orange)"
     id="line12" />
  <!-- New skb with expanded headroom -->
  <rect
     x="640"
     y="58"
     width="225"
     height="94"
     rx="6"
     fill="#052e16"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect12"
     style="display:inline" />
  <text
     x="740"
     y="80"
     text-anchor="middle"
     fill="#10b981"
     font-size="12"
     font-weight="600"
     id="text13">新 skb (headroom 扩充后)</text>
  <text
     x="740"
     y="97"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text14">headroom: 32 + txd_append_size</text>
  <text
     x="740"
     y="111"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text15">TXD 描述符 (写在 headroom)</text>
  <text
     x="740"
     y="125"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text16">QUE_ENTRY (16B 队列指针)</text>
  <text
     x="740"
     y="139"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text17">data: 1500 字节 (memcpy 拷贝)</text>
  <line
     x1="620"
     y1="97"
     x2="639.82574"
     y2="97"
     stroke="#10b981"
     stroke-width="1"
     marker-end="url(#arrow-green)"
     id="line17" />
  <!-- Clone check -->
  <polygon
     points="740,226 650,198 740,170 830,198 "
     fill="#1c1917"
     stroke="#eab308"
     stroke-width="1.5"
     id="polygon17"
     style="display:inline" />
  <text
     x="740"
     y="209"
     text-anchor="middle"
     fill="#eab308"
     font-size="10px"
     font-weight="600"
     id="text18">skb_cloned?</text>
  <!-- NO path -->
  <path
     d="M 740,226 L 740,260"
     stroke="#10b981"
     stroke-width="1.5"
     fill="none"
     marker-end="url(#arrow-green)"
     id="path18" />
  <text
     x="724.12866"
     y="238.95174"
     fill="#10b981"
     font-size="9px"
     id="text19">NO</text>
  <rect
     x="640"
     y="260"
     width="200"
     height="50"
     rx="6"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="1"
     id="rect19" />
  <text
     x="740"
     y="280"
     text-anchor="middle"
     fill="#10b981"
     font-size="11"
     font-weight="600"
     id="text20">直接 DMA 发送</text>
  <text
     x="740"
     y="296"
     text-anchor="middle"
     fill="#64748b"
     font-size="9"
     id="text21">TXD + data → WFDMA → 固件</text>
  <!-- YES path -->
  <path
     d="m 830,198 h 53.87399 l 0,158.44772 -24.72184,0"
     stroke="#ef4444"
     stroke-width="1.74081"
     fill="none"
     marker-end="url(#arrow-red)"
     id="path21"
     sodipodi:nodetypes="cccc" />
  <text
     x="784"
     y="194"
     fill="#ef4444"
     font-size="9px"
     text-anchor="end"
     id="text22">YES (多 BSSID)</text>
  <!-- skb_copy_expand -->
  <rect
     x="560"
     y="320"
     width="300"
     height="70"
     rx="6"
     fill="#1c1917"
     stroke="#ef4444"
     stroke-width="1.5"
     id="rect22" />
  <text
     x="710"
     y="343"
     text-anchor="middle"
     fill="#ef4444"
     font-size="12px"
     font-weight="600"
     id="text23">skb_copy_expand() — 第二次拷贝</text>
  <text
     x="710"
     y="360"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="9px"
     id="text24">CFG_SUPPORT_SKB_CLONED_COPY = 1</text>
  <text
     x="710"
     y="374"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="9px"
     id="text25">创建独立 data buffer — 避免 TXD 覆盖</text>
  <line
     x1="710"
     y1="393.27078"
     x2="710"
     y2="420"
     stroke="#ef4444"
     stroke-width="1.22618"
     marker-end="url(#arrow-red)"
     id="line25" />
  <rect
     x="610"
     y="420"
     width="200"
     height="50"
     rx="6"
     fill="#0f172a"
     stroke="#ef4444"
     stroke-width="1"
     id="rect25" />
  <text
     x="710"
     y="440"
     text-anchor="middle"
     fill="#ef4444"
     font-size="11"
     font-weight="600"
     id="text26">独立 DMA 发送</text>
  <text
     x="710"
     y="456"
     text-anchor="middle"
     fill="#64748b"
     font-size="9"
     id="text27">独立 TXD + data → WFDMA → 固件</text>
  <!-- Right-side annotation -->
  <text
     x="60"
     y="190"
     fill="#64748b"
     font-size="9"
     font-weight="600"
     id="text28">第一次拷贝</text>
  <text
     x="60"
     y="210"
     fill="#64748b"
     font-size="9"
     id="text29">为什么：协议栈 headroom (~64B)</text>
  <text
     x="60"
     y="225"
     fill="#64748b"
     font-size="9"
     id="text30">小于 TXD + QUE_ENTRY (100-200 B)</text>
  <text
     x="60"
     y="245"
     fill="#64748b"
     font-size="9"
     id="text31">CPU 开销：每个包 1 次 memcpy(1500B)</text>
  <text
     x="60"
     y="380"
     fill="#64748b"
     font-size="9"
     font-weight="600"
     id="text32">第二次拷贝</text>
  <text
     x="60"
     y="400"
     fill="#64748b"
     font-size="9"
     id="text33">为什么：克隆 skb 共享 data buffer</text>
  <text
     x="60"
     y="415"
     fill="#64748b"
     font-size="9"
     id="text34">第二个 BSSID 写 TXD 会覆盖第一个</text>
  <text
     x="60"
     y="435"
     fill="#64748b"
     font-size="9"
     id="text35">CPU 开销：每个包第 2 次 memcpy(1500B)</text>
  <!-- Bottom note -->
  <text
     x="450"
     y="500"
     text-anchor="middle"
     fill="#334155"
     font-size="9"
     id="text36">Source: MTK gen4m — os/linux/gl_kal.c, include/nic/nic_tx.h, include/config.h, include/queue.h</text>
</svg>
