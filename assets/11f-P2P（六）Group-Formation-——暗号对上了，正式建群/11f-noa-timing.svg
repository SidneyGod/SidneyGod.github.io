  <text x="20" y="322" class="lane-label">Client</text>
  <text x="255" y="190" text-anchor="middle" class="seg-label">缺席</text>
  <text x="255" y="208" text-anchor="middle" class="seg-label-sm">切 STA 信道</text>
  <text x="395" y="200" text-anchor="middle" class="seg-label">在场</text>
