  <text x="224" y="448" text-anchor="start"><tspan class="param" x="224">interval</tspan><tspan class="seg-label" x="283"> = 200 TU</tspan><tspan class="param-txt" x="350"> （两次离开间隔）</tspan></text>
  <text x="137" y="486" text-anchor="start"><tspan class="param" x="137">duration</tspan><tspan class="seg-label" x="196"> ≈ 70 TU</tspan><tspan class="param-txt" x="256"> （每次离开时长）</tspan></text>
  <text x="150" y="524" text-anchor="start"><tspan class="param">start_time</tspan><tspan class="seg-label"> </tspan><tspan class="param-txt"> （固件锚定的首次离开时刻）</tspan></text>
  <rect x="150" y="546" width="14" height="14" rx="2" fill="#064e3b" stroke="#10b981"/>
  <text x="172" y="558" class="legend">GO 在场 / Client 在线</text>
  <rect x="390" y="546" width="14" height="14" rx="2" fill="#431407" stroke="#f97316"/>
  <text x="412" y="558" class="legend">GO 缺席 · 切 STA 信道 Y 处理并发事务</text>
  <rect x="700" y="546" width="14" height="14" rx="2" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="722" y="558" class="legend">Client 休眠（省电）</text>
  <line x1="150" y1="582" x2="176" y2="582" stroke="#eab308" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="184" y="586" class="legend"><tspan class="param">start_time</tspan><tspan class="param-txt"> 由固件锚定 · Host 只传 count / duration / interval</tspan></text>
  <text x="150" y="618" class="foot">count==1 → 单次 NOA · count&gt;1 → 周期 NOA（duration &lt; interval）· 参数单位 µs（1 TU = 1024 µs）</text>
