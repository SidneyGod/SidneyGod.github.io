<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
  <!-- validate: skip-orphan-boxes -->
  <style>
    text { font-family: 'Maple Mono Normal NL NF CN','Microsoft YaHei',sans-serif; }
    .title { font-size:18px; font-weight:700; fill:#e2e8f0; letter-spacing:0.02em; }
    .sub { font-size:12px; fill:#94a3b8; }
    .lane-label { font-size:13px; font-weight:700; fill:#e2e8f0; }
    .seg-label { font-size:12px; fill:#e2e8f0; }
    .seg-label-sm { font-size:12px; fill:#cbd5e1; }
    .param { font-size:12px; font-weight:700; fill:#c4b5fd; }
    .param-txt { font-size:12px; fill:#94a3b8; }
    .axis { font-size:12px; fill:#eab308; }
    .legend { font-size:12px; fill:#e2e8f0; }
    .foot { font-size:12px; fill:#94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#eab308"/>
    </marker>
  </defs>
  <rect width="960" height="660" fill="url(#bg-grad)"/>
  <text x="480" y="36" text-anchor="middle" class="title">NOA 时序：GO 的「暂时离开」公告</text>
  <text x="480" y="58" text-anchor="middle" class="sub">X 轴 = TSF 时间 · 橙色 = GO 缺席窗口（NOA）</text>
  <line x1="150" y1="104" x2="150" y2="506" stroke="#eab308" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
