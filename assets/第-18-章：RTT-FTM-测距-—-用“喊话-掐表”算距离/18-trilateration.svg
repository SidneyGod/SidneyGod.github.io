  <text
     x="720"
     y="514"
     fill="#fbbf24"
     font-size="12"
     id="text15">3 个 AP → 唯一一点（2D 定位）</text>
  <text
     x="120"
     y="536"
     fill="#94a3b8"
     font-size="11"
     id="text16">4 个+ AP → 可解 3D 位置并抗噪声提升精度。每个圆的半径 = 该 AP 测得的 FTM 距离</text>
</svg>
