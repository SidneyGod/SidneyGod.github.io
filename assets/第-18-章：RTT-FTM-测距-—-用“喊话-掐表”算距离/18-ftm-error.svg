      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="card"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
    <style
       id="style4">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
    <linearGradient
       inkscape:collect="always"
       xlink:href="#card"
       id="linearGradient22"
       x1="69.473129"
       y1="903.01465"
       x2="69.473129"
       y2="1189.809"
       gradientTransform="matrix(2.5837329,0,0,0.38703691,-106,-30)"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       inkscape:collect="always"
       xlink:href="#card"
       id="linearGradient23"
       x1="56.27869"
       y1="126.42885"
       x2="56.27869"
       y2="438.6163"
       gradientTransform="matrix(1.4126129,0,0,0.70790804,-56,-10)"
       gradientUnits="userSpaceOnUse" />
    <linearGradient
       inkscape:collect="always"
       xlink:href="#card"
       id="linearGradient24"
       x1="387.38763"
       y1="129.26393"
       x2="387.38763"
       y2="448.45197"
       gradientTransform="matrix(1.1712671,0,0,0.69238185,49.860114,-10)"
       gradientUnits="userSpaceOnUse" />
  </defs>
  <rect
     width="900"
     height="450"
     fill="url(#bg)"
     id="rect4"
     style="fill:url(#bg);stroke-width:0.858117"
     x="0"
     y="0" />
  <text
     x="478"
     y="34"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20px"
     font-weight="700"
     id="text4">误差来源 — 为什么室内测距没那么准</text>
  <text
     x="478"
     y="58"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13px"
     id="text5">多径是最大的敌人；1 ns 时间误差就放大成 0.3 m 距离误差</text>
  <!-- multipath illustration -->
  <rect
     x="24"
     y="80"
     width="440"
     height="220"
     rx="8"
     fill="url(#card)"
     stroke="#ef4444"
     id="rect5"
     style="fill:url(#linearGradient23)" />
  <text
     x="244"
     y="106"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="14px"
     font-weight="700"
     id="text6">多径（Multipath）</text>
  <!-- TX and RX -->
  <circle
     cx="74"
     cy="190"
     r="12"
     fill="#f97316"
     id="circle6" />
  <text
     x="74"
     y="224"
     text-anchor="middle"
     fill="#fdba74"
     font-size="11px"
     id="text7">RSTA</text>
  <circle
     cx="414"
     cy="190"
     r="12"
     fill="#3b82f6"
     id="circle7" />
  <text
     x="414"
     y="224"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="11px"
     id="text8">ISTA</text>
  <!-- direct path -->
  <line
     x1="86"
     y1="190"
     x2="402"
     y2="190"
     stroke="#22c55e"
     stroke-width="2.5"
     id="line8" />
  <text
     x="244"
     y="184"
     text-anchor="middle"
     fill="#86efac"
     font-size="10px"
     id="text9">直达路径（想要的）</text>
  <!-- reflected paths -->
  <path
     d="m 86,186 q 158,-56 316,0"
     stroke="#ef4444"
     stroke-width="1.5"
     fill="none"
     stroke-dasharray="5, 3"
     id="path9" />
  <path
     d="m 86,194 q 158,66 316,0"
     stroke="#ef4444"
     stroke-width="1.5"
     fill="none"
     stroke-dasharray="5, 3"
     id="path10" />
  <text
     x="244"
     y="128"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="10px"
     id="text10">反射回波（绕远路，晚到）</text>
  <text
     x="244"
     y="276"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="10px"
     id="text11">墙壁/家具反射</text>
  <!-- error list -->
  <rect
     x="504"
     y="80"
     width="373.04349"
     height="220"
     rx="6.4877129"
     fill="url(#card)"
     stroke="#fbbf24"
     id="rect11"
     style="fill:url(#linearGradient24);stroke-width:0.900535" />
  <text
     x="696"
     y="106"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="14px"
     font-weight="700"
     id="text12">四大误差来源</text>
  <text
     x="524"
     y="136"
     fill="#cbd5e1"
     font-size="12px"
     id="text13">① 多径：反射回波干扰&quot;第一条直达路径&quot;判定</text>
  <text
     x="524"
     y="168"
     fill="#cbd5e1"
     font-size="12px"
     id="text14">② 时间戳精度：1 ns = 0.3 m，PHY 捕获抖动被放大</text>
  <text
     x="524"
     y="200"
     fill="#cbd5e1"
     font-size="12px"
     id="text15">③ 处理延迟不确定性：t2→t3 停留抖动难完全消除</text>
  <text
     x="524"
     y="232"
     fill="#cbd5e1"
     font-size="12px"
     id="text16">④ 带宽限制：带宽越窄，时间分辨率越差</text>
  <text
     x="524"
     y="272"
     fill="#86efac"
     font-size="12px"
     id="text17">→ 802.11az 用更宽带宽 + NDP + 多天线推向亚米级</text>
  <!-- precision bar -->
  <rect
     x="74"
     y="320"
     width="740"
     height="110"
     rx="8"
     fill="url(#card)"
     stroke="#22c55e"
     id="rect17"
     style="fill:url(#linearGradient22)" />
  <text
     x="444"
     y="346"
     text-anchor="middle"
     fill="#86efac"
     font-size="13px"
     font-weight="700"
     id="text18">时间误差 → 距离误差对照</text>
  <text
     x="114"
     y="378"
     fill="#e2e8f0"
     font-size="12px"
     id="text19">1 ns → ≈ 0.3 m</text>
  <text
     x="364"
     y="378"
     fill="#e2e8f0"
     font-size="12px"
     id="text20">10 ns → ≈ 3 m</text>
  <text
     x="614"
     y="378"
     fill="#e2e8f0"
     font-size="12px"
     id="text21">1 ms → ≈ 30 万 m</text>
  <text
     x="444"
     y="410"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="11px"
     id="text22">这就是为什么不能用普通&quot;ping 往返时延&quot;测距，必须在 PHY 层纳秒级捕获</text>
</svg>
