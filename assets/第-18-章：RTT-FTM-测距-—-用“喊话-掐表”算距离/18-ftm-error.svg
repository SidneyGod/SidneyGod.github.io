     inkscape:window-maximized="1"
     inkscape:current-layer="svg22" />
  <defs
     id="defs4">
    <linearGradient
       id="bg"
       x1="0"
       y1="0"
       x2="741.61987"
       y2="741.61987"
       gradientTransform="scale(1.2135598,0.60677989)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
