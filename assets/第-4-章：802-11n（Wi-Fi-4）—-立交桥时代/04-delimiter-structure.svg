  <!-- Title -->
  <text
     x="400"
     y="30"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="16px"
     font-weight="700"
     id="text2">A-MPDU Delimiter Structure (4 Bytes)</text>
  <text
     x="400"
     y="52"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12px"
     id="text3">Delimiter 结构 — 每个 MPDU 前的 4 字节分隔符 · 位序 B0(LSB) → B31(MSB)</text>
  <!-- ==================== Main field strip : 32 bits, x 96..864, B0(LSB) at left ==================== -->
  <!-- Reserved : B3-B0 -->
  <rect
     x="16"
     y="80"
     width="96"
     height="72"
     rx="5"
     fill="#1e293b"
     stroke="#64748b"
     stroke-width="1.5"
     id="rect3" />
  <text
     x="64"
     y="104"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13px"
     font-weight="700"
     id="text4">Reserved</text>
  <text
     x="64"
     y="125"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11px"
     id="text5">4 bit</text>
  <text
     x="64"
     y="145"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text6">[B3:B0]</text>
  <!-- MPDU Length : B15-B4 -->
  <rect
     x="112"
     y="80"
     width="288"
     height="72"
     rx="5"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect6" />
  <text
     x="256"
     y="104"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="13px"
     font-weight="700"
     id="text7">MPDU Length</text>
  <text
     x="256"
     y="125"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="11px"
     id="text8">12 bit · 0-4095</text>
  <text
     x="256"
     y="145"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text9">[B15:B4]</text>
  <!-- CRC : B23-B16 -->
  <rect
     x="400"
     y="80"
     width="192"
     height="72"
     rx="5"
     fill="#1e293b"
     stroke="#f97316"
     stroke-width="1.5"
     id="rect9" />
  <text
     x="496"
     y="104"
     text-anchor="middle"
     fill="#f97316"
     font-size="13px"
     font-weight="700"
     id="text10">CRC</text>
  <text
     x="496"
     y="125"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="11px"
     id="text11">8 bit</text>
  <text
     x="496"
     y="145"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text12">[B23:B16]</text>
  <!-- Delimiter Signature : B31-B24 (0x4E) -->
  <rect
     x="592"
     y="80"
     width="192"
     height="72"
     rx="5"
     fill="#052e16"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect12" />
  <text
     x="688"
     y="104"
     text-anchor="middle"
     fill="#10b981"
     font-size="13px"
     font-weight="700"
     id="text13">Delimiter Signature</text>
  <text
     x="688"
     y="125"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="11px"
     id="text14">8 bit · 固定 0x4E</text>
  <text
     x="688"
     y="145"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text15">[B31:B24]</text>
  <!-- Dashed callout connectors: field box bottom -> description box top -->
  <line
     x1="64"
     y1="152"
     x2="64"
     y2="170"
     stroke="#64748b"
     stroke-width="1"
     stroke-dasharray="3, 2"
