  <!-- ==================== Field description boxes ==================== -->
  <rect
     x="16"
     y="170"
     width="96"
     height="44"
     rx="4"
     fill="#0f172a"
     stroke="#64748b"
     stroke-width="0.8"
     id="rect18" />
  <text
     x="64"
     y="188"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11px"
     id="text18">保留位</text>
  <text
     x="64"
     y="203"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text19">默认 0</text>
  <rect
     x="112"
     y="170"
     width="288"
     height="44"
     rx="4"
     fill="#0f172a"
     stroke="#3b82f6"
     stroke-width="0.8"
     id="rect19" />
  <text
     x="256"
     y="188"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="11px"
     id="text20">后续 MPDU 的字节长度</text>
  <text
     x="256"
     y="203"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text21">A-MPDU 结束由 Length = 0 的 Delimiter 标记</text>
  <rect
     x="400"
     y="170"
     width="192"
     height="44"
     rx="4"
     fill="#0f172a"
     stroke="#f97316"
     stroke-width="0.8"
     id="rect21" />
  <text
     x="496"
     y="188"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="11px"
     id="text22">校验 Reserved + MPDU Length</text>
  <text
     x="496"
     y="203"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text23">前 16 bit，不含 Signature</text>
  <rect
     x="592"
     y="170"
     width="192"
     height="44"
     rx="4"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="0.8"
     id="rect23" />
  <text
     x="688"
     y="188"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="11px"
     id="text24">固定 0x4E = ASCII 'N'</text>
  <text
     x="688"
     y="203"
     text-anchor="middle"
     fill="#64748b"
     font-size="10px"
     id="text25">出错后重定位 Delimiter 边界</text>
  <!-- ==================== Bottom note bar ==================== -->
  <rect
     x="16.21302"
     y="228"
     width="767.57397"
     height="50"
     rx="3.4889727"
     fill="#1c1917"
     stroke="#334155"
     stroke-width="0.46697"
     id="rect25" />
  <text
     x="400"
     y="249"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="11px"
     id="text26">交通比喻：MPDU Length = 货物重量标签 | CRC = 标签防伪码 | 最后一个 Length = 0 的 Delimiter = 车尾灯（车队到此结束）</text>
  <text
     x="400"
     y="268"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10px"
     id="text27">802.11ac/ax：Reserved 中 2 bit 转作 MPDU Length High（扩至 14-bit / 最大 16383）；Signature 0x4E 用于重定位 Delimiter</text>
</svg>
