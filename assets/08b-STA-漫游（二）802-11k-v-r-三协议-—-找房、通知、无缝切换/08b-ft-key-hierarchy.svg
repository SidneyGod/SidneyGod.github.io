     x="230"
     y="521"
     text-anchor="middle"
     font-size="10px"
     fill="#cbd5e1"
     id="text25">由 PMK-R1 + ANonce + SNonce 派生</text>
  <text
     x="230"
     y="537"
     text-anchor="middle"
     font-size="10px"
     fill="#cbd5e1"
     id="text26">用于实际数据加密 (单播 + 组播)</text>
