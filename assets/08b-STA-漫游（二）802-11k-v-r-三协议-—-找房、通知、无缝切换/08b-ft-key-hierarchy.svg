     font-size="13px"
     fill="#94a3b8"
     font-weight="600"
     id="text27">FT 快速切换流程</text>
  <text
     x="473"
     y="111"
     font-size="11px"
     fill="#7c3aed"
     font-weight="600"
     id="text28">Initial MD Association</text>
  <text
     x="483"
     y="131"
     font-size="10px"
     fill="#94a3b8"
     id="text29">完整 802.1X EAP-TLS 认证</text>
  <text
     x="483"
     y="147"
     font-size="10px"
     fill="#94a3b8"
     id="text30">→ 获得 PMK-R0 (存于 PMKSA 缓存)</text>
  <text
     x="483"
     y="163"
     font-size="10px"
     fill="#94a3b8"
     id="text31">PMK-R0 在整个移动域 (MDID) 有效</text>
  <text
     x="473"
     y="185"
     font-size="11px"
     fill="#3b82f6"
     font-weight="600"
     id="text32">FT 切换 (后续漫游)</text>
  <text
     x="483"
     y="205"
     font-size="10px"
     fill="#94a3b8"
     id="text33">用 PMK-R0 + SSID 派生 PMK-R1Name</text>
  <text
     x="483"
     y="221"
     font-size="10px"
     fill="#94a3b8"
     id="text34">FT Auth Req/Resp 交换 ANonce/SNonce</text>
  <text
     x="483"
     y="237"
     font-size="10px"
     fill="#94a3b8"
     id="text35">→ 派生 PMK-R1 → PTK</text>
  <text
     x="473"
     y="259"
     font-size="11px"
     fill="#10b981"
     font-weight="600"
     id="text36">仅需 2+2 帧</text>
  <text
     x="483"
     y="279"
     font-size="10px"
     fill="#94a3b8"
     id="text37">FT Auth Req/Resp + Reassoc</text>
  <text
     x="483"
     y="295"
     font-size="10px"
     fill="#94a3b8"
     id="text38">跳过 802.1X 认证</text>
  <text
     x="483"
     y="311"
     font-size="10px"
     fill="#94a3b8"
     id="text39">切换时延 20-50ms</text>
  <text
     x="473"
     y="333"
     font-size="11px"
     fill="#f97316"
     font-weight="600"
     id="text40">两种模式</text>
  <text
     x="483"
     y="353"
     font-size="10px"
     fill="#94a3b8"
     id="text41">Over-the-Air: STA 直连目标 AP</text>
  <text
     x="483"
     y="369"
     font-size="10px"
     fill="#94a3b8"
     id="text42">Over-the-DS: 经当前 AP 中转</text>
  <text
     x="483"
     y="385"
     font-size="10px"
     fill="#94a3b8"
     id="text43">wpa_ft_start_over_ds() 发起</text>
  <rect
     x="473"
     y="395"
     width="290"
     height="32"
     rx="4"
     fill="#1c1917"
     stroke="#f97316"
     stroke-width="1"
     id="rect43" />
  <text
     x="618"
     y="409"
     text-anchor="middle"
     font-size="10px"
     fill="#f97316"
     id="text44">FT 失败 → 回退标准 Auth/Assoc (100-500ms)</text>
  <text
     x="618"
     y="423"
     text-anchor="middle"
     font-size="9px"
     fill="#64748b"
     id="text45">FT_DS_STATE_FAIL → HANDLE_NEW_CANDIDATE → ROAM</text>
