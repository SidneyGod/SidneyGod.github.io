<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1200 820"
   width="1200"
   height="820"
   version="1.1"
   id="svg56"
   sodipodi:docname="06e-radius-eap-sim.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview56"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.2433333"
     inkscape:cx="600"
     inkscape:cy="409.78552"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg56" />
  <title
     id="title1">RADIUS 封装与密钥派生</title>
  <style
     id="style1">
  text { font-family: 'Maple Mono Normal NL NF CN',Monaco,'Microsoft YaHei',monospace; }
</style>
  <defs
     id="defs4">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="layers"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
  </defs>
  <rect
     width="1200"
     height="820"
     fill="url(#bg)"
     id="rect4" />
  <!-- Title -->
  <text
     x="30"
     y="26"
     font-size="15"
     font-weight="700"
     fill="#e2e8f0"
     id="text4">EAP-over-RADIUS Encapsulation &amp; MS-MPPE Key Delivery (RFC 3579 + RFC 2548)</text>
  <text
     x="30"
     y="44"
     font-size="11"
     fill="#94a3b8"
     id="text5">Layer model: EAP Message → RADIUS EAP-Message attribute (type=79) → RADIUS UDP packet → MS-MPPE encrypted PMK in Access-Accept</text>
  <!-- Left side: Encapsulation Flow for EAP-SIM -->
  <rect
     x="30"
     y="65"
     width="596"
     height="740"
     rx="8"
     fill="#1e293b"
     stroke="#334155"
     stroke-width="1"
     id="rect5" />
  <text
     x="310"
     y="90"
     text-anchor="middle"
     font-size="13"
     font-weight="700"
     fill="#e2e8f0"
     id="text6">EAP-SIM Challenge: Encapsulation Path</text>
  <!-- Layer 1: EAP-SIM -->
  <rect
     x="55"
     y="110"
     width="510"
     height="100"
     rx="6"
     fill="#0f172a"
     stroke="#3b82f6"
     stroke-width="1.2"
     id="rect6" />
  <text
     x="75"
     y="130"
     font-size="11"
     font-weight="600"
     fill="#3b82f6"
     id="text7">Layer 1: EAP Message (RFC 4186)</text>
  <text
     x="75"
     y="150"
     font-size="9"
     fill="#94a3b8"
     id="text8">EAP-SIM/Challenge Request from RADIUS → AP:</text>
  <text
     x="85"
     y="168"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text9">[Code=1(Request)] [ID=47] [Length=N]</text>
  <text
     x="85"
     y="182"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text10">[Type=18(SIM)] [Subtype=11(Challenge)] [Reserved=0]</text>
  <text
     x="85"
     y="196"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text11">[AT_RAND=1{16B RAND1}][AT_RAND=2{16B RAND2}][AT_MAC=11{16B MAC}]</text>
  <!-- Arrow down -->
  <g
     id="g60">
    <line
       x1="310"
       y1="215"
       x2="310"
       y2="235"
       stroke="#3b82f6"
       stroke-width="1.5"
       id="line11" />
    <polygon
       points="305,232 310,240 315,232"
       fill="#3b82f6"
       id="polygon11" />
  </g>
  <!-- Layer 2: RADIUS -->
  <rect
     x="55"
     y="245"
     width="510"
     height="112.9177"
     rx="6"
     fill="#0f172a"
     stroke="#a855f7"
     stroke-width="1.21581"
     id="rect11" />
  <text
     x="75"
     y="265"
     font-size="11"
     font-weight="600"
     fill="#a855f7"
     id="text12">Layer 2: RADIUS Message (RFC 2865 + RFC 3579)</text>
  <text
     x="75"
     y="285"
     font-size="9"
     fill="#94a3b8"
     id="text13">Access-Challenge (code=11) from RADIUS → AP over UDP/1812:</text>
  <text
     x="85"
     y="303"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text14">[Code=11] [ID=47] [Length=M] [Authenticator=MD5(...)]</text>
  <text
     x="85"
     y="319"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text15">[Attr: User-Name(1) = &quot;123450000000001@wlan.mnc000...&quot;]</text>
  <text
     x="85"
     y="335"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text16">[Attr: EAP-Message(79) = &lt;EAP-SIM/Challenge Request&gt;] ← radius_msg_add_eap()</text>
  <text
     x="85"
     y="351"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text17">[Attr: State(24) = 0xA1B2C3...][Attr: Message-Authenticator(80) = HMAC-MD5]</text>
  <!-- Arrow down -->
  <g
     id="g59"
     transform="translate(0,2)">
    <line
       x1="310"
       y1="360"
       x2="310"
       y2="380"
       stroke="#a855f7"
       stroke-width="1.5"
       id="line17" />
    <polygon
       points="315,377 305,377 310,385 "
       fill="#a855f7"
       id="polygon17" />
  </g>
  <!-- Layer 3: UDP/IP -->
  <rect
     x="55"
     y="390"
     width="510"
     height="60"
     rx="6"
     fill="#0f172a"
     stroke="#f97316"
     stroke-width="1.2"
     id="rect17" />
  <text
     x="75"
     y="410"
     font-size="11"
     font-weight="600"
     fill="#f97316"
     id="text18">Layer 3: UDP/IP Transport</text>
  <text
     x="85"
     y="428"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text19">UDP dport=1812 → IP Source=RADIUS_IP Dest=AP_IP</text>
  <text
     x="85"
     y="442"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text20">Max RADIUS msg: 4096 bytes. EAP &gt; 253B → fragmented across multiple EAP-Message attrs</text>
  <!-- MS-MPPE Key Delivery -->
  <rect
     x="55"
     y="480"
     width="510"
     height="150"
     rx="6"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="1.5"
     id="rect20" />
  <text
     x="75"
     y="500"
     font-size="11"
     font-weight="600"
     fill="#10b981"
     id="text21">MS-MPPE Key Delivery in Access-Accept (RFC 2548)</text>
  <text
     x="75"
     y="520"
     font-size="9"
     fill="#94a3b8"
     id="text22">RADIUS Access-Accept carries encrypted PMK via Microsoft Vendor-Specific attrs:</text>
  <text
     x="85"
     y="540"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text23">[Attr: Vendor-Specific(26)]</text>
  <text
     x="85"
     y="556"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text24">  ├── Vendor-ID = 311 (Microsoft)</text>
  <text
     x="85"
     y="572"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text25">  ├── Vendor-Type = 16 (MS-MPPE-Send-Key) → PMK (AP→STA direction)</text>
  <text
     x="85"
     y="588"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text26">  ├── Vendor-Type = 17 (MS-MPPE-Recv-Key) → unused (STA→AP direction)</text>
  <text
     x="85"
     y="604"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text27">  └── Encryption: salt = RADIUS_shared_secret + Request_Authenticator</text>
  <text
     x="85"
     y="620"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text28">       └── MD5(salt) → 16B key → RC4(MSK) → encrypted key string</text>
  <text
     x="75"
     y="645"
     font-size="9"
     fill="#94a3b8"
     id="text29">After decoding: MSK(64B) → PMK = MSK[0:32] → used in 4-way handshake</text>
  <!-- Right side: Key Derivation Chain -->
  <rect
     x="620"
     y="65"
     width="650"
     height="740"
     rx="8"
     fill="#1e293b"
     stroke="#334155"
     stroke-width="1"
     id="rect29" />
  <text
     x="895"
     y="90"
     text-anchor="middle"
     font-size="13"
     font-weight="700"
     fill="#e2e8f0"
     id="text30">EAP-SIM Key Derivation Chain</text>
  <!-- GSM Triplet -->
  <rect
     x="645"
     y="110"
     width="500"
     height="70"
     rx="6"
     fill="#0f172a"
     stroke="#ef4444"
     stroke-width="1.2"
     id="rect30" />
  <text
     x="665"
     y="130"
     font-size="11"
     font-weight="600"
     fill="#ef4444"
     id="text31">Input: GSM Triplets (from HLR/AuC)</text>
  <text
     x="665"
     y="150"
     font-size="9"
     fill="#94a3b8"
     font-family="monospace"
     id="text32">RAND1[16B] → A3(RAND1,Ki) → SRES1[4B]  |  A8(RAND1,Ki) → Kc1[8B]</text>
  <text
     x="665"
     y="166"
     font-size="9"
     fill="#94a3b8"
     font-family="monospace"
     id="text33">RAND2[16B] → A3(RAND2,Ki) → SRES2[4B]  |  A8(RAND2,Ki) → Kc2[8B]</text>
  <line
     x1="895"
     y1="185"
     x2="895"
     y2="210"
     stroke="#ef4444"
     stroke-width="1.5"
     id="line33" />
  <polygon
     points="890,207 895,215 900,207"
     fill="#ef4444"
     id="polygon33" />
  <!-- MK -->
  <rect
     x="645"
     y="220"
     width="500"
     height="57.121967"
     rx="6"
     fill="#0f172a"
     stroke="#f97316"
     stroke-width="1.22293"
     id="rect33" />
  <text
     x="665"
     y="240"
     font-size="11"
     font-weight="600"
     fill="#f97316"
     id="text34">Step 1: Master Key (MK) — eap_sim_derive_mk()</text>
  <text
     x="665"
     y="256"
     font-size="9px"
     fill="#94a3b8"
     font-family="monospace"
     id="text35">MK[20B] = SHA1(Identity || Kc1 || Kc2 [|| Kc3] || NONCE_MT || VersionList || SelectedVersion)</text>
  <text
     x="665"
     y="268"
     font-size="8px"
     fill="#64748b"
     id="text36">NONCE_MT ensures uniqueness even if GSM triplets are reused</text>
  <g
     id="g57"
     transform="translate(0,4)">
    <line
       x1="895"
       y1="280"
       x2="895"
       y2="305"
       stroke="#f97316"
       stroke-width="1.5"
       id="line36" />
    <polygon
       points="900,302 890,302 895,310 "
       fill="#f97316"
       id="polygon36" />
  </g>
  <!-- Session Keys -->
  <rect
     x="645"
     y="315"
     width="500"
     height="94.243935"
     rx="6"
     fill="#0f172a"
     stroke="#a855f7"
     stroke-width="1.22797"
     id="rect36" />
  <text
     x="665"
     y="335"
     font-size="11"
     font-weight="600"
     fill="#a855f7"
     id="text37">Step 2: Session Keys — eap_sim_derive_keys()</text>
  <text
     x="665"
     y="353"
     font-size="9"
     fill="#94a3b8"
     font-family="monospace"
     id="text38">FIPS 186-2 PRF(MK) → K_encr[16B] || K_aut[16B] || MSK[64B] || EMSK[64B]</text>
  <text
     x="665"
     y="371"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text39">K_encr[16B] → AES-128-CBC encryption of AT_ENCR_DATA (pseudonym, reauth_id)</text>
  <text
     x="665"
     y="387"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text40">K_aut[16B]  → HMAC-SHA1-128 for AT_MAC verification (message integrity)</text>
  <text
     x="665"
     y="403"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text41">MSK[64B]    → WPA PMK = MSK[0:32] (exported to wpa_supplicant via eapol_sm_cb)</text>
  <g
     id="g56"
     transform="translate(0,4)">
    <line
       x1="895"
       y1="412"
       x2="895"
       y2="437"
       stroke="#a855f7"
       stroke-width="1.5"
       id="line41" />
    <polygon
       points="900,432 890,432 895,440 "
       fill="#a855f7"
       id="polygon41" />
  </g>
  <!-- PMK -->
  <rect
     x="645"
     y="445"
     width="500"
     height="59.774426"
     rx="6"
     fill="#0f172a"
     stroke="#3b82f6"
     stroke-width="1.251"
     id="rect41" />
  <text
     x="665"
     y="465"
     font-size="11"
     font-weight="600"
     fill="#3b82f6"
     id="text42">Step 3: PMK Handoff to WPA State Machine</text>
  <text
     x="665"
     y="483"
     font-size="9"
     fill="#94a3b8"
     font-family="monospace"
     id="text43">PMK[32B] = MSK[0:32] → wpa_sm_set_pmk() → 4-way handshake</text>
  <text
     x="665"
     y="499"
     font-size="8"
     fill="#64748b"
     id="text44">EAP-SIM MSK format is identical to EAP-TLS MSK — wpa_supplicant doesn't distinguish</text>
  <g
     id="g58"
     transform="translate(0,4)">
    <line
       x1="895"
       y1="505"
       x2="895"
       y2="530"
       stroke="#3b82f6"
       stroke-width="1.5"
       id="line44" />
    <polygon
       points="900,527 890,527 895,535 "
       fill="#3b82f6"
       id="polygon44" />
  </g>
  <!-- PTK -->
  <rect
     x="645"
     y="540"
     width="500"
     height="61.631149"
     rx="6"
     fill="#0f172a"
     stroke="#10b981"
     stroke-width="1.27028"
     id="rect44" />
  <text
     x="665"
     y="560"
     font-size="11"
     font-weight="600"
     fill="#10b981"
     id="text45">Step 4: PTK/GTK (4-Way Handshake)</text>
  <text
     x="665"
     y="578"
     font-size="9"
     fill="#94a3b8"
     font-family="monospace"
     id="text46">PTK = PRF-X(PMK, &quot;Pairwise key expansion&quot;, AA||SPA||ANonce||SNonce)</text>
  <text
     x="665"
     y="594"
     font-size="8"
     fill="#64748b"
     id="text47">Same 4-way handshake for all EAP methods — EAP mechanism is transparent to WPA</text>
  <!-- RADIUS Message Types Table -->
  <rect
     x="645"
     y="625"
     width="500"
     height="165"
     rx="6"
     fill="#0f172a"
     stroke="#334155"
     stroke-width="0.8"
     id="rect47" />
  <text
     x="665"
     y="645"
     font-size="10"
     font-weight="600"
     fill="#e2e8f0"
     id="text48">RADIUS Code Reference (radius.h:26-41)</text>
  <text
     x="665"
     y="665"
     font-size="8"
     fill="#94a3b8"
     font-family="monospace"
     id="text49">Code 1:  Access-Request   AP→RADIUS  EAP-Response → start/continue auth</text>
  <text
     x="665"
     y="681"
     font-size="8"
     fill="#94a3b8"
     font-family="monospace"
     id="text50">Code 2:  Access-Accept    RADIUS→AP  Auth success + MS-MPPE keys</text>
  <text
     x="665"
     y="697"
     font-size="8"
     fill="#94a3b8"
     font-family="monospace"
     id="text51">Code 3:  Access-Reject    RADIUS→AP  Auth failure</text>
  <text
     x="665"
     y="713"
     font-size="8"
     fill="#94a3b8"
     font-family="monospace"
     id="text52">Code 11: Access-Challenge RADIUS→AP  EAP-Request → more rounds needed</text>
  <text
     x="665"
     y="731"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text53">Key Attrs: EAP-Message(79) · Message-Authenticator(80) · State(24)</text>
  <text
     x="665"
     y="747"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text54">Vendor(26): MS-MPPE-Send-Key(16) · MS-MPPE-Recv-Key(17) [vendor=311]</text>
  <text
     x="665"
     y="765"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text55">radius_msg_add_eap() → writes EAP into attr 79</text>
  <text
     x="665"
     y="781"
     font-size="8"
     fill="#64748b"
     font-family="monospace"
     id="text56">radius_msg_get_ms_keys() → reads PMK from vendor attr 16 in Access-Accept</text>
</svg>
