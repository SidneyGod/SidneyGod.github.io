  <text
     x="50"
     y="266"
     fill="#e2e8f0"
     font-size="10"
     id="text23">Frequency: 2.4 GHz ISM band</text>
  <text
     x="50"
     y="282"
     fill="#e2e8f0"
     font-size="10"
     id="text24">Channels: 79 × 1 MHz</text>
  <text
     x="50"
     y="298"
     fill="#e2e8f0"
     font-size="10"
     id="text25">Modulation: GFSK</text>
  <text
     x="50"
     y="314"
     fill="#e2e8f0"
     font-size="10"
     id="text26">Data Rate: 1 / 2 Mbps</text>
  <text
     x="50"
     y="330"
     fill="#e2e8f0"
     font-size="10"
     id="text27">Hop Rate: ≥2.5 hops/sec</text>
  <text
     x="50"
     y="350"
     fill="#94a3b8"
     font-size="9"
     id="text28">抗干扰方式：频繁跳频避开干扰</text>
  <text
     x="50"
     y="366"
     fill="#94a3b8"
     font-size="9"
     id="text29">Anti-interference: hop away from jammed freq</text>
  <text
     x="50"
     y="386"
     fill="#ef4444"
     font-size="10"
     font-weight="700"
     id="text30">✗ Low speed, hop overhead</text>
  <text
     x="50"
     y="402"
     fill="#10b981"
     font-size="10"
     font-weight="700"
     id="text31">✓ Good anti-interference</text>
  <text
     x="50"
     y="422"
     fill="#94a3b8"
     font-size="9"
     id="text32">Verdict: 被淘汰 (Obsoleted)</text>
  <text
     x="50"
     y="436"
     fill="#94a3b8"
     font-size="9"
     id="text33">Reason: Low throughput, inefficient</text>
