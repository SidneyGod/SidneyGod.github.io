     font-weight="700"
     id="text49">Specifications</text>
  <line
     x1="440"
     y1="248"
     x2="760"
     y2="248"
     stroke="#334155"
     stroke-width="0.5"
     id="line49" />
  <text
     x="440"
     y="266"
     fill="#e2e8f0"
     font-size="10"
     id="text50">Frequency: 2.4 GHz ISM band</text>
  <text
     x="440"
     y="282"
     fill="#e2e8f0"
     font-size="10"
     id="text51">Channel Width: 22 MHz</text>
  <text
     x="440"
     y="298"
     fill="#e2e8f0"
     font-size="10"
     id="text52">Modulation: DBPSK / DQPSK</text>
  <text
     x="440"
     y="314"
     fill="#e2e8f0"
     font-size="10"
     id="text53">Data Rate: 1 / 2 Mbps</text>
  <text
     x="440"
     y="330"
     fill="#e2e8f0"
     font-size="10"
     id="text54">Processing Gain: ~10.4 dB</text>
  <text
