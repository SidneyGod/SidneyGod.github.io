<line x1="500" y1="488" x2="500" y2="542" stroke="#10b981" stroke-width="2.2" marker-end="url(#mGreen)"/>
<text x="321" y="519" text-anchor="end" font-size="12" fill="#34d399">关联成功 EVENT_ASSOC</text>
<line x1="500" y1="598" x2="500" y2="652" stroke="#10b981" stroke-width="2.2" marker-end="url(#mGreen)"/>
<text x="321" y="629" text-anchor="end" font-size="12" fill="#34d399">收到 EAPOL-Key msg 1/4</text>
<line x1="500" y1="708" x2="500" y2="762" stroke="#10b981" stroke-width="2.2" marker-end="url(#mGreen)"/>
<text x="321" y="739" text-anchor="end" font-size="12" fill="#34d399">四次握手完成 msg 4/4</text>
<line x1="500" y1="818" x2="500" y2="872" stroke="#10b981" stroke-width="2.2" marker-end="url(#mGreen)"/>
<text x="321" y="849" text-anchor="end" font-size="12" fill="#34d399">组密钥握手完成 / 直接完成</text>
<rect x="780" y="102" width="280" height="56" rx="10" fill="#2a1f0f" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="920.0" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#fbbf24">WPA_INTERFACE_DISABLED  [1]</text>
<line x1="1260" y1="112" x2="1060" y2="112" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mOrange)"/>
<text x="1170" y="102" text-anchor="middle" font-size="12" fill="#fbbf24">禁用接口 rfkill / 飞行</text>
<line x1="780" y1="142" x2="665" y2="142" stroke="#10b981" stroke-width="1.8" marker-end="url(#mGreen)"/>
<text x="722.5" y="135" text-anchor="middle" font-size="12" fill="#34d399">启用接口</text>
<rect x="780" y="212" width="280" height="56" rx="10" fill="#1e1f2b" stroke="#8b93a7" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="920.0" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#cbd5e1">WPA_INACTIVE  [2]</text>
<polyline points="640,158 640,200 820,200 820,212" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#mOrange)"/>
<text x="650" y="190" font-size="12" fill="#fbbf24">没有启用的网络</text>
<line x1="780" y1="240" x2="665" y2="240" stroke="#10b981" stroke-width="1.8" marker-end="url(#mGreen)"/>
<text x="722.5" y="232" text-anchor="middle" font-size="12" fill="#34d399">开始扫描</text>
<text x="30" y="420" font-size="12" fill="#64748b">注：WPA_AUTHENTICATING(4) 仅用于 SME</text>
<text x="30" y="438" font-size="12" fill="#64748b">非 SME 驱动：SCANNING 直接 → ASSOCIATING</text>
</svg>