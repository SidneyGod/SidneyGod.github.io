<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1000" width="1300" height="1000">
<style>text{font-family:'Maple Mono Normal NL NF CN','Microsoft YaHei',monospace;}</style>
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/>
  </linearGradient>
  <marker id="mGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10b981"/></marker>
  <marker id="mOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f59e0b"/></marker>
</defs>
<rect width="1300" height="1000" fill="url(#bgGrad)"/>
<rect x="1" y="1" width="1298" height="998" rx="8" fill="none" stroke="#2a2d35" stroke-width="1.5"/>
<text x="650.0" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#e2e8f0">wpa_supplicant 状态机层级：10 状态的连接生命周期</text>
<text x="650.0" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">主链（绿）= 正常连接推进，枚举值 0→9 · 虚线（橙）= 旁路状态：禁用 / 无网络</text>
<rect x="335" y="102" width="330" height="56" rx="10" fill="#0f1f2b" stroke="#2f9e6e" stroke-width="1.6"/>
<text x="500" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_DISCONNECTED  [0]</text>
<rect x="335" y="212" width="330" height="56" rx="10" fill="#0f1f2b" stroke="#2f9e6e" stroke-width="1.6"/>
<text x="500" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_SCANNING  [3]</text>
<rect x="335" y="322" width="330" height="56" rx="10" fill="#0f1f2b" stroke="#2f9e6e" stroke-width="1.6"/>
<text x="500" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_AUTHENTICATING  [4]</text>
<rect x="335" y="432" width="330" height="56" rx="10" fill="#0f1f2b" stroke="#2f9e6e" stroke-width="1.6"/>
<text x="500" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_ASSOCIATING  [5]</text>
<rect x="335" y="542" width="330" height="56" rx="10" fill="#0f1f2b" stroke="#2f9e6e" stroke-width="1.6"/>
<text x="500" y="575" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_ASSOCIATED  [6]</text>
<rect x="335" y="652" width="330" height="56" rx="10" fill="#0f1f2b" stroke="#2f9e6e" stroke-width="1.6"/>
<text x="500" y="685" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_4WAY_HANDSHAKE  [7]</text>
<rect x="335" y="762" width="330" height="56" rx="10" fill="#0f1f2b" stroke="#2f9e6e" stroke-width="1.6"/>
<text x="500" y="795" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_GROUP_HANDSHAKE  [8]</text>
<rect x="335" y="872" width="330" height="56" rx="10" fill="#0a2a18" stroke="#2ecc71" stroke-width="1.6"/>
<text x="500" y="905" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">WPA_COMPLETED  [9]</text>
<line x1="500" y1="158" x2="500" y2="212" stroke="#10b981" stroke-width="2.2" marker-end="url(#mGreen)"/>
<text x="321" y="189" text-anchor="end" font-size="12" fill="#34d399">开始扫描 / 自动连接</text>
<line x1="500" y1="268" x2="500" y2="322" stroke="#10b981" stroke-width="2.2" marker-end="url(#mGreen)"/>
