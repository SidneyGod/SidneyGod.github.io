     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg37" />
  <defs
     id="defs3">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <style
       id="style2">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
    <marker
       id="ar"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#cbd5e1"
         id="path2" />
    </marker>
    <marker
       id="arr"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#fca5a5"
         id="path3" />
    </marker>
  </defs>
  <rect
     width="1160"
     height="966"
     fill="url(#bg)"
     id="rect3" />
  <text
     x="580"
     y="36"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text3">TDLS 完整帧交互 — 信令借道 AP，数据走直连</text>
  <text
     x="580"
     y="60"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12"
     id="text4">五段：⓪ 已各自关联 AP → ① 发现 → ② 建立三帧（内含 TPK 握手）→ ③（可选）切信道 → ④ 直连传数据 → ⑤ 拆除</text>
  <!-- lifelines: A(250) / AP(580) / B(910) -->
  <rect
     x="140"
     y="78"
     width="220"
     height="50"
     rx="8"
     fill="#7f1d1d"
     stroke="#f87171"
     stroke-width="2"
     id="rect4" />
  <text
     x="250"
     y="99"
     text-anchor="middle"
     fill="#fecaca"
     font-size="14"
     font-weight="700"
     id="text5">STA A（发起方）</text>
  <text
     x="250"
     y="118"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="10"
     id="text6">TDLS initiator · 关联在此 AP</text>
  <rect
     x="470"
     y="78"
     width="220"
     height="50"
     rx="8"
     fill="#334155"
     stroke="#94a3b8"
     stroke-width="2"
     id="rect6" />
  <text
     x="580"
     y="99"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="14"
     font-weight="700"
     id="text7">AP（前台）</text>
  <text
     x="580"
     y="118"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="10"
     id="text8">无需懂 TDLS，按普通数据帧转发</text>
  <rect
     x="800"
     y="78"
     width="220"
     height="50"
     rx="8"
     fill="#7f1d1d"
     stroke="#f87171"
     stroke-width="2"
     id="rect8" />
  <text
     x="910"
     y="99"
     text-anchor="middle"
     fill="#fecaca"
     font-size="14"
     font-weight="700"
     id="text9">STA B（响应方）</text>
  <text
     x="910"
     y="118"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="10"
     id="text10">TDLS responder · 关联在此 AP</text>
  <line
     x1="250"
     y1="128"
     x2="250"
     y2="900"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line10" />
  <line
     x1="580"
     y1="128"
     x2="580"
     y2="900"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line11" />
  <line
     x1="910"
     y1="128"
     x2="910"
     y2="900"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line12" />
  <!-- legend -->
  <line
     x1="700"
     y1="150"
     x2="740"
     y2="150"
     stroke="#7dd3fc"
     stroke-width="2"
     id="line13" />
  <text
     x="746"
     y="154"
     fill="#94a3b8"
     font-size="10"
     id="text13">经 AP（AP path，RA=BSSID）</text>
  <line
     x1="920"
     y1="150"
     x2="960"
     y2="150"
     stroke="#f87171"
     stroke-width="2.5"
     id="line14" />
  <text
     x="966"
     y="154"
     fill="#94a3b8"
     font-size="10px"
     id="text14">直连（direct path，RA=对端 MAC）</text>
  <!-- ============ ⓪ Precondition ============ -->
  <rect
     x="95"
     y="166"
     width="970"
     height="34"
     rx="6"
     fill="#1e293b"
     stroke="#64748b"
     stroke-width="1"
     stroke-dasharray="5,3"
     id="rect14" />
  <text
     x="580"
     y="187"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text15">⓪ 前提：A、B 已各自完成与 AP 的关联 + 4 次握手（都是这个 BSS 的客户端），且双方都有与 BSS 的 RSNA</text>
  <!-- ============ ① Discovery (teal) ============ -->
  <rect
     x="95"
     y="212"
     width="970"
     height="98"
     rx="8"
     fill="#0c2a2a"
     stroke="#14b8a6"
     stroke-width="1.5"
     id="rect15" />
  <text
     x="113"
     y="232"
     fill="#5eead4"
     font-size="13"
     font-weight="700"
     id="text16">① 发现 · 确认对端支持 TDLS 且可直连（§11.20.3）— 请求经 AP，响应走直连</text>
  <line
     x1="250"
     y1="258"
     x2="906"
     y2="258"
     stroke="#7dd3fc"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line16" />
  <circle
     cx="580"
     cy="258"
     r="4"
     fill="#334155"
     stroke="#7dd3fc"
     id="circle16" />
  <text
     x="568"
     y="252"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text17">TDLS Discovery Request（封装成数据帧，经 AP 转发；单播，不可发组地址）</text>
  <line
     x1="906"
     y1="286"
     x2="254"
     y2="286"
     stroke="#f87171"
     stroke-width="2.5"
     marker-end="url(#arr)"
     id="line17" />
  <text
     x="568"
     y="280"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11px"
     id="text18">TDLS Discovery Response（直接回，Public Action 帧，不经 AP）</text>
  <text
     x="113"
     y="305"
     fill="#64748b"
     font-size="9.5"
     id="text19">响应能否直达，本身就验证了 A、B 之间存在可用的直连路径</text>
  <!-- ============ ② Setup + TPK (indigo) ============ -->
  <rect
     x="95"
     y="322"
     width="970"
     height="170"
     rx="8"
     fill="#1e1b4b"
     stroke="#818cf8"
     stroke-width="1.5"
     id="rect19" />
  <text
     x="113"
     y="342"
     fill="#c7d2fe"
     font-size="13"
     font-weight="700"
     id="text20">② 建立 · 三帧握手，全部经 AP（§11.20.4）— 若需加密，TPK 握手 M1/M2/M3 就内嵌在这三帧里</text>
  <line
     x1="250"
     y1="368"
     x2="906"
     y2="368"
     stroke="#a5b4fc"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line20" />
  <circle
     cx="580"
     cy="368"
     r="4"
     fill="#334155"
     stroke="#a5b4fc"
     id="circle20" />
  <text
     x="568"
     y="362"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text21">TDLS Setup Request（能力：速率/信道/HT/VHT/HE + 安全要求）〔含 TPK M1〕</text>
  <line
     x1="906"
     y1="404"
     x2="254"
     y2="404"
     stroke="#a5b4fc"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line21" />
  <circle
     cx="580"
     cy="404"
     r="4"
     fill="#334155"
     stroke="#a5b4fc"
     id="circle21" />
  <text
     x="568"
     y="398"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text22">TDLS Setup Response（Status=0 接受）〔含 TPK M2〕</text>
  <line
     x1="250"
     y1="440"
     x2="906"
     y2="440"
     stroke="#a5b4fc"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line22" />
  <circle
     cx="580"
     cy="440"
     r="4"
     fill="#334155"
     stroke="#a5b4fc"
     id="circle22" />
  <text
     x="568"
     y="434"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text23">TDLS Setup Confirm〔含 TPK M3〕</text>
  <text
     x="113"
     y="466"
     fill="#c7d2fe"
     font-size="10.5"
     font-weight="700"
     id="text24">三帧成功 → direct link 建成，且 TPK（TDLS PeerKey）就位 —— 直连专用密钥，独立于各自与 AP 的 RSNA</text>
  <text
     x="113"
     y="482"
     fill="#64748b"
     font-size="9.5"
     id="text25">三帧此刻只能走 AP path（直连还没建成）；TPK 握手不是独立的第四步，而是搭车在 Setup 三帧里（§12.7.8）</text>
  <!-- ============ ③ Channel switch (yellow, optional dashed) ============ -->
  <rect
     x="95"
     y="504"
     width="970"
     height="62"
     rx="8"
     fill="#332b0a"
     stroke="#eab308"
     stroke-width="1.5"
     stroke-dasharray="6,4"
     id="rect25" />
  <text
     x="113"
     y="524"
     fill="#fde68a"
     font-size="13"
     font-weight="700"
     id="text26">③（可选）信道切换 · off-channel TDLS（§11.20.6）— 从 AP 的 base channel 切到更空闲/更宽的信道</text>
  <line
     x1="250"
     y1="548"
     x2="906"
     y2="548"
     stroke="#f87171"
     stroke-width="2"
     stroke-dasharray="5,3"
     marker-end="url(#arr)"
     id="line26" />
  <text
     x="568"
     y="542"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text27">TDLS Channel Switch Request / Response（直连上协商；临时、可回切）</text>
  <!-- ============ ④ Data on direct path (red) ============ -->
  <rect
     x="95"
     y="578"
     width="970"
     height="120"
     rx="8"
     fill="#3a1212"
     stroke="#f87171"
     stroke-width="1.5"
     id="rect27" />
  <text
     x="113"
     y="598"
     fill="#fca5a5"
     font-size="13"
     font-weight="700"
     id="text28">④ 传数据 · 走直连路径（direct path）— 一跳直达，不再经 AP</text>
  <line
     x1="250"
     y1="626"
     x2="906"
     y2="626"
     stroke="#f87171"
     stroke-width="3"
     marker-end="url(#arr)"
     id="line28" />
  <line
     x1="906"
     y1="652"
     x2="254"
     y2="652"
     stroke="#f87171"
     stroke-width="3"
     marker-end="url(#arr)"
     id="line29" />
  <text
     x="568"
     y="620"
     text-anchor="middle"
     fill="#fecaca"
     font-size="11"
     font-weight="700"
     id="text29">加密数据帧（RA=对端 MAC，TPK 保护）· A↔B 点对点直传</text>
  <text
     x="568"
     y="674"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text30">空闲时省电：TPU（有数据才触发投递）或 TDLS peer PSM（约定服务期醒来）· 两端仍周期回 base channel 与 AP 保持联系</text>
  <text
     x="113"
     y="690"
     fill="#64748b"
     font-size="9.5"
     id="text31">注意：A、B 始终仍是 AP 的关联客户端，工牌没退、前台还在 —— 只是日常数据抄了近路</text>
  <!-- ============ ⑤ Teardown (slate) ============ -->
  <rect
     x="95"
     y="710"
     width="970"
     height="76"
     rx="8"
     fill="#1e293b"
     stroke="#94a3b8"
     stroke-width="1.5"
     id="rect31" />
  <text
     x="113"
     y="730"
     fill="#cbd5e1"
     font-size="13"
     font-weight="700"
     id="text32">⑤ 拆除 · TDLS Teardown（§11.20.5）</text>
  <line
     x1="250"
     y1="756"
     x2="906"
     y2="756"
     stroke="#f87171"
     stroke-width="2"
     marker-end="url(#arr)"
     id="line32" />
  <text
     x="568"
     y="750"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text33">TDLS Teardown（正常走直连）→ 撤销 direct link，回到经 AP 中转</text>
  <text
     x="113"
     y="776"
     fill="#64748b"
     font-size="9.5"
     id="text34">例外：若对端在直连上已不可达（如走出直连射程），Teardown 改经 AP 发送，原因码 = TDLS_TEARDOWN_PEER_UNREACHABLE</text>
  <!-- footer -->
  <rect
     x="95"
     y="800"
     width="970"
     height="58"
     rx="6"
     fill="#0f172a"
     stroke="#475569"
     stroke-width="1"
     id="rect34" />
  <text
     x="580"
     y="820"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text35">一条龙过滤：wlan.tdls || (eth.type==0x890d) || wlan.fc.type_subtype==0x0d（Action）　（off-channel 数据需在对应信道上抓）</text>
  <text
     x="580"
     y="840"
     text-anchor="middle"
     fill="#64748b"
     font-size="9.5"
     id="text36">TDLS 信令封装在 EtherType 89-0d 的数据帧里（§11.20.2）；唯一例外是 Discovery Response —— 它是 Public Action 管理帧，直连发送</text>
  <text
     x="580"
     y="888"
     text-anchor="middle"
     fill="#64748b"
     font-size="10.5"
     id="text37">蓝/靛信令先借道 AP 把&quot;内线&quot;牵好，红色粗线是接通后的直连通话 —— 这正是 &quot;Tunneled（隧道）&quot; 的由来</text>
</svg>
