   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview20"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.49"
     inkscape:cx="550.33557"
     inkscape:cy="319.79866"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg20" />
  <defs
     id="defs2">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <style
       id="style2">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
  </defs>
  <rect
     width="1100"
     height="640"
     fill="url(#bg)"
     id="rect2" />
  <text
     x="550"
     y="38"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text2">TDLS 直连建立时序 — 信令借道 AP，数据走直连</text>
  <text
     x="550"
     y="62"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13"
     id="text3">&quot;隧道&quot;的含义：建立信令封装成数据帧、经 AP 转发；建成后数据点对点直传</text>
  <!-- 三条泳道 -->
  <line
     x1="180"
     y1="95"
     x2="180"
     y2="560"
     stroke="#ff6b6b"
     stroke-width="2"
     id="line3" />
  <line
     x1="550"
     y1="95"
     x2="550"
     y2="560"
     stroke="#64748b"
     stroke-width="2"
     id="line4" />
  <line
     x1="920"
     y1="95"
     x2="920"
     y2="560"
     stroke="#ff6b6b"
     stroke-width="2"
     id="line5" />
  <rect
     x="110"
     y="95"
     width="140"
     height="40"
     rx="6"
     fill="#7f1d1d"
     id="rect5" />
  <text
     x="180"
     y="120"
     text-anchor="middle"
     fill="#fff"
     font-size="14"
     id="text5">STA A（发起方）</text>
  <rect
     x="490"
     y="95"
     width="120"
     height="40"
     rx="6"
     fill="#475569"
     id="rect6" />
  <text
     x="550"
     y="120"
     text-anchor="middle"
     fill="#fff"
     font-size="14"
     id="text6">AP（前台）</text>
  <rect
     x="850"
     y="95"
     width="140"
     height="40"
     rx="6"
     fill="#7f1d1d"
     id="rect7" />
  <text
     x="920"
     y="120"
     text-anchor="middle"
     fill="#fff"
     font-size="14"
     id="text7">STA B（响应方）</text>
  <!-- 阶段一：发现 -->
  <text
     x="60"
     y="180"
     fill="#fbbf24"
     font-size="13"
     font-weight="700"
     id="text8">① 发现</text>
  <!-- Discovery Req A->AP->B -->
  <line
     x1="180"
     y1="195"
     x2="920"
     y2="195"
     stroke="#94a3b8"
     stroke-width="2"
     stroke-dasharray="6,4"
     id="line8" />
  <polygon
     points="912,189 928,195 912,201"
     fill="#94a3b8"
     id="polygon8" />
  <circle
     cx="550"
     cy="195"
     r="5"
     fill="#475569"
     stroke="#94a3b8"
     id="circle8" />
  <text
     x="536"
     y="184"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="12px"
     id="text9">Discovery Request（经 AP 转发）</text>
  <!-- Discovery Resp B->A 直连 -->
  <line
     x1="920"
     y1="225"
     x2="180"
     y2="225"
     stroke="#ff6b6b"
     stroke-width="2.5"
     id="line9" />
  <polygon
     points="188,219 172,225 188,231"
     fill="#ff6b6b"
     id="polygon9" />
  <text
     x="550"
     y="245"
     text-anchor="middle"
     fill="#fca5a5"
     font-size="12"
     id="text10">Discovery Response（直接回，不经 AP）</text>
  <!-- 阶段二：建立 三帧握手 经 AP -->
  <text
     x="60"
     y="300"
     fill="#fbbf24"
     font-size="13"
     font-weight="700"
     id="text11">② 建立</text>
  <text
     x="335"
     y="278"
     text-anchor="middle"
     fill="#64748b"
     font-size="11"
     id="text12">（三帧握手都经 AP，因直连尚未建成）</text>
  <!-- Setup Request -->
  <line
     x1="180"
     y1="305"
     x2="920"
     y2="305"
     stroke="#38bdf8"
     stroke-width="2"
     id="line12" />
  <polygon
     points="912,299 928,305 912,311"
     fill="#38bdf8"
     id="polygon12" />
  <circle
     cx="550"
     cy="305"
     r="5"
     fill="#475569"
     stroke="#38bdf8"
     id="circle12" />
  <text
     x="430"
     y="320"
     text-anchor="middle"
     fill="#7dd3fc"
     font-size="12"
     id="text13">TDLS Setup Request〔含 TPK M1〕</text>
  <!-- Setup Response -->
  <line
     x1="920"
     y1="345"
     x2="180"
     y2="345"
     stroke="#38bdf8"
     stroke-width="2"
     id="line13" />
  <polygon
     points="188,339 172,345 188,351"
     fill="#38bdf8"
     id="polygon13" />
  <circle
     cx="550"
     cy="345"
     r="5"
     fill="#475569"
     stroke="#38bdf8"
     id="circle13" />
  <text
     x="674"
     y="360"
     text-anchor="middle"
     fill="#7dd3fc"
     font-size="12px"
     id="text14">TDLS Setup Response〔含 TPK M2〕</text>
  <!-- Setup Confirm -->
  <line
     x1="180"
     y1="385"
     x2="920"
     y2="385"
     stroke="#38bdf8"
     stroke-width="2"
     id="line14" />
  <polygon
     points="912,379 928,385 912,391"
     fill="#38bdf8"
     id="polygon14" />
  <circle
     cx="550"
     cy="385"
     r="5"
     fill="#475569"
     stroke="#38bdf8"
     id="circle14" />
  <text
     x="430"
     y="400"
     text-anchor="middle"
     fill="#7dd3fc"
     font-size="12"
     id="text15">TDLS Setup Confirm〔含 TPK M3〕</text>
  <!-- 阶段三：安全（TPK 内嵌在上面三帧里，不是独立步骤） -->
  <text
     x="60"
     y="448"
     fill="#fbbf24"
     font-size="13"
     font-weight="700"
     id="text16">③ 安全</text>
  <text
     x="544"
     y="440"
     text-anchor="middle"
     fill="#d8b4fe"
     font-size="12px"
     id="text17">TPK 握手 M1/M2/M3 就内嵌在上面 Setup 三帧里（非独立第四步）</text>
  <text
     x="550"
     y="458"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text18">→ 协商出直连专用密钥 TPK（独立于各自与 AP 的密钥；nonce 借 AP 加密链路保护）</text>
  <!-- 直连建成 数据走直连 -->
  <rect
     x="180"
     y="490"
     width="740"
     height="46"
     rx="8"
     fill="#7f1d1d"
     stroke="#ff6b6b"
     stroke-width="2"
     id="rect18" />
  <line
     x1="200"
     y1="513"
     x2="900"
     y2="513"
     stroke="#ff6b6b"
     stroke-width="4"
     id="line18" />
  <polygon
     points="894,506 910,513 894,520"
     fill="#ff6b6b"
     id="polygon18" />
  <polygon
     points="206,506 190,513 206,520"
     fill="#ff6b6b"
     id="polygon19" />
  <text
     x="550"
     y="508"
     text-anchor="middle"
     fill="#ff6b6b"
     font-size="13"
     font-weight="700"
     id="text19">direct link 建成 → 数据走直连（一跳，不经 AP）</text>
  <text
     x="550"
     y="590"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12"
     id="text20">先借道 AP 把&quot;内线&quot;牵好（蓝色信令），接通后通话走直连（红色粗线）——这正是 &quot;Tunneled&quot; 的由来。</text>
</svg>
