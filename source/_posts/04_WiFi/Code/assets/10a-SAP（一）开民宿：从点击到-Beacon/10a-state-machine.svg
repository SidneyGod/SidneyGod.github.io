<defs id="defs6">
  <linearGradient id="bg-grad" x1="0" y1="0" x2="789.93671" y2="789.93671" gradientTransform="scale(1.2152872,0.78487301)" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0f0f1a" id="stop1" />
    <stop offset="100%" stop-color="#1a1a2e" id="stop2" />
  </linearGradient>
  <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0,6 0,0 8,3 " fill="#f97316" id="polygon2" />
  </marker>
  <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0,6 0,0 8,3 " fill="#ef4444" id="polygon3" />
  </marker>
  <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0,6 0,0 8,3 " fill="#10b981" id="polygon4" />
  </marker>
  <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0,6 0,0 8,3 " fill="#eab308" id="polygon5" />
  </marker>
