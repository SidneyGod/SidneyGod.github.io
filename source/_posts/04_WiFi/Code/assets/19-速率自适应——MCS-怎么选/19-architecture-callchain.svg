<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<style>text { font-family: 'Maple Mono Normal NL NF CN','Microsoft YaHei',sans-serif; fill: #e2e8f0; }</style>
<defs>
  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f0f1a"/>
    <stop offset="100%" stop-color="#1a1a2e"/>
  </linearGradient>
  <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#10b981"/>
  </marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#f97316"/>
  </marker>
  <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#22d3ee"/>
  </marker>
</defs>
<rect width="1200" height="800" fill="url(#bg-grad)"/>
<text x="600" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#e2e8f0">速率自适应（RA）落层全景 · 谁在选 MCS</text>
<text x="600" y="50" text-anchor="middle" font-size="12.5" fill="#94a3b8">速率自适应的位置由驱动架构决定：软 MAC 的 Minstrel-HT 整段闭环在主机，full-mac 的 RA 决策沉入固件，主机只留「速率表 / 参数 / 统计」三层</text>

<!-- 垂直分栏虚线 -->
<line x1="600" y1="70" x2="600" y2="770" stroke="#2a2a45" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- ================= A · 软 MAC ================= -->
<text x="60" y="90" text-anchor="start" font-size="14" font-weight="bold" fill="#10b981">A · 软 MAC（Linux mac80211）— RA 闭环整段在主机</text>
<rect x="40" y="105" width="520" height="540" fill="#052e16" opacity="0.25"/>
<path d="M 40 105 L 560 105" stroke="#2a2a45" stroke-width="1.2" fill="none"/>
<text x="52" y="128" font-size="12.5" font-weight="bold" fill="#6ee7b7">主机 kernel（mac80211 / rc80211_minstrel_ht.c）</text>

<!-- Minstrel-HT 五件套，纵向链 -->
<rect x="70" y="145" width="360" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
<text x="82" y="166" font-size="12" fill="#a7f3d0">成功 / 失败计数（success / attempts）</text>
<line x1="250" y1="179" x2="250" y2="194" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

<rect x="70" y="195" width="360" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
<text x="82" y="216" font-size="12" fill="#a7f3d0">EWMA 平滑（α=0.75）→ prob_avg</text>
<line x1="250" y1="229" x2="250" y2="244" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

<rect x="70" y="245" width="360" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
<text x="82" y="266" font-size="12" fill="#a7f3d0">吞吐估计 T=p×R（minstrel_ht_get_tp_avg）</text>
<line x1="250" y1="279" x2="250" y2="294" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

<rect x="70" y="295" width="360" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
<text x="82" y="316" font-size="12" fill="#a7f3d0">每 50ms 排序选速率（HZ/20）</text>
<line x1="250" y1="329" x2="250" y2="344" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

<rect x="70" y="345" width="360" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
<text x="82" y="366" font-size="12" fill="#a7f3d0">lookaround 探测 20ms（minstrel_ht_get_rate）</text>
<line x1="250" y1="379" x2="250" y2="394" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

<rect x="70" y="395" width="360" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
<text x="82" y="416" font-size="12" fill="#a7f3d0">4 级 MRR 重试链（minstrel_ht_update_rates）</text>
<line x1="250" y1="429" x2="250" y2="444" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

<rect x="70" y="445" width="360" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.4"/>
<text x="82" y="466" font-size="12" fill="#a7f3d0">写回硬件速率表（rate_control_set_rates）</text>

<!-- 闭环回环箭头（右侧竖线） -->
<path d="M 452 162 Q 500 162 500 470 Q 500 520 452 520" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
<text x="508" y="320" text-anchor="start" font-size="11" fill="#34d399">TX 状态回传</text>
<text x="508" y="338" text-anchor="start" font-size="11" fill="#34d399">→ 闭环在主机</text>

<!-- 软 MAC 的硬件层 -->
<rect x="40" y="560" width="520" height="80" fill="#14142b" opacity="0.5"/>
<path d="M 40 560 L 560 560" stroke="#2a2a45" stroke-width="1.2" fill="none"/>
<text x="52" y="582" font-size="12.5" font-weight="bold" fill="#94a3b8">硬件</text>
<rect x="70" y="594" width="360" height="30" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.3"/>
<text x="82" y="613" font-size="12" fill="#cbd5e1">只执行主机选好的重试链，不决策</text>

<!-- ================= B · full-mac ================= -->
<text x="640" y="90" text-anchor="start" font-size="14" font-weight="bold" fill="#f97316">B · full-mac（QCOM / MTK）— RA 决策在固件</text>
<rect x="620" y="105" width="540" height="380" fill="#1c1917" opacity="0.35"/>
<path d="M 620 105 L 1160 105" stroke="#2a2a45" stroke-width="1.2" fill="none"/>
<text x="632" y="128" font-size="12.5" font-weight="bold" fill="#fdba74">驱动主机（qca-wifi-host-cmn / Gen4M）— 只留三层</text>

<!-- 三层 -->
<rect x="650" y="145" width="440" height="34" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.3"/>
<text x="662" y="166" font-size="12" fill="#cbd5e1">速率表（词典）：dp_getrateindex / dp_rate_idx_to_kbps</text>

<rect x="650" y="195" width="440" height="34" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.4"/>
<text x="662" y="216" font-size="12" fill="#fdba74">参数下发（约束）：WMI / UNI_CMD_RA · 上限·掩码·固定速率·探测间隔</text>

<rect x="650" y="245" width="440" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
<text x="662" y="266" font-size="12" fill="#a7f3d0">统计消费（账本）：htt_tx_peer_rate_stats_tlv / PARAM_GET_STA_STATISTICS</text>

<!-- 下发箭头（参数 → 固件） -->
<path d="M 760 229 L 760 330" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="770" y="285" text-anchor="start" font-size="11" fill="#fbbf24">下发（定边界，不定速率）</text>

<!-- 固件虚线框 -->
<rect x="620" y="330" width="540" height="155" fill="#1a1030" opacity="0.5" stroke="#f97316" stroke-width="1.6" stroke-dasharray="7,5"/>
<text x="632" y="355" font-size="12.5" font-weight="bold" fill="#fbbf24">固件（虚线 = 主机不可见）</text>
<rect x="650" y="370" width="440" height="48" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
<text x="662" y="390" font-size="12.5" fill="#fdba74">RA 引擎（MCS / NSS / BW 升降级决策循环）</text>
<text x="662" y="408" font-size="11" fill="#94a3b8">输入 ack_rssi / 重传 / 成功计数 → 输出逐帧速率</text>

<!-- 回传箭头（固件 → 统计） -->
<path d="M 980 370 L 980 281" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="992" y="325" text-anchor="start" font-size="11" fill="#34d399">回传（读结果）</text>

<!-- 对比结论条 -->
<rect x="620" y="560" width="540" height="80" fill="#14142b" opacity="0.5"/>
<path d="M 620 560 L 1160 560" stroke="#2a2a45" stroke-width="1.2" fill="none"/>
<text x="632" y="584" font-size="12.5" font-weight="bold" fill="#94a3b8">主机对 RA 的态度</text>
<rect x="650" y="596" width="440" height="30" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.3"/>
<text x="662" y="615" font-size="12" fill="#a5f3fc">能看（统计）、能管边界（参数）、不能亲自操盘（算法在固件）</text>

<!-- 图例 -->
<line x1="620" y1="720" x2="680" y2="720" stroke="#f97316" stroke-width="2"/>
<text x="690" y="724" font-size="11" fill="#94a3b8">橙 = 主机下发（参数/约束）</text>
<line x1="850" y1="720" x2="910" y2="720" stroke="#10b981" stroke-width="2"/>
<text x="920" y="724" font-size="11" fill="#94a3b8">绿 = 结果回传（统计）</text>
<line x1="1050" y1="720" x2="1110" y2="720" stroke="#f97316" stroke-width="1.6" stroke-dasharray="5,3"/>
<text x="1120" y="724" font-size="11" fill="#94a3b8">虚线 = 固件边界</text>

<text x="620" y="755" font-size="11" fill="#64748b">full-mac 主机留下的三层，是 Minstrel 五件套「抽走算法」后剩下的参数与结果</text>
</svg>
