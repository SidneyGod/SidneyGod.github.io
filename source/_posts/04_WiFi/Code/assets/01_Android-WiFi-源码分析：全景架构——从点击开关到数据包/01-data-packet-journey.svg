<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
<title>数据包从 App 到网卡的旅程</title>
<style>text{font-family:'Maple Mono Normal NL NF CN','Microsoft YaHei',sans-serif;}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#00d4ff"/></marker>
  <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f97316"/></marker>
</defs>

<rect width="1000" height="640" fill="url(#bg)"/>
<rect x="1" y="1" width="998" height="638" rx="8" fill="none" stroke="#2a2d35" stroke-width="1.5"/>
<text x="500" y="28" text-anchor="middle" style="font-size:16px;fill:#c0c8d4;font-weight:bold;">数据包旅程：从 App 到 WiFi 芯片</text>

<!-- ═══════════ TX（左→右） ═══════════ -->
<text x="30" y="55" style="font-size:13px;fill:#00d4ff;font-weight:bold;">发送路径 (TX)</text>

<!-- TX Row 1: App(60)→Socket(57)→TCP(36)→IP(111)  y=65 h=38 center=500 -->
<!-- total=60+20+57+20+36+20+111=324, x_off=500-162=338 -->
<rect x="338" y="65" width="60" height="38" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
<text x="368" y="84" text-anchor="middle" fill="#00d4ff" style="font-size:11px;" filter="url(#glow)">App</text>
<text x="368" y="96" text-anchor="middle" fill="#555" style="font-size:7px;">socket.send()</text>

<line x1="398" y1="84" x2="418" y2="84" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<rect x="418" y="65" width="57" height="38" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
<text x="447" y="84" text-anchor="middle" fill="#00d4ff" style="font-size:11px;">Socket</text>

<line x1="475" y1="84" x2="495" y2="84" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<rect x="495" y="65" width="36" height="38" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
<text x="513" y="84" text-anchor="middle" fill="#00d4ff" style="font-size:11px;">TCP</text>

<line x1="531" y1="84" x2="551" y2="84" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<rect x="551" y="65" width="111" height="38" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1"/>
<text x="607" y="84" text-anchor="middle" fill="#00d4ff" style="font-size:11px;">IP (ip_output)</text>

<!-- TX IP → Netfilter (L-shape) -->
<line x1="607" y1="103" x2="607" y2="118" stroke="#00d4ff" stroke-width="1.2"/>
<line x1="607" y1="118" x2="348" y2="118" stroke="#00d4ff" stroke-width="1.2"/>
<line x1="348" y1="118" x2="348" y2="130" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<!-- TX Row 2: Netfilter(150)→邻居(101)→网络设备层(163)  y=130 h=42 -->
<rect x="273" y="130" width="150" height="42" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
<text x="348" y="151" text-anchor="middle" fill="#00d4ff" style="font-size:9px;">Netfilter (POST_ROUTING)</text>

<line x1="423" y1="151" x2="443" y2="151" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<rect x="443" y="130" width="101" height="42" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
<text x="494" y="148" text-anchor="middle" fill="#00d4ff" style="font-size:9px;">邻居子系统 (ARP)</text>
<text x="494" y="162" text-anchor="middle" fill="#555" style="font-size:7px;">ip_finish_output2→neigh</text>

<line x1="544" y1="151" x2="564" y2="151" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<rect x="564" y="130" width="163" height="42" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
<text x="646" y="151" text-anchor="middle" fill="#00d4ff" style="font-size:9px;">网络设备层 (dev_queue_xmit)</text>

<!-- TX 网络设备层 → WiFi驱动 (L-shape) -->
<line x1="646" y1="172" x2="646" y2="186" stroke="#00d4ff" stroke-width="1.2"/>
<line x1="646" y1="186" x2="419" y2="186" stroke="#00d4ff" stroke-width="1.2"/>
<line x1="419" y1="186" x2="419" y2="200" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<!-- TX Row 3: WiFi驱动(159)→DMA(36)→WiFi芯片(86)  y=200 h=38/44 -->
<rect x="339" y="200" width="159" height="38" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="419" y="219" text-anchor="middle" fill="#00d4ff" style="font-size:9px;" filter="url(#glow)">WiFi 驱动 (ndo_start_xmit)</text>

<line x1="498" y1="219" x2="518" y2="219" stroke="#00d4ff" stroke-width="1.2" marker-end="url(#aT)"/>

<rect x="518" y="200" width="36" height="38" rx="5" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="536" y="219" text-anchor="middle" fill="#00d4ff" style="font-size:11px;">DMA</text>

<line x1="554" y1="219" x2="575" y2="219" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#aT)"/>

<rect x="575" y="197" width="86" height="44" rx="8" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.8" stroke-width="2"/>
<text x="618" y="217" text-anchor="middle" fill="#00d4ff" style="font-size:13px;font-weight:bold;" filter="url(#glow)">WiFi 芯片</text>
<text x="618" y="233" text-anchor="middle" fill="#555" style="font-size:8px;">帧封装→射频</text>
<text x="678" y="222" fill="#00d4ff" style="font-size:11px;" opacity="0.5">)))))</text>

<!-- ═══════════ 中间分隔 ═══════════ -->
<line x1="30" y1="268" x2="970" y2="268" stroke="#7b2fbe" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="8,4"/>

<!-- ═══════════ RX（右→左） ═══════════ -->
<text x="970" y="310" text-anchor="end" style="font-size:13px;fill:#f97316;font-weight:bold;">接收路径 (RX)</text>

<!-- RX Row 1: WiFi芯片(86)→DMA(36)→WiFi驱动(159)  y=320 h=44/38 -->
<!-- 先放 WiFi芯片在右端 x=575, 与 TX 对称 -->
<text x="678" y="340" fill="#f97316" style="font-size:11px;" opacity="0.5">(((((</text>

<rect x="575" y="320" width="86" height="44" rx="8" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.8" stroke-width="2"/>
<text x="618" y="340" text-anchor="middle" fill="#f97316" style="font-size:13px;font-weight:bold;" filter="url(#glow)">WiFi 芯片</text>
<text x="618" y="356" text-anchor="middle" fill="#664" style="font-size:8px;">射频接收→解封装</text>

<line x1="575" y1="342" x2="555" y2="342" stroke="#f97316" stroke-width="1.5" marker-end="url(#aR)"/>

<rect x="518" y="323" width="36" height="38" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="536" y="342" text-anchor="middle" fill="#f97316" style="font-size:11px;">DMA</text>

<line x1="518" y1="342" x2="498" y2="342" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<rect x="339" y="320" width="159" height="38" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.5"/>
<text x="419" y="339" text-anchor="middle" fill="#f97316" style="font-size:9px;" filter="url(#glow)">WiFi 驱动 (netif_receive_skb)</text>

<!-- RX WiFi驱动 → 网络设备层 (L-shape) -->
<line x1="419" y1="358" x2="419" y2="388" stroke="#f97316" stroke-width="1.2"/>
<line x1="419" y1="388" x2="677" y2="388" stroke="#f97316" stroke-width="1.2"/>
<line x1="677" y1="388" x2="677" y2="398" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<!-- RX Row 2: 网络设备层(157)→ip_rcv(156)→Netfilter(157)  y=398 h=42 -->
<rect x="598" y="398" width="157" height="42" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
<text x="677" y="419" text-anchor="middle" fill="#f97316" style="font-size:9px;">网络设备层 (netif_receive)</text>

<line x1="598" y1="419" x2="578" y2="419" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<rect x="422" y="398" width="156" height="42" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
<text x="500" y="416" text-anchor="middle" fill="#f97316" style="font-size:9px;">ip_rcv → ip_local_deliver</text>
<text x="500" y="430" text-anchor="middle" fill="#664" style="font-size:7px;">rx_handler → netif_core</text>

<line x1="422" y1="419" x2="402" y2="419" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<rect x="245" y="398" width="157" height="42" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
<text x="324" y="419" text-anchor="middle" fill="#f97316" style="font-size:9px;">Netfilter (PRE_ROUTING)</text>

<!-- RX Netfilter → IP (L-shape) -->
<line x1="324" y1="440" x2="324" y2="458" stroke="#f97316" stroke-width="1.2"/>
<line x1="324" y1="458" x2="615" y2="458" stroke="#f97316" stroke-width="1.2"/>
<line x1="615" y1="458" x2="615" y2="468" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<!-- RX Row 3: IP→TCP→Socket→App  y=468 h=38 -->
<rect x="541" y="468" width="148" height="38" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
<text x="615" y="487" text-anchor="middle" fill="#f97316" style="font-size:11px;">IP (ip_local_deliver)</text>

<line x1="541" y1="492" x2="521" y2="492" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<rect x="485" y="468" width="36" height="38" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
<text x="503" y="487" text-anchor="middle" fill="#f97316" style="font-size:11px;">TCP</text>

<line x1="485" y1="492" x2="465" y2="492" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<rect x="408" y="468" width="57" height="38" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
<text x="437" y="487" text-anchor="middle" fill="#f97316" style="font-size:11px;">Socket</text>

<line x1="408" y1="492" x2="388" y2="492" stroke="#f97316" stroke-width="1.2" marker-end="url(#aR)"/>

<rect x="318" y="468" width="70" height="38" rx="5" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.4" stroke-width="1"/>
<text x="353" y="487" text-anchor="middle" fill="#f97316" style="font-size:11px;" filter="url(#glow)">App</text>
<text x="353" y="500" text-anchor="middle" fill="#664" style="font-size:7px;">socket.recv()</text>

<!-- ═══════════ 底部注释 ═══════════ -->
<rect x="30" y="525" width="470" height="50" rx="6" fill="#0d2137" stroke="#00d4ff" stroke-opacity="0.15" stroke-width="1"/>
<text x="50" y="543" fill="#00d4ff" style="font-size:10px;font-weight:bold;">TX 关键函数</text>
<text x="50" y="558" fill="#777" style="font-size:9px;">ip_output() → NF_POST_ROUTING → ip_finish_output2() → neigh_output()</text>
<text x="50" y="570" fill="#777" style="font-size:9px;">→ dev_queue_xmit() → ndo_start_xmit() → DMA → 芯片</text>

<rect x="520" y="525" width="470" height="50" rx="6" fill="#2d1a0e" stroke="#f97316" stroke-opacity="0.15" stroke-width="1"/>
<text x="540" y="543" fill="#f97316" style="font-size:10px;font-weight:bold;">RX 关键函数</text>
<text x="540" y="558" fill="#888" style="font-size:9px;">芯片 → DMA → netif_receive_skb() → ip_rcv() → NF_PRE_ROUTING</text>
<text x="540" y="570" fill="#888" style="font-size:9px;">→ ip_local_deliver() → tcp_v4_rcv() → sock_def_readable() → App</text>

<line x1="30" y1="595" x2="970" y2="595" stroke="#7b2fbe" stroke-opacity="0.15" stroke-width="0.5"/>
<text x="500" y="612" text-anchor="middle" fill="#444" style="font-size:10px;">WiFi 驱动在内核中注册为 net_device，与有线网卡走完全相同的 ndo_start_xmit / netif_receive_skb 接口</text>
<text x="500" y="628" text-anchor="middle" fill="#444" style="font-size:10px;">上层 TCP/IP/Netfilter 栈完全不知道下面是 WiFi 还是有线——这正是 Linux 网络子系统的分层抽象</text>
</svg>
