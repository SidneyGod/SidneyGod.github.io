  <text
     x="40"
     y="46"
     font-size="18px"
     fill="#e2e8f0"
     font-weight="700"
     id="text17">p2p_init() 内存布局：单次 os_zalloc + strdup 游离</text>
  <text
     x="40"
     y="72"
     font-size="12px"
     fill="#94a3b8"
     id="text18">栈上 struct p2p_config → 单次 os_zalloc(p2p_data + cfg 紧邻) → 字符串 strdup 游离 · devices 空链表</text>
  <text
     x="40"
     y="604"
     font-size="12px"
     fill="#94a3b8"
     id="text19">单次 os_zalloc 把 p2p_data 与 cfg 放进同一块内存；字符串 strdup 游离；devices 空链表生命周期独立</text>
  <rect
     x="856"
     y="48"
     width="14"
     height="14"
     rx="3"
     ry="3"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1"
     id="rect19" />
  <text
     x="878"
     y="60"
     font-size="12px"
     fill="#cbd5e1"
     id="text20">栈</text>
  <rect
     x="902"
     y="48"
     width="14"
     height="14"
     rx="3"
     ry="3"
     fill="#052e16"
     stroke="#10b981"
     stroke-width="1"
     id="rect20" />
  <text
     x="924"
     y="60"
     font-size="12px"
     fill="#cbd5e1"
     id="text21">单次 os_zalloc 块</text>
  <rect
     x="1072"
     y="48"
     width="14"
     height="14"
     rx="3"
     ry="3"
     fill="#1e1b4b"
     stroke="#a855f7"
     stroke-width="1"
     id="rect21" />
  <text
     x="1094"
     y="60"
     font-size="12px"
     fill="#cbd5e1"
     id="text22">strdup 堆</text>
  <rect
     x="1168"
     y="48"
     width="14"
     height="14"
     rx="3"
     ry="3"
     fill="#1c1917"
     stroke="#f97316"
     stroke-width="1"
     id="rect22" />
  <text
     x="1190"
     y="60"
     font-size="12px"
     fill="#cbd5e1"
     id="text23">空链表</text>
  <text
     x="56"
     y="114"
     font-size="14px"
     fill="#60a5fa"
     font-weight="700"
     id="text24">栈 · wpas_p2p_init()</text>
  <text
     x="442"
     y="114"
     font-size="14px"
     fill="#34d399"
     font-weight="700"
     id="text25">堆 · 单次 os_zalloc(sizeof(*p2p) + sizeof(*cfg))</text>
  <text
     x="946"
     y="422"
     font-size="14px"
     fill="#a78bfa"
     font-weight="700"
     id="text26">堆 · os_strdup 游离字符串</text>
  <text
     x="946"
     y="118"
     font-size="14px"
     fill="#fb923c"
     font-weight="700"
     id="text27">devices 空链表 (dl_list)</text>
  <text
     x="68"
     y="154"
     font-size="13px"
     fill="#e2e8f0"
     font-weight="700"
     id="text28">struct p2p_config p2p</text>
  <text
     x="68"
     y="186"
     font-size="12px"
     fill="#cbd5e1"
     id="text29">35 个回调函数指针</text>
  <text
     x="68"
     y="210"
     font-size="12px"
     fill="#94a3b8"
     id="text30">dev_found / send_action …</text>
  <text
     x="68"
     y="244"
     font-size="12px"
     fill="#cbd5e1"
     id="text31">dev_addr (ETH_ALEN)</text>
  <text
     x="68"
     y="276"
     font-size="12px"
     fill="#cbd5e1"
     id="text32">dev_name → wpa_s-&gt;conf</text>
  <text
     x="68"
     y="308"
     font-size="12px"
     fill="#cbd5e1"
     id="text33">manufacturer → wpa_s-&gt;conf</text>
  <text
     x="68"
     y="340"
     font-size="12px"
     fill="#cbd5e1"
     id="text34">ssid_postfix (char*)</text>
  <text
     x="68"
     y="470"
     font-size="12px"
     fill="#94a3b8"
     id="text35">源配置：栈上局部变量</text>
  <text
     x="68"
     y="494"
     font-size="12px"
     fill="#94a3b8"
     id="text36">p2p_init 返回后栈释放</text>
  <text
     x="470"
     y="154"
     font-size="13px"
     fill="#e2e8f0"
     font-weight="700"
     id="text37">struct p2p_data</text>
  <text
     x="470"
     y="180"
     font-size="12px"
     fill="#cbd5e1"
     id="text38">state = P2P_IDLE</text>
  <text
     x="470"
     y="206"
     font-size="12px"
     fill="#cbd5e1"
     id="text39">dev_capab (位掩码)</text>
  <text
     x="470"
     y="232"
     font-size="12px"
     fill="#cbd5e1"
     id="text40">go_timeout = 100</text>
  <text
     x="470"
     y="258"
     font-size="12px"
     fill="#cbd5e1"
     id="text41">client_timeout = 20</text>
  <text
     x="470"
     y="284"
     font-size="12px"
     fill="#cbd5e1"
     id="text42">next_tie_breaker (随机)</text>
  <text
     x="470"
     y="310"
     font-size="12px"
     fill="#cbd5e1"
     id="text43">cfg → (尾部指针)</text>
  <text
     x="470"
     y="336"
     font-size="12px"
     fill="#cbd5e1"
     id="text44">devices (dl_list head)</text>
  <text
     x="470"
     y="422"
     font-size="13px"
     fill="#e2e8f0"
     font-weight="700"
     id="text45">p2p-&gt;cfg (尾部紧邻)</text>
  <text
     x="470"
     y="452"
     font-size="12px"
     fill="#cbd5e1"
     id="text46">35 个回调函数指针 (拷贝)</text>
  <text
     x="470"
     y="478"
     font-size="12px"
     fill="#cbd5e1"
     id="text47">dev_addr (ETH_ALEN)</text>
  <text
     x="470"
     y="504"
     font-size="12px"
     fill="#cbd5e1"
     id="text48">ssid_postfix (char*)</text>
  <text
     x="470"
     y="530"
     font-size="12px"
     fill="#cbd5e1"
     id="text49">dev_name → strdup 堆</text>
  <text
     x="470"
     y="556"
     font-size="12px"
     fill="#cbd5e1"
     id="text50">manufacturer → strdup 堆</text>
  <text
     x="456"
     y="380"
     font-size="12px"
     fill="#34d399"
     id="text51">▲ cfg 紧邻 p2p_data 尾部（同一块内存）</text>
  <text
     x="456"
     y="397"
     font-size="12px"
     fill="#94a3b8"
     id="text52">p2p-&gt;cfg = (struct p2p_config *)(p2p + 1)</text>
  <text
     x="958"
     y="459"
     font-size="12px"
     fill="#e2e8f0"
     id="text53">dev_name 字符串 (os_strdup)</text>
  <text
     x="958"
     y="507"
     font-size="12px"
     fill="#e2e8f0"
     id="text54">manufacturer 字符串 (os_strdup)</text>
  <text
     x="958"
     y="555"
     font-size="12px"
     fill="#e2e8f0"
     id="text55">model_name 字符串 (os_strdup)</text>
  <text
     x="958"
     y="228"
     font-size="13px"
     fill="#e2e8f0"
     font-weight="700"
     id="text56">dl_list head (空)</text>
  <text
     x="958"
     y="258"
     font-size="12px"
     fill="#cbd5e1"
     id="text57">next → 自身</text>
  <text
     x="958"
     y="286"
     font-size="12px"
     fill="#cbd5e1"
     id="text58">prev → 自身</text>
  <text
     x="946"
     y="344"
     font-size="12px"
     fill="#94a3b8"
     id="text59">初始为空 · 生命周期与 cfg 分离</text>
  <text
     x="370.229"
     y="461.34351"
     font-size="12px"
     fill="#34d399"
     text-anchor="middle"
     id="text60">os_memcpy 整块拷贝</text>
  <text
     x="885"
     y="444"
