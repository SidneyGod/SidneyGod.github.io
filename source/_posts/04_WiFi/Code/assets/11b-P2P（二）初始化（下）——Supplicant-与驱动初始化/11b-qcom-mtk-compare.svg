<text x="80" y="752" font-size="12.5" fill="#94a3b8"><tspan fill="#a855f7" font-weight="700">QCOM · 开机就绪</tspan> —— 驱动加载即批量 enable（即使从未打开 WiFi Direct，WMI/scan 已就位）</text>
<text x="80" y="774" font-size="12.5" fill="#94a3b8"><tspan fill="#f97316" font-weight="700">MTK · 来客才招</tspan> —— supplicant 下发 SET P2P MODE 才 p2pLaunch（net_device / FSM 按需分配）</text>
