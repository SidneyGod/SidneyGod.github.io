<text x="76" y="616" font-size="14" font-weight="700" fill="#a855f7">协作范式 · 消息传递（异步队列）</text>
<text x="76" y="640" font-size="12" fill="#94a3b8">组件经 scheduler 队列解耦，生产者/消费者不在同一调用栈</text>
<rect x="620" y="590" width="440" height="80" rx="6" ry="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.2"/>
<text x="636" y="616" font-size="14" font-weight="700" fill="#f97316">协作范式 · 直接调用（同栈同步）</text>
<text x="636" y="640" font-size="12" fill="#94a3b8">同一线程顺序执行，一个函数返回下一个才开始</text>
