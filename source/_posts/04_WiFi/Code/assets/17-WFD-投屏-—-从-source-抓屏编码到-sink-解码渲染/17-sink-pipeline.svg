<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 430" width="1500" height="430">
<!-- validate: skip-gap-consistency skip-row-centering -->
<style>
  text { font-family: 'Maple Mono Normal NL NF CN', 'Microsoft YaHei', sans-serif; letter-spacing: 0.02em; }
</style>
<defs>
<linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0f0f1a"/>
<stop offset="100%" stop-color="#1a1a2e"/>
</linearGradient>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
</marker>
</defs>
<rect width="1500" height="430" fill="url(#bg-grad)"/>
<text x="750" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">sink 端接收渲染链路 — RTP 解包重排 → 有序 TS → 解码渲染，NACK/RR 回传 source</text>
<rect x="50" y="170" width="250" height="80" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">ANetworkSession</text>
<text x="175" y="226" text-anchor="middle" font-size="11" fill="#94a3b8">收 RTP 数据报</text>
<line x1="300" y1="210" x2="360" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="360" y="140" width="320" height="140" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="520" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">RTPSink</text>
<text x="520" y="192" text-anchor="middle" font-size="11" fill="#e2e8f0">parseRTP 解头</text>
<text x="520" y="214" text-anchor="middle" font-size="11" fill="#e2e8f0">RFC3550 序号重排</text>
<text x="520" y="236" text-anchor="middle" font-size="11" fill="#e2e8f0">LinearRegression 估延迟</text>
<line x1="680" y1="210" x2="740" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="740" y="160" width="300" height="120" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="890" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">TunnelRenderer</text>
<text x="890" y="218" text-anchor="middle" font-size="11" fill="#e2e8f0">有序 TS · 50ms 缺包宽限</text>
<line x1="1040" y1="210" x2="1100" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="1100" y="150" width="330" height="120" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="1265" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">MediaPlayer</text>
<text x="1265" y="202" text-anchor="middle" font-size="11" fill="#e2e8f0">ATSParser 解 TS → 解码渲染上屏</text>
<text x="1265" y="226" text-anchor="middle" font-size="11" fill="#f97316">跨进程 Binder · IStreamSource 隧道喂数据</text>
<path d="M520,280 L520,345 L140,345 L140,250" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)"/>
<text x="400" y="337" text-anchor="middle" font-size="11" fill="#10b981">RTCP RR</text>
<path d="M890,280 L890,380 L60,380 L60,250" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)"/>
<text x="780" y="372" text-anchor="middle" font-size="11" fill="#10b981">generic NACK</text>
</svg>