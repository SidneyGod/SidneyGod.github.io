<text x="1200" y="284" text-anchor="middle" font-size="13" fill="#e2e8f0">TSPacketizer</text>
<text x="1200" y="305" text-anchor="middle" font-size="11" fill="#94a3b8">打 PES + 188B TS</text>
<line x1="1200" y1="320" x2="1200" y2="350" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="1060" y="350" width="280" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="1200" y="374" text-anchor="middle" font-size="13" fill="#e2e8f0">Sender</text>
<text x="1200" y="395" text-anchor="middle" font-size="11" fill="#94a3b8">切 RTP 发送</text>
