<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
</marker>
</defs>
<rect width="1400" height="470" fill="url(#bg-grad)"/>
<text x="700" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">source 端媒体流水线 — 音视频双 Track 交织 → TS 打包 → RTP 发送</text>
<text x="30" y="95" font-size="12" fill="#60a5fa">Track 0 · 视频</text>
<rect x="60" y="100" width="210" height="50" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="165" y="129" text-anchor="middle" font-size="13" fill="#e2e8f0">SurfaceMediaSource</text>
