<text x="655" y="289" text-anchor="middle" font-size="13" fill="#e2e8f0">Converter(编码AAC/直通LPCM)</text>
<path d="M1020,125 L1050,125 L1050,170 L1060,170" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path d="M770,285 L1050,285 L1050,210 L1060,210" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="1060" y="150" width="280" height="80" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.8"/>
<text x="1200" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#f97316">PlaybackSession.drainAccessUnits</text>
