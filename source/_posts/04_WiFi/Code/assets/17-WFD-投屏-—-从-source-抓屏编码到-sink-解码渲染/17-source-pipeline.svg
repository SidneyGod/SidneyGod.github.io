<rect x="60" y="260" width="230" height="50" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175" y="289" text-anchor="middle" font-size="13" fill="#e2e8f0">AudioSource(REMOTE_SUBMIX)</text>
