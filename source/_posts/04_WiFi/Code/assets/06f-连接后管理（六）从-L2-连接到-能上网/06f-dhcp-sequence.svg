  <!-- ===== Phase 1: Init ===== -->
  <rect
     x="30"
     y="95"
     width="900"
     height="65"
     rx="6"
     fill="#161b22"
     stroke="#334155"
     stroke-width="1"
     id="rect9" />
  <text
     x="45"
     y="112"
     fill="#94a3b8"
     font-size="11"
     font-weight="600"
     id="text9">阶段 1：DhcpInitState — 广播探测</text>
  <!-- CMD_START_DHCP -->
  <rect
     x="324"
     y="118"
     width="16"
     height="10"
     rx="2"
     fill="#60a5fa"
     id="rect10" />
  <path
     d="M 340,123 L 555,123"
     stroke="#60a5fa"
     stroke-width="1.5"
     marker-end="url(#arrow-blue)"
     id="path10" />
  <text
     x="430"
     y="115"
     text-anchor="middle"
     fill="#60a5fa"
     font-size="10"
     id="text10">CMD_START_DHCP</text>
  <text
     x="430"
     y="136"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text11">进入 DhcpInitState</text>
  <!-- DHCPDISCOVER -->
  <rect
     x="560"
     y="140"
     width="16"
     height="10"
     rx="2"
     fill="#f97316"
     id="rect11" />
  <path
