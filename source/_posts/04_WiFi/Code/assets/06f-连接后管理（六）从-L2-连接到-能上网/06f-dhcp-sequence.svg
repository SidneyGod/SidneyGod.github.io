     x="30"
     y="485"
     width="900"
     height="160"
     rx="6"
     fill="#161b22"
     stroke="#334155"
     stroke-width="1"
     id="rect27" />
  <text
     x="45"
     y="502"
     fill="#94a3b8"
     font-size="11"
     font-weight="600"
     id="text28">阶段 5：租约绑定 + T1/T2 续期</text>
  <!-- DhcpBoundState -->
  <text
     x="570"
     y="519"
     text-anchor="middle"
     fill="#4ade80"
     font-size="12px"
     font-weight="600"
     id="text29">DhcpBoundState</text>
  <text
     x="570"
     y="533"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10px"
     id="text30">scheduleLeaseTimers() 安排 T1/T2 定时器</text>
  <!-- T1 Timeline -->
  <rect
     x="200"
     y="550"
     width="660"
     height="90"
     rx="4"
     fill="#0d1117"
     stroke="#334155"
     stroke-width="1"
     id="rect30" />
  <text
     x="215"
     y="570"
     fill="#94a3b8"
     font-size="9"
     id="text31">租约期</text>
  <line
     x1="260"
     y1="555"
     x2="260"
     y2="580"
     stroke="#475569"
     stroke-width="1"
     id="line31" />
  <line
     x1="260"
     y1="555"
     x2="840"
     y2="555"
     stroke="#475569"
     stroke-width="1"
     id="line32" />
  <rect
     x="260"
     y="552"
     width="80"
     height="6"
     rx="3"
     fill="#10b981"
     opacity="0.5"
     id="rect32" />
  <text
     x="300"
     y="548"
     text-anchor="middle"
     fill="#10b981"
     font-size="8"
     id="text32">T1 (.5)</text>
  <rect
     x="260"
     y="552"
     width="575"
     height="6"
     rx="3"
     fill="#f59e0b"
     opacity="0.3"
     id="rect33" />
  <text
     x="548"
     y="548"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="8"
     id="text33">T2 (.875)</text>
  <text
     x="850"
     y="548"
     text-anchor="middle"
     fill="#ef4444"
     font-size="8"
     id="text34">到期</text>
  <!-- T1: Renew (unicast) -->
  <rect
     x="555"
     y="588"
     width="16"
     height="10"
     rx="2"
     fill="#f97316"
     id="rect34" />
  <path
     d="M 565,593 L 800,593"
     stroke="#f97316"
     stroke-width="1.5"
     marker-end="url(#arrow-orange)"
     id="path34" />
  <text
     x="683"
     y="586"
     text-anchor="middle"
     fill="#f97316"
     font-size="9"
     id="text35">T1: 单播续期 Request</text>
  <text
     x="683"
     y="605"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text36">DhcpRenewingState</text>
  <!-- T2: Rebind (broadcast) if T1 fails -->
  <rect
     x="555"
     y="615"
     width="16"
     height="10"
     rx="2"
     fill="#f97316"
     id="rect36" />
  <path
     d="M 565,620 L 800,620"
     stroke="#f97316"
     stroke-width="1.5"
     marker-end="url(#arrow-orange)"
     id="path36" />
  <text
     x="683"
     y="616"
     text-anchor="middle"
     fill="#f97316"
     font-size="9"
     id="text37">T2: 广播续期 Rebind（如 T1 失败）</text>
  <text
     x="683"
     y="635"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text38">DhcpRebindingState</text>
