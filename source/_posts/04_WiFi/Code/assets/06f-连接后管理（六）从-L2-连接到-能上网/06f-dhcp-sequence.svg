  <rect
     x="560"
     y="407"
     width="16"
     height="10"
     rx="2"
     fill="#10b981"
     id="rect23" />
  <path
     d="M 556,412 H 355"
     stroke="#10b981"
     stroke-width="1.5"
     marker-end="url(#arrow-green)"
