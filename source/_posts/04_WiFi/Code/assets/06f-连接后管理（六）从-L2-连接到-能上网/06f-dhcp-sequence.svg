     y="257"
     text-anchor="middle"
     fill="#f97316"
     font-size="10px"
     id="text17">DHCPREQUEST（广播，携带 Option 50/54）</text>
  <!-- DHCPACK -->
  <rect
     x="800"
     y="283"
     width="16"
     height="10"
     rx="2"
     fill="#8b5cf6"
     id="rect17" />
  <path
     d="M 800,288 L 585,288"
     stroke="#a78bfa"
     stroke-width="1.5"
     marker-end="url(#arrow-purple)"
     id="path17" />
  <text
     x="693"
     y="281"
     text-anchor="middle"
     fill="#a78bfa"
     font-size="10"
     id="text18">DHCPACK（yiaddr + 租期 + DNS）</text>
  <!-- ===== Phase 4: ARP + Config ===== -->
  <rect
     x="30"
     y="310"
     width="900"
     height="165"
     rx="6"
     fill="#161b22"
     stroke="#334155"
     stroke-width="1.14892"
     id="rect18" />
  <text
     x="45"
     y="327"
     fill="#94a3b8"
     font-size="11"
     font-weight="600"
     id="text19">阶段 4：ARP 冲突检测 + 接口配置</text>
  <!-- confirmDhcpLease (internal) -->
  <text
     x="570"
     y="332"
     text-anchor="middle"
     fill="#fb923c"
     font-size="10px"
     id="text20">→ IpAddressConflictDetectingState</text>
  <text
     x="570"
     y="348"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9px"
     id="text21">ARP Probe（sender=0.0.0.0, target=分配IP）</text>
  <!-- ARP Announce -->
  <text
     x="570"
     y="369"
     text-anchor="middle"
     fill="#4ade80"
     font-size="10px"
     id="text22">ARP Announce（无冲突 → 宣告 IP）</text>
  <text
     x="570"
     y="385"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9px"
     id="text23">→ ConfiguringInterfaceState</text>
