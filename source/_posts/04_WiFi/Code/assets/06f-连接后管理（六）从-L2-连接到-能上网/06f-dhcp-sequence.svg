     text-anchor="middle"
     fill="#a78bfa"
     font-size="10"
     id="text14">DHCPOFFER（携带可用 IP）</text>
  <text
     x="693"
     y="215"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9"
     id="text15">保存 mOffer，进入 DhcpRequestingState</text>
  <!-- ===== Phase 3: Request ===== -->
  <rect
     x="30"
     y="240"
     width="900"
     height="60"
     rx="6"
     fill="#161b22"
     stroke="#334155"
     stroke-width="1"
     id="rect15" />
  <text
     x="45"
     y="257"
     fill="#94a3b8"
     font-size="11"
     font-weight="600"
     id="text16">阶段 3：DhcpRequestingState — 正式申请</text>
  <!-- DHCPREQUEST -->
  <rect
     x="560"
     y="263"
     width="16"
     height="10"
     rx="2"
     fill="#f97316"
     id="rect16" />
  <path
