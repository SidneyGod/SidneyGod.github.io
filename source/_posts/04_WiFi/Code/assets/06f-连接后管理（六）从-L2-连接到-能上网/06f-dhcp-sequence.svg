     stroke-width="1.5"
     marker-end="url(#arrow-orange)"
     id="path11" />
  <text
     x="683"
     y="138"
     text-anchor="middle"
     fill="#f97316"
     font-size="10"
     id="text12">DHCPDISCOVER（广播）</text>
  <!-- ===== Phase 2: Offer ===== -->
  <rect
     x="30"
     y="170"
     width="900"
     height="60"
     rx="6"
     fill="#161b22"
     stroke="#334155"
     stroke-width="1"
     id="rect12" />
  <text
     x="45"
     y="187"
     fill="#94a3b8"
     font-size="11"
     font-weight="600"
     id="text13">阶段 2：服务器响应 Offer</text>
  <!-- DHCPOFFER -->
  <rect
     x="800"
     y="193"
     width="16"
     height="10"
     rx="2"
     fill="#8b5cf6"
     id="rect13" />
  <path
