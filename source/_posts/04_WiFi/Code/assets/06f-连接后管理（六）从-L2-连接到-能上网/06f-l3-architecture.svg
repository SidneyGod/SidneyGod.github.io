<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900">
<title>L3 配置全局分层：从 ClientModeImpl 到内核 FIB</title>
  <!-- validate: skip-row-centering -->
<style>
  text { font-family: 'Maple Mono Normal NL NF CN',Monaco,'Microsoft YaHei',monospace; }
</style>
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect width="960" height="900" fill="#0d1117"/>
<text x="480" y="32" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="600">L3 配置全局分层：从 ClientModeImpl 到内核 FIB</text>
<rect x="100" y="56" width="380" height="86" rx="8" fill="#1a2535" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="100" y="56" width="5" height="86" rx="2" fill="#60a5fa"/>
<text x="290.0" y="84" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">ClientModeImpl</text>
<text x="290.0" y="106" text-anchor="middle" fill="#94a3b8" font-size="12">WiFi 框架 · system_server</text>
<text x="290.0" y="126" text-anchor="middle" fill="#94a3b8" font-size="12">L3ProvisioningState → startIpClient()</text>
<rect x="100" y="182" width="380" height="86" rx="8" fill="#1a2535" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="100" y="182" width="5" height="86" rx="2" fill="#60a5fa"/>
<text x="290.0" y="210" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">IpClient</text>
<text x="290.0" y="232" text-anchor="middle" fill="#94a3b8" font-size="12">NetworkStack 进程 · IP 配置总管</text>
<text x="290.0" y="252" text-anchor="middle" fill="#94a3b8" font-size="12">DHCP / 静态 IP → assembleLinkProperties()</text>
<rect x="100" y="308" width="380" height="86" rx="8" fill="#1a2535" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="100" y="308" width="5" height="86" rx="2" fill="#60a5fa"/>
<text x="290.0" y="336" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">NetworkAgent（WifiNetworkAgent）</text>
<text x="290.0" y="358" text-anchor="middle" fill="#94a3b8" font-size="12">构造即 register() · 向系统报到</text>
<text x="290.0" y="378" text-anchor="middle" fill="#94a3b8" font-size="12">sendLinkProperties() 上报 LinkProperties</text>
<rect x="100" y="434" width="380" height="86" rx="8" fill="#1a2535" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="100" y="434" width="5" height="86" rx="2" fill="#60a5fa"/>
<text x="290.0" y="462" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">ConnectivityService</text>
<text x="290.0" y="484" text-anchor="middle" fill="#94a3b8" font-size="12">system_server · 网络注册与路由总管</text>
<text x="290.0" y="504" text-anchor="middle" fill="#94a3b8" font-size="12">handleUpdateLinkProperties → updateRoutes()</text>
<rect x="100" y="560" width="380" height="86" rx="8" fill="#1a2535" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="100" y="560" width="5" height="86" rx="2" fill="#60a5fa"/>
<text x="290.0" y="588" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">netd（native 守护进程）</text>
<text x="290.0" y="610" text-anchor="middle" fill="#94a3b8" font-size="12">networkAddRouteParcel()</text>
<text x="290.0" y="630" text-anchor="middle" fill="#94a3b8" font-size="12">RouteController::modifyRoute(RTM_NEWROUTE)</text>
<rect x="100" y="686" width="380" height="86" rx="8" fill="#1a2535" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="100" y="686" width="5" height="86" rx="2" fill="#60a5fa"/>
<text x="290.0" y="714" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">内核（Kernel）</text>
<text x="290.0" y="736" text-anchor="middle" fill="#94a3b8" font-size="12">rtm_newroute()</text>
<text x="290.0" y="756" text-anchor="middle" fill="#94a3b8" font-size="12">fib_table_insert() → 写入 FIB</text>
<line x1="290.0" y1="142" x2="290.0" y2="182" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="290.0" y1="268" x2="290.0" y2="308" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="290.0" y1="394" x2="290.0" y2="434" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="290.0" y1="520" x2="290.0" y2="560" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="290.0" y1="646" x2="290.0" y2="686" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="298.0" y1="162.0" x2="502" y2="162.0" stroke="#2a3a4a" stroke-width="1" stroke-dasharray="2,3"/>
<text x="510" y="160.0" fill="#cbd5e1" font-size="12" font-weight="600">AIDL · IIpClient</text>
<text x="510" y="176.0" fill="#94a3b8" font-size="12">startIpClient() → startProvisioning()（跨进程）</text>
<line x1="298.0" y1="288.0" x2="502" y2="288.0" stroke="#2a3a4a" stroke-width="1" stroke-dasharray="2,3"/>
<text x="510" y="286.0" fill="#cbd5e1" font-size="12" font-weight="600">LinkProperties 就绪</text>
<text x="510" y="302.0" fill="#94a3b8" font-size="12">配置结果交由 NetworkAgent 上报</text>
<line x1="298.0" y1="414.0" x2="502" y2="414.0" stroke="#2a3a4a" stroke-width="1" stroke-dasharray="2,3"/>
<text x="510" y="412.0" fill="#cbd5e1" font-size="12" font-weight="600">oneway Binder · INetworkAgentRegistry</text>
<text x="510" y="428.0" fill="#94a3b8" font-size="12">sendLinkProperties() 跨进程发送</text>
<line x1="298.0" y1="540.0" x2="502" y2="540.0" stroke="#2a3a4a" stroke-width="1" stroke-dasharray="2,3"/>
<text x="510" y="538.0" fill="#cbd5e1" font-size="12" font-weight="600">AIDL · INetd</text>
<text x="510" y="554.0" fill="#94a3b8" font-size="12">addRoute / removeRoute / updateRoute 下发</text>
<line x1="298.0" y1="666.0" x2="502" y2="666.0" stroke="#2a3a4a" stroke-width="1" stroke-dasharray="2,3"/>
<text x="510" y="664.0" fill="#cbd5e1" font-size="12" font-weight="600">netlink · NETLINK_ROUTE</text>
<text x="510" y="680.0" fill="#94a3b8" font-size="12">sendmsg(AF_NETLINK) 用户态 → 内核态</text>
<line x1="100" y1="666.0" x2="480" y2="666.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="160" y="806" width="640" height="66" rx="6" fill="#161b22" stroke="#334155" stroke-width="1"/>
<line x1="178" y1="826" x2="202" y2="826" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="214" y="830" fill="#94a3b8" font-size="12">蓝箭 = 下发 / 数据流（L3 配置逐层下推）</text>
<text x="178" y="852" fill="#94a3b8" font-size="12">虚线连出文字 = 层间跨进程 / 跨态机制（AIDL · Binder · netlink）</text>
</svg>