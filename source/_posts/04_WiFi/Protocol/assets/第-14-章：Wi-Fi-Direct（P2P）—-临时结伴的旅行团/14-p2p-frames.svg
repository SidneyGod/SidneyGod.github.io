  <rect
     width="1140"
     height="1100"
     fill="url(#bg)"
     id="rect4" />
  <text
     x="570"
     y="36"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text4">Wi-Fi Direct 完整帧交互 — 从发现到传文件</text>
  <text
     x="570"
     y="60"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12"
     id="text5">六段：① 发现（Scan→Find）→ ②（可选）配置发现 → ③ GO 协商三帧 → ④ 关联 + WSC 配对 → ⑤ 四次握手 → ⑥ 发 IP + 传输</text>
  <!-- lifelines: A(320) becomes Client / B(820) becomes GO -->
  <rect
     x="200"
     y="78"
     width="258"
     height="52"
     rx="8"
     fill="#3f2d6b"
     stroke="#a78bfa"
     stroke-width="2"
     id="rect5" />
  <text
     x="320"
     y="100"
     text-anchor="middle"
     fill="#ddd6fe"
     font-size="14"
     font-weight="700"
     id="text6">P2P 设备 A（发起方）</text>
  <text
     x="320"
     y="120"
     text-anchor="middle"
     fill="#c4b5fd"
     font-size="10"
     id="text7">协商后将成为 Client（团员）· Enrollee</text>
  <rect
     x="700"
     y="78"
     width="290"
     height="52"
     rx="8"
     fill="#0c3a2e"
     stroke="#34d399"
     stroke-width="2"
     id="rect7" />
  <text
     x="820"
     y="100"
     text-anchor="middle"
     fill="#a7f3d0"
     font-size="14"
     font-weight="700"
     id="text8">P2P 设备 B</text>
  <text
     x="820"
     y="120"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="10"
     id="text9">协商后将成为 GO（领队）· Registrar · DHCP</text>
  <line
     x1="320"
     y1="130"
     x2="320"
     y2="1036"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line9" />
  <line
     x1="820"
     y1="130"
     x2="820"
     y2="1036"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line10" />
  <!-- ============ ① Discovery: Scan + Find (teal) ============ -->
  <rect
     x="95"
     y="144"
     width="950"
     height="180"
     rx="8"
     fill="#0c2a2a"
     stroke="#14b8a6"
     stroke-width="1.5"
     id="rect10" />
  <text
     x="113"
     y="164"
     fill="#5eead4"
     font-size="13"
     font-weight="700"
     id="text10">① 发现 · 先 Scan 普查，再 Find 碰头</text>
  <!-- Scan: A's local action, self-loop -->
  <rect
     x="150"
     y="176"
     width="600"
     height="46"
     rx="6"
     fill="#0a2222"
     stroke="#2dd4bf"
     stroke-width="1"
     stroke-dasharray="5,3"
     id="rect11" />
  <text
     x="165"
     y="193"
     fill="#5eead4"
     font-size="10.5"
     font-weight="700"
     id="text11">Scan 阶段（初始扫描）· 复用 802.11 扫描</text>
  <text
     x="165"
     y="211"
     fill="#94a3b8"
     font-size="9.5"
     id="text12">A 扫遍所有信道，被动收 Beacon / Probe Response → 找现成组 + 选最佳信道；本阶段不应答任何探测</text>
  <path
     d="m 688,186 c 48,0 48,26 4,26"
     fill="none"
     stroke="#5eead4"
     stroke-width="1.6"
     marker-end="url(#art)"
     id="path12" />
  <!-- Find: mutual probe -->
  <text
     x="113"
     y="244"
     fill="#5eead4"
     font-size="11"
     font-weight="700"
     id="text13">Find 阶段 · 在社交信道 1/6/11 交替 Listen/Search，直到两台撞到同一信道（详见 14-p2p-discovery 图）</text>
  <line
     x1="320"
     y1="268"
     x2="816"
     y2="268"
     stroke="#5eead4"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line13" />
  <text
     x="568"
     y="262"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text14">Probe Request（含 P2P IE + WSC IE，P2P Wildcard SSID）</text>
  <line
     x1="820"
     y1="298"
     x2="324"
     y2="298"
     stroke="#5eead4"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line14" />
  <text
     x="568"
     y="292"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text15">Probe Response（含 P2P IE：设备名 / 类型 / Config Methods）</text>
  <text
     x="113"
     y="316"
     fill="#64748b"
     font-size="9.5"
     id="text16">两端互探，确认对方是 P2P 设备并交换能力 —— 此后都停在同一社交信道上</text>
  <!-- ============ ② Provision Discovery (cyan, optional dashed) ============ -->
  <rect
     x="95"
     y="336"
     width="950"
     height="92"
     rx="8"
     fill="#082f3f"
     stroke="#38bdf8"
     stroke-width="1.5"
     stroke-dasharray="6,4"
     id="rect16" />
  <text
     x="113"
     y="356"
     fill="#7dd3fc"
     font-size="13"
     font-weight="700"
     id="text17">②（可选）配置发现 · Provision Discovery · Public Action — 先约定用哪种 WPS 配对法</text>
  <line
     x1="320"
     y1="382"
     x2="816"
     y2="382"
     stroke="#7dd3fc"
     stroke-width="1.6"
     stroke-dasharray="5,3"
     marker-end="url(#ard)"
     id="line17" />
  <text
     x="568"
     y="376"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text18">Provision Discovery Request（Config Methods：PIN-Display / Keypad / PBC）</text>
  <line
     x1="820"
     y1="412"
     x2="324"
     y2="412"
     stroke="#7dd3fc"
     stroke-width="1.6"
     stroke-dasharray="5,3"
     marker-end="url(#ard)"
     id="line18" />
  <text
     x="568"
     y="406"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text19">Provision Discovery Response（回同一方法 = 同意；为空 = 失败）</text>
  <!-- ============ ③ GO Negotiation (yellow) ============ -->
  <rect
     x="95"
     y="440"
     width="950"
     height="158"
     rx="8"
     fill="#332b0a"
     stroke="#eab308"
     stroke-width="1.5"
     id="rect19" />
  <text
     x="113"
     y="460"
     fill="#fde68a"
     font-size="13"
     font-weight="700"
     id="text20">③ GO 协商 · 三帧 · Public Action（§3.1.4.2）— 决定谁当 GO，须 ≤15 秒内完成整个组建立</text>
  <line
     x1="320"
     y1="486"
     x2="816"
     y2="486"
     stroke="#fde68a"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line20" />
  <text
     x="568"
     y="480"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text21">GO Negotiation Request</text>
  <text
     x="568"
     y="499"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9.5"
     id="text22">GO Intent(+Tie-breaker) · Channel List · Listen/Operating Channel · Intended Interface Addr</text>
  <line
     x1="820"
     y1="532"
     x2="324"
     y2="532"
     stroke="#fde68a"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line22" />
  <text
     x="568"
     y="526"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text23">GO Negotiation Response</text>
  <text
     x="568"
     y="545"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9.5"
     id="text24">回应自己的 Intent · Status=Success · Tie-breaker 相对 Request 取反</text>
  <line
     x1="320"
     y1="578"
     x2="816"
     y2="578"
     stroke="#fbbf24"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line24" />
  <text
     x="568"
     y="572"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text25">GO Negotiation Confirmation</text>
  <text
     x="568"
     y="591"
     text-anchor="middle"
     fill="#facc15"
     font-size="9.5"
     id="text26">敲定角色：B Intent 大 → B 当 GO，A 当 Client · 确认 SSID / 工作信道</text>
  <!-- ============ ④ WPS Provisioning (orange) ============ -->
  <rect
     x="95"
     y="610"
     width="950"
     height="200"
     rx="8"
     fill="#3a210a"
     stroke="#fb923c"
     stroke-width="1.5"
     id="rect26" />
  <text
     x="113"
     y="630"
     fill="#fdba74"
     font-size="13"
     font-weight="700"
     id="text27">④ 配对 · 关联到 GO 后跑 WSC/WPS（§3.1.4.3）— GO=Registrar，Client=Enrollee</text>
  <line
     x1="320"
     y1="656"
     x2="816"
     y2="656"
     stroke="#fdba74"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line27" />
  <text
     x="568"
     y="650"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text28">802.11 Open Authentication + Association Request（带 WSC IE）</text>
  <line
     x1="820"
     y1="684"
     x2="324"
     y2="684"
     stroke="#fdba74"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line28" />
  <text
     x="568"
     y="678"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text29">Association Response</text>
  <line
     x1="320"
     y1="720"
     x2="816"
     y2="720"
     stroke="#fdba74"
     stroke-width="1.8"
     marker-end="url(#ar)"
     id="line29" />
  <text
     x="568"
     y="714"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text30">EAP-WSC：M1 →</text>
  <line
     x1="820"
     y1="744"
     x2="324"
     y2="744"
     stroke="#fdba74"
     stroke-width="1.8"
     marker-end="url(#ar)"
     id="line30" />
  <text
     x="568"
     y="738"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text31">← M2（GO 直接回 M2，不发 M2D：两端早已确认授权）</text>
  <line
     x1="320"
     y1="768"
     x2="816"
     y2="768"
     stroke="#fdba74"
     stroke-width="1.8"
     marker-end="url(#ar)"
     id="line31" />
  <text
     x="568"
     y="762"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text32">M3 / M5 / M7 →　←M4 / M6 / M8（协商并下发 Credentials：SSID + 密码）</text>
  <text
     x="113"
     y="788"
     fill="#facc15"
     font-size="10px"
     id="text33">配对完成 → A 拿到组凭证，断开后用凭证重新关联（进入 RSNA）</text>
  <text
     x="113"
     y="804"
     fill="#64748b"
     font-size="9.5px"
     id="text34">PIN/PBC 需在协商前备好，因 WPS 可耗时长达 2 分钟而组建立只有 15 秒预算</text>
  <!-- ============ ⑤ 4-way handshake (indigo) ============ -->
  <rect
     x="95"
     y="822"
     width="950"
     height="116"
     rx="8"
     fill="#1e1b4b"
     stroke="#818cf8"
     stroke-width="1.5"
     id="rect34" />
  <text
     x="113"
     y="842"
     fill="#c7d2fe"
     font-size="13"
     font-weight="700"
     id="text35">⑤ 安全 · WPA2-Personal + AES-CCMP 四次握手（§3.2.6.1）— GO=Authenticator，Client=Supplicant</text>
  <line
     x1="820"
     y1="868"
     x2="324"
     y2="868"
     stroke="#a5b4fc"
     stroke-width="2.2"
     marker-end="url(#ar)"
     id="line35" />
  <text
     x="568"
     y="862"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text36">① ANonce →　② ← SNonce(+MIC)　③ GTK(+MIC) →　④ ← Ack</text>
  <line
     x1="320"
     y1="896"
     x2="816"
     y2="896"
     stroke="#a5b4fc"
     stroke-width="2.2"
     marker-end="url(#ar)"
     id="line36" />
  <text
     x="568"
     y="914"
     text-anchor="middle"
     fill="#c7d2fe"
     font-size="10.5"
     font-weight="700"
     id="text37">用 WSC 下发的凭证推出 PMK → 建 PTK/GTK → 组内单播/组播加密（802.11 第 8 章）</text>
  <text
     x="113"
     y="932"
     fill="#64748b"
     font-size="9.5"
     id="text38">这一段与普通 WPA2 完全一致 —— P2P 只是复用了 802.11 成熟的 RSNA</text>
  <!-- ============ ⑥ DHCP + data (green) ============ -->
  <rect
     x="95"
     y="950"
     width="950"
     height="86"
     rx="8"
     fill="#0c2a16"
     stroke="#22c55e"
     stroke-width="1.5"
     id="rect38" />
  <text
     x="113"
     y="970"
     fill="#86efac"
     font-size="13"
     font-weight="700"
     id="text39">⑥ 发 IP + 传输 · GO 当 DHCP 服务器（§3.2.6.1）</text>
  <line
     x1="320"
     y1="996"
     x2="816"
     y2="996"
     stroke="#86efac"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line39" />
  <text
     x="568"
     y="990"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text40">DHCP Discover/Request →　← Offer/Ack（IPv4 + 子网掩码，不下发默认网关）</text>
  <line
     x1="320"
     y1="1024"
     x2="816"
     y2="1024"
     stroke="#4ade80"
     stroke-width="2.5"
     marker-end="url(#ar)"
     id="line40" />
  <text
     x="568"
     y="1018"
     text-anchor="middle"
     fill="#bbf7d0"
     font-size="11"
     font-weight="700"
     id="text41">加密数据传输（用 Interface Address 通信）· GO 可用 NoA/OppPS 打盹省电</text>
  <!-- footer: wireshark + notes -->
  <rect
     x="95"
     y="1050"
     width="950"
     height="42"
     rx="6"
     fill="#0f172a"
     stroke="#475569"
     stroke-width="1"
     id="rect41" />
  <text
     x="570"
     y="1066"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text42">一条龙过滤：wlan.tag.oui==0x506f9a（P2P/WSC IE）|| wps || eapol || bootp　（关联前的 ①②③ 需 monitor mode 抓）</text>
  <text
     x="570"
     y="1083"
     text-anchor="middle"
     fill="#64748b"
     font-size="9.5"
     id="text43">①②③ 用 P2P Public Action 帧（Category 0x04 · OUI 50:6F:9A）；④ 起进入标准 802.11 关联/RSNA，与普通 Wi-Fi 一致</text>
</svg>
