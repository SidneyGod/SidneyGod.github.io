  <text
     x="454"
     y="472"
     text-anchor="middle"
     fill="#eab308"
     font-size="14px"
     font-weight="700"
     id="text21">GO Intent 判定规则（GO Intent attribute：1 字节 = 7-bit Intent + 1-bit Tie-breaker）</text>
  <text
     x="54"
     y="494"
     fill="#cbd5e1"
     font-size="12px"
     id="text22">① Intent 值大者当 GO（0–15，越大越想当）</text>
  <text
     x="54"
     y="514"
     fill="#cbd5e1"
     font-size="12px"
     id="text23">② Intent = 15 表示&quot;必须我当&quot;（仅当服务只能在 GO 上工作时使用）</text>
  <text
     x="54"
     y="534"
     fill="#cbd5e1"
     font-size="12px"
     id="text24">③ 双方 Intent 相等且 &lt; 15：发送 Tie-breaker 位 = 1 的一方当 GO（抛硬币）</text>
  <text
     x="54"
     y="554"
     fill="#f87171"
     font-size="12px"
     id="text25">④ 双方都填 15：协商失败 &quot;both indicated Intent of 15&quot; → 这趟团组不成</text>
