  <text
     x="446"
     y="34"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20px"
     font-weight="700"
     id="text4">FTM 测距 — t1/t2/t3/t4 四个时间戳的舞蹈</text>
  <text
     x="446"
     y="58"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13px"
     id="text5">发一帧、收一帧，各自掐表；RTT =（t4'−t1'）−（t3−t2）</text>
  <!-- actors -->
  <rect
     x="46"
     y="80"
     width="200"
     height="46"
     rx="6"
     fill="#c2410c"
     stroke="#f97316"
     stroke-width="2"
     id="rect5" />
  <text
     x="146"
     y="102"
     text-anchor="middle"
     fill="#ffffff"
     font-size="14px"
     font-weight="700"
     id="text6">RSTA（响应方）</text>
  <text
     x="146"
     y="119"
     text-anchor="middle"
     fill="#fed7aa"
     font-size="10px"
     id="text7">位置已知的 AP</text>
  <rect
     x="646"
     y="80"
     width="200"
     height="46"
     rx="6"
     fill="#1d4ed8"
     stroke="#3b82f6"
     stroke-width="2"
     id="rect7" />
  <text
     x="746"
     y="102"
     text-anchor="middle"
     fill="#ffffff"
     font-size="14px"
     font-weight="700"
     id="text8">ISTA（发起方）</text>
  <text
     x="746"
     y="119"
     text-anchor="middle"
     fill="#bfdbfe"
     font-size="10px"
     id="text9">想定位的手机</text>
  <line
     x1="146"
     y1="126"
     x2="146"
     y2="400"
     stroke="#334155"
     stroke-width="2"
     id="line9" />
  <line
     x1="746"
     y1="126"
     x2="746"
     y2="400"
     stroke="#334155"
     stroke-width="2"
     id="line10" />
  <!-- FTM frame -->
  <line
     x1="146"
     y1="170"
     x2="746"
     y2="230"
     stroke="#f97316"
     stroke-width="2.5"
     id="line11" />
  <polygon
     points="850,230 836,226 841,214 "
     fill="#f97316"
     id="polygon11"
