  <text
     x="416"
     y="186"
     fill="#fdba74"
     font-size="13px"
     font-weight="700"
     id="text11">FTM 帧</text>
  <circle
     cx="146"
     cy="170"
     r="5"
     fill="#fbbf24"
     id="circle11" />
  <text
     x="96"
     y="166"
     fill="#fbbf24"
     font-size="14px"
     font-weight="700"
     id="text12">t1</text>
  <text
     x="46"
     y="184"
     fill="#94a3b8"
     font-size="10px"
     id="text13">发出 FTM</text>
  <circle
     cx="746"
     cy="230"
     r="5"
     fill="#fbbf24"
     id="circle13" />
  <text
     x="764"
     y="228"
     fill="#fbbf24"
     font-size="14px"
     font-weight="700"
     id="text14">t2</text>
  <text
     x="764"
     y="244"
     fill="#94a3b8"
     font-size="10px"
     id="text15">收到 FTM</text>
  <!-- Ack -->
  <line
     x1="746"
     y1="280"
     x2="146"
     y2="340"
     stroke="#38bdf8"
     stroke-width="2.5"
     id="line15" />
  <polygon
     points="250,340 264,336 259,324 "
     fill="#38bdf8"
     id="polygon15"
     transform="translate(-104)" />
  <text
     x="436"
     y="324"
     fill="#7dd3fc"
     font-size="13px"
     font-weight="700"
     id="text16">Ack</text>
  <circle
     cx="746"
     cy="280"
     r="5"
     fill="#fbbf24"
     id="circle16" />
  <text
     x="764"
     y="285"
     fill="#fbbf24"
     font-size="14px"
     font-weight="700"
     id="text17">t3</text>
  <text
     x="764"
     y="299"
     fill="#94a3b8"
     font-size="10px"
     id="text18">发出 Ack</text>
  <circle
     cx="146"
     cy="340"
     r="5"
     fill="#fbbf24"
     id="circle18" />
  <text
     x="96"
     y="338"
     fill="#fbbf24"
     font-size="14px"
     font-weight="700"
     id="text19">t4</text>
  <text
     x="46"
     y="356"
     fill="#94a3b8"
     font-size="10px"
     id="text20">收到 Ack</text>
  <!-- follow up -->
  <line
     x1="146"
     y1="375"
     x2="746"
     y2="390"
     stroke="#a855f7"
     stroke-width="2"
     stroke-dasharray="6, 3"
     id="line20" />
  <polygon
     points="850,390 836,385 839,374 "
     fill="#a855f7"
     id="polygon20"
     transform="translate(-104)" />
  <text
     x="446"
     y="372"
     text-anchor="middle"
     fill="#d8b4fe"
     font-size="12px"
     font-weight="700"
     id="text21">follow-up FTM 帧：RSTA 把 t1、t4 告诉 ISTA</text>
  <!-- processing time annotation -->
  <text
     x="754"
     y="258"
     fill="#86efac"
     font-size="10px"
     id="text22">t3−t2 = ISTA 处理停留</text>
  <!-- formula card -->
  <rect
     x="16"
     y="425"
     width="500"
     height="120"
     rx="8"
     fill="url(#card)"
     stroke="#f97316"
     id="rect22"
     style="fill:url(#linearGradient30)" />
  <text
     x="266"
     y="451"
     text-anchor="middle"
     fill="#fdba74"
     font-size="14px"
     font-weight="700"
     id="text23">RTT 计算</text>
  <text
     x="36"
     y="481"
     fill="#e2e8f0"
     font-size="14px"
     id="text24">RTT = (t4' − t1') − (t3 − t2)</text>
  <text
     x="36"
     y="506"
     fill="#cbd5e1"
     font-size="11px"
     id="text25">t1/t4 由 RSTA 钟换算到 ISTA 钟，(t3−t2) 本就在 ISTA 钟上</text>
  <text
     x="36"
     y="528"
     fill="#86efac"
     font-size="11px"
     id="text26">折算到同一时钟基准 → 免对表；扣掉处理停留 = 纯飞行时间</text>
  <rect
     x="546"
     y="425"
     width="330"
     height="120"
     rx="8"
     fill="url(#card)"
     stroke="#22c55e"
     id="rect26"
     style="fill:url(#linearGradient31)" />
  <text
     x="711"
     y="451"
     text-anchor="middle"
     fill="#86efac"
     font-size="14px"
     font-weight="700"
     id="text27">距离换算</text>
  <text
     x="566"
     y="481"
     fill="#e2e8f0"
     font-size="14px"
     id="text28">距离 = c × RTT / 2</text>
  <text
     x="566"
     y="506"
     fill="#cbd5e1"
     font-size="11px"
     id="text29">c ≈ 3×10⁸ m/s；1 ns ≈ 0.3 m</text>
  <text
     x="566"
     y="528"
     fill="#fbbf24"
     font-size="11px"
     id="text30">时间戳字段以皮秒为单位</text>
</svg>
