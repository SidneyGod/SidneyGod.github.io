  <rect
     width="1180"
     height="960"
     fill="url(#bg)"
     id="rect4" />
  <text
     x="590"
     y="34"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text4">FTM 完整帧交互 — 经典 FTM（802.11mc）与 az NDP 测距对照</text>
  <text
     x="590"
     y="58"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12"
     id="text5">两条路殊途同归：都为集齐 t1/t2/t3/t4 → 算 RTT → 距离 = c × RTT ÷ 2。ISTA=想定位的手机，RSTA=位置已知的 AP</text>
  <!-- lifelines -->
  <rect
     x="150"
     y="80"
     width="230"
     height="48"
     rx="8"
     fill="#3f2d6b"
     stroke="#a78bfa"
     stroke-width="2"
     id="rect5" />
  <text
     x="265"
     y="100"
     text-anchor="middle"
     fill="#ddd6fe"
     font-size="14"
     font-weight="700"
     id="text6">ISTA（手机）</text>
  <text
     x="265"
     y="119"
     text-anchor="middle"
     fill="#c4b5fd"
     font-size="10"
     id="text7">发起方 · 想知道自己在哪</text>
  <rect
     x="800"
     y="80"
     width="230"
     height="48"
     rx="8"
     fill="#0c3a2e"
     stroke="#34d399"
     stroke-width="2"
     id="rect7" />
  <text
     x="915"
     y="100"
     text-anchor="middle"
     fill="#a7f3d0"
     font-size="14"
     font-weight="700"
     id="text8">RSTA（AP）</text>
  <text
     x="915"
     y="119"
     text-anchor="middle"
     fill="#6ee7b7"
     font-size="10"
     id="text9">响应方 · 位置已知</text>
  <line
     x1="265"
     y1="128"
     x2="265"
     y2="884"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line9" />
  <line
     x1="915"
     y1="128"
     x2="915"
     y2="884"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line10" />
  <!-- ① 协商 -->
  <rect
     x="95"
     y="142"
     width="990"
     height="86"
     rx="8"
     fill="#0c2a2a"
     stroke="#14b8a6"
     stroke-width="1.5"
     id="rect10" />
  <text
     x="113"
     y="162"
     fill="#5eead4"
     font-size="13"
     font-weight="700"
     id="text10">① 协商 · 先打招呼（§11.21.6.3）— 两路通用</text>
  <line
     x1="265"
     y1="188"
     x2="911"
     y2="188"
     stroke="#5eead4"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line11" />
  <text
     x="588"
     y="182"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text11">IFTMR（initial FTM Request）：请求测距 + FTM/Ranging Parameters（格式/带宽/调度）</text>
  <line
     x1="915"
     y1="216"
     x2="269"
     y2="216"
     stroke="#5eead4"
     stroke-width="2"
     marker-end="url(#ar)"
     id="line12" />
  <text
     x="588"
     y="210"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text12">IFTM（initial FTM）：RSTA 在 ≤10 ms 内回，含 Status + 协商结果</text>
  <!-- ② 经典 FTM (mc) -->
  <rect
     x="95"
     y="244"
     width="990"
     height="216"
     rx="8"
     fill="#332b0a"
     stroke="#eab308"
     stroke-width="1.5"
     id="rect12" />
  <text
     x="113"
     y="264"
     fill="#fde68a"
     font-size="13"
     font-weight="700"
     id="text13">②A 经典 FTM（802.11mc）· Action 帧 + Ack（§11.21.6.4）</text>
  <line
     x1="915"
     y1="292"
     x2="269"
     y2="292"
     stroke="#fbbf24"
     stroke-width="2"
     marker-end="url(#ary)"
     id="line13" />
  <text
     x="588"
     y="286"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text14">FTM_1（t1, t4 字段 = 0, 0）　RSTA 掐 t1（发出时刻）</text>
  <text
     x="975"
     y="296"
     fill="#facc15"
     font-size="11"
     font-weight="700"
     id="text15">t1</text>
  <text
     x="205"
     y="306"
     fill="#a5b4fc"
     font-size="11"
     font-weight="700"
     id="text16">t2</text>
  <text
     x="350"
     y="306"
     fill="#94a3b8"
     font-size="9.5"
     id="text17">ISTA 收到掐 t2</text>
  <line
     x1="265"
     y1="328"
     x2="911"
     y2="328"
     stroke="#fbbf24"
     stroke-width="2"
     marker-end="url(#ary)"
     id="line17" />
  <text
     x="588"
     y="322"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text18">Ack　ISTA 掐 t3（发出 Ack）　RSTA 收到掐 t4</text>
  <text
     x="205"
     y="342"
     fill="#a5b4fc"
     font-size="11"
     font-weight="700"
     id="text19">t3</text>
  <text
     x="975"
     y="338"
     fill="#facc15"
     font-size="11"
     font-weight="700"
     id="text20">t4</text>
  <line
     x1="915"
     y1="372"
     x2="269"
     y2="372"
     stroke="#fbbf24"
     stroke-width="2"
     marker-end="url(#ary)"
     id="line20" />
  <text
     x="588"
     y="366"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text21">FTM_2（follow-up）：把上一轮的 t1、t4 捎给 ISTA（RSTA 钟上的原始值）</text>
  <text
     x="588"
     y="390"
     text-anchor="middle"
     fill="#facc15"
     font-size="10.5"
     font-weight="700"
     id="text22">→ ISTA 集齐 t1/t2/t3/t4　RTT =（t4' − t1'）−（t3 − t2）</text>
  <rect
     x="120"
     y="402"
     width="940"
     height="46"
     rx="6"
     fill="#1c1908"
     stroke="#a16207"
     stroke-width="1"
     id="rect22" />
  <text
     x="113"
     y="420"
     fill="#94a3b8"
     font-size="9.5"
     id="text23" />
  <text
     x="590"
     y="420"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="10.5"
     id="text24">关键：RSTA 捎回 t1/t4 → ISTA 换算到自己钟上（t1'/t4'）→ 与 t3/t2 同钟相减，免对表也准</text>
  <text
     x="590"
     y="438"
     text-anchor="middle"
     fill="#64748b"
     font-size="9.5"
     id="text25">每个 FTM 帧&quot;既给本轮掐 t1、又捎回上一轮 t1/t4&quot;；一个 burst 内多帧重复取平均降噪</text>
  <!-- ② az NDP -->
  <rect
     x="95"
     y="476"
     width="990"
     height="262"
     rx="8"
     fill="#1e1b4b"
     stroke="#818cf8"
     stroke-width="1.5"
     id="rect25" />
  <text
     x="113"
     y="496"
     fill="#c7d2fe"
     font-size="13"
     font-weight="700"
     id="text26">②B az NDP 测距（802.11az，TB 触发式为例）· 用空数据包测时刻（§11.21.6.4.4）</text>
  <text
     x="113"
     y="520"
     fill="#a5b4fc"
     font-size="11"
     font-weight="700"
     id="text27">— 测量探测阶段（Sounding）—</text>
  <line
     x1="915"
     y1="540"
     x2="269"
     y2="540"
     stroke="#a5b4fc"
     stroke-width="1.8"
     marker-end="url(#arp)"
     id="line27" />
  <text
     x="588"
     y="534"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text28">TF Ranging Poll（Trigger）→ ISTA 回 CTS-to-self</text>
  <line
     x1="915"
     y1="568"
     x2="269"
     y2="568"
     stroke="#a5b4fc"
     stroke-width="1.8"
     marker-end="url(#arp)"
     id="line28" />
  <text
     x="588"
     y="562"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text29">TF Ranging Sounding（Trigger）— RSTA 统一调度，可同时触发多个 ISTA</text>
  <line
     x1="265"
     y1="596"
     x2="911"
     y2="596"
     stroke="#60a5fa"
     stroke-width="2.4"
     marker-end="url(#arp)"
     id="line29" />
  <text
     x="588"
     y="590"
     text-anchor="middle"
     fill="#bfdbfe"
     font-size="11"
     font-weight="700"
     id="text30">I2R NDP（ISTA→RSTA）　t1 = TOD(I2R NDP)　t2 = TOA(I2R NDP)</text>
  <text
     x="195"
     y="590"
     fill="#93c5fd"
     font-size="10.5"
     font-weight="700"
     id="text31">t1</text>
  <text
     x="975"
     y="600"
     fill="#93c5fd"
     font-size="10.5"
     font-weight="700"
     id="text32">t2</text>
  <line
     x1="915"
     y1="628"
     x2="269"
     y2="628"
     stroke="#60a5fa"
     stroke-width="2.4"
     marker-end="url(#arp)"
     id="line32" />
  <text
     x="588"
     y="622"
     text-anchor="middle"
     fill="#bfdbfe"
     font-size="11"
     font-weight="700"
     id="text33">Ranging NDPA + R2I NDP（RSTA→ISTA）　t3 = TOD(R2I)　t4 = TOA(R2I)</text>
  <text
     x="975"
     y="622"
     fill="#93c5fd"
     font-size="10.5"
     font-weight="700"
     id="text34">t3</text>
  <text
     x="195"
     y="640"
     fill="#93c5fd"
     font-size="10.5"
     font-weight="700"
     id="text35">t4</text>
  <text
     x="113"
     y="666"
     fill="#a5b4fc"
     font-size="11"
     font-weight="700"
     id="text36">— 测量报告阶段（Reporting）—</text>
  <line
     x1="915"
     y1="686"
     x2="269"
     y2="686"
     stroke="#a5b4fc"
     stroke-width="1.8"
     marker-end="url(#arp)"
     id="line36" />
  <text
     x="588"
     y="680"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text37">R2I LMR：把 t2、t3 报给 ISTA（NDP 带不了时间戳，靠 LMR 回传）</text>
  <line
     x1="265"
     y1="714"
     x2="911"
     y2="714"
     stroke="#a5b4fc"
     stroke-width="1.3"
     stroke-dasharray="5,3"
     marker-end="url(#arp)"
     id="line37" />
  <text
     x="588"
     y="708"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10.5"
     id="text38">（可选）I2R LMR：ISTA 把 t1、t4 回给 RSTA → RSTA 也能独立算 RTT</text>
  <!-- ③ 算距离 + 三边 -->
  <rect
     x="95"
     y="754"
     width="990"
     height="86"
     rx="8"
     fill="#0c2a16"
     stroke="#22c55e"
     stroke-width="1.5"
     id="rect38" />
  <text
     x="113"
     y="774"
     fill="#86efac"
     font-size="13"
     font-weight="700"
     id="text39">③ 算距离 + 定位</text>
  <text
     x="113"
     y="798"
     fill="#cbd5e1"
     font-size="11"
     id="text40">RTT =（t4 − t1）−（t3 − t2）　→　距离 = c × RTT ÷ 2　（多 burst / 多 NDP 取平均降噪）</text>
  <text
     x="113"
     y="820"
     fill="#cbd5e1"
     font-size="11"
     id="text41">与 ≥3 个位置已知的 RSTA 分别测距 → 三个&quot;距离圆&quot;相交于一点 → 三边测量定出室内位置</text>
  <!-- footer -->
  <text
     x="590"
     y="870"
     text-anchor="middle"
     fill="#64748b"
     font-size="10.5"
     id="text42">mc vs az：mc 用带载荷的 Action 帧测时刻（米级）；az 用只有前导码的 NDP + HE-LTF + 更宽带宽 + 多天线，把&quot;到达时刻&quot;估到亚米级</text>
  <text
     x="590"
     y="894"
     text-anchor="middle"
     fill="#64748b"
     font-size="10.5"
     id="text43">安全场景（门禁/车钥匙）：az 用 Secure HE-LTF + PASN/PTKSA + PMF，对 LTF 加密防&quot;距离欺骗&quot;</text>
</svg>
