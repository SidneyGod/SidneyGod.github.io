       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#c4b5fd"
         id="path4" />
    </marker>
  </defs>
  <rect
     width="1080"
     height="540"
     fill="url(#bg)"
     id="rect4" />
  <text
     x="540"
     y="34"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text4">带外触发 — 用 BLE / NFC 先&quot;叫醒&quot;NAN</text>
  <text
     x="540"
     y="58"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12"
     id="text5">思路同 DPP 带外引导：用更省电/便捷的旁路，把 NAN 发现 + 建链这件重活引导起来</text>
  <!-- two devices -->
  <rect
     x="70"
     y="86"
     width="180"
     height="40"
     rx="8"
     fill="#1e293b"
     stroke="#64748b"
     stroke-width="2"
     id="rect5" />
  <text
     x="160"
     y="112"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="14"
     font-weight="700"
     id="text6">设备 A</text>
  <rect
     x="830"
     y="86"
     width="180"
     height="40"
     rx="8"
     fill="#1e293b"
     stroke="#64748b"
     stroke-width="2"
     id="rect6" />
  <text
     x="920"
     y="112"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="14"
     font-weight="700"
     id="text7">设备 B</text>
  <line
     x1="160"
     y1="126"
     x2="160"
     y2="480"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line7" />
  <line
     x1="920"
     y1="126"
     x2="920"
     y2="480"
     stroke="#475569"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line8" />
  <text
     x="160"
     y="146"
     text-anchor="middle"
     fill="#64748b"
     font-size="10"
     id="text8">（NAN 射频平时休眠省电）</text>
  <text
     x="920"
     y="146"
     text-anchor="middle"
     fill="#64748b"
     font-size="10"
     id="text9">（NAN 射频平时休眠省电）</text>
  <!-- BLE band -->
  <rect
     x="40"
     y="160"
     width="1000"
     height="138"
     rx="8"
     fill="#0c1e3a"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect9" />
  <text
     x="58"
     y="182"
     fill="#93c5fd"
     font-size="13"
     font-weight="700"
     id="text10">① BLE 触发（最常用，§11）— 低功耗&quot;门铃&quot;</text>
  <line
     x1="160"
     y1="212"
     x2="916"
     y2="212"
     stroke="#60a5fa"
     stroke-width="2"
     marker-end="url(#arb)"
     id="line10" />
  <text
     x="538"
     y="206"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text11">BLE 广播：TDS（AD Type=0x26，Org ID=0x02）携带基本服务信息</text>
  <text
     x="538"
     y="236"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10"
     id="text12">角色：Browser（找服务）/ Seeker（找特定服务，可带目标 BLE 地址定向唤醒）→ Provider 响应</text>
  <rect
     x="800"
     y="250"
     width="220"
     height="34"
     rx="6"
     fill="#0c2a2a"
     stroke="#14b8a6"
     id="rect12" />
  <text
     x="910"
     y="272"
     text-anchor="middle"
     fill="#5eead4"
     font-size="11"
     font-weight="700"
     id="text13">B 点亮 NAN 射频 → 开始发现</text>
  <text
     x="182"
     y="272"
     text-anchor="middle"
     fill="#64748b"
     font-size="9.5px"
     id="text14">（同机制也可触发 Wi-Fi Direct / WiGig / HaLow）</text>
  <!-- NFC band -->
  <rect
     x="40"
     y="312"
     width="1000"
     height="120"
     rx="8"
     fill="#2e1065"
     stroke="#a78bfa"
     stroke-width="1.5"
     id="rect14" />
  <text
     x="58"
     y="334"
     fill="#ddd6fe"
     font-size="13"
     font-weight="700"
     id="text15">② NFC 触发（碰一碰，§12）— 顺手交换密钥</text>
  <line
     x1="160"
     y1="364"
     x2="916"
     y2="364"
     stroke="#c4b5fd"
     stroke-width="2"
     marker-end="url(#arp)"
     id="line15" />
  <line
     x1="916"
     y1="384"
     x2="164"
     y2="384"
     stroke="#c4b5fd"
     stroke-width="2"
     marker-end="url(#arp)"
     id="line16" />
  <text
     x="538"
     y="358"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="11"
     id="text16">NFC Connection Handover：双向认证 DH 密钥交换（NCS-PK-2WDH）</text>
  <text
     x="538"
     y="404"
     text-anchor="middle"
     fill="#c4b5fd"
     font-size="10.5"
     font-weight="700"
     id="text17">碰一碰即拿到对方 DH 公钥 + 触发信息 → 后续可直接建立&quot;安全 NDP&quot;</text>
  <text
     x="538"
     y="422"
     text-anchor="middle"
     fill="#64748b"
     font-size="9.5"
     id="text18">注：NFC 这条尚未纳入 Wi-Fi Aware 认证测试</text>
  <!-- footer -->
  <text
     x="540"
     y="466"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="11"
     id="text19">触发完成后 → 进入正常 NAN 流程：DW 同步 → Publish/Subscribe 发现 → NDP 建链（见正文 6.1～6.6）</text>
  <text
     x="540"
     y="500"
     text-anchor="middle"
     fill="#64748b"
     font-size="10.5"
     id="text20">比喻：BLE = 超省电的门铃（按一下才起身开灯）；NFC = 贴脸递名片（叫醒之余还把保险柜钥匙一并交换）</text>
</svg>
