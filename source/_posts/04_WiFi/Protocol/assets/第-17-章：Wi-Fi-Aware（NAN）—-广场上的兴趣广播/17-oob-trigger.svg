       markerHeight="7"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#cbd5e1"
         id="path2" />
    </marker>
    <marker
       id="arb"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#60a5fa"
         id="path3" />
    </marker>
    <marker
       id="arp"
       viewBox="0 0 10 10"
