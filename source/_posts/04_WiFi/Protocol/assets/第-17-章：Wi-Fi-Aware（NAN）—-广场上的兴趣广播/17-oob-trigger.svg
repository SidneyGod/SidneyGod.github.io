     inkscape:window-maximized="1"
     inkscape:current-layer="svg20" />
  <defs
     id="defs4">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <style
       id="style2">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
    <marker
       id="ar"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
