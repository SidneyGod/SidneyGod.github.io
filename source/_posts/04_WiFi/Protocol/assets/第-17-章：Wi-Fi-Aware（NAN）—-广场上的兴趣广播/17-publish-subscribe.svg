   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview27"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.4835225"
     inkscape:cx="550.04223"
     inkscape:cy="280.07665"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg27" />
  <defs
     id="defs4">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="card"
       x1="0%"
       y1="0%"
       x2="0%"
       y2="100%">
      <stop
         offset="0%"
         stop-color="#1e293b"
         id="stop3" />
      <stop
         offset="100%"
         stop-color="#0f172a"
         id="stop4" />
    </linearGradient>
    <style
       id="style4">text{font-family:'Maple Mono Normal NL NF CN', monospace;}</style>
  </defs>
  <rect
     width="1100"
     height="560"
     fill="url(#bg)"
     id="rect4" />
  <text
     x="550"
     y="36"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="20"
     font-weight="700"
     id="text4">服务发现 — Publish / Subscribe 在 DW 内匹配</text>
  <text
     x="550"
     y="60"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="13"
     id="text5">举牌&quot;我提供&quot; vs 举牌&quot;谁提供&quot;，靠服务名哈希 + Matching Filter 对上眼</text>
  <!-- Publisher -->
  <rect
     x="80"
     y="100"
     width="300"
     height="160"
     rx="10"
     fill="url(#card)"
     stroke="#22c55e"
     stroke-width="2"
     id="rect5" />
  <text
     x="230"
     y="128"
     text-anchor="middle"
     fill="#22c55e"
     font-size="16"
     font-weight="700"
     id="text6">Publisher（发布者）</text>
  <text
     x="230"
     y="152"
     text-anchor="middle"
     fill="#86efac"
     font-size="12"
     id="text7">&quot;我有文件分享服务！&quot;</text>
  <text
     x="100"
     y="182"
     fill="#cbd5e1"
     font-size="11"
     id="text8">· Hash(服务名) → Hash Value 字段</text>
  <text
     x="100"
     y="206"
     fill="#cbd5e1"
     font-size="11"
     id="text9">· Unsolicited：主动定时吆喝</text>
  <text
     x="100"
     y="230"
     fill="#cbd5e1"
     font-size="11"
     id="text10">· Solicited：有人问才应答</text>
  <text
     x="100"
     y="252"
     fill="#94a3b8"
     font-size="11"
     id="text11">· 用 NMI 发送，含 publish_id</text>
  <!-- Subscriber -->
  <rect
     x="720"
     y="100"
     width="300"
     height="160"
     rx="10"
     fill="url(#card)"
     stroke="#3b82f6"
     stroke-width="2"
     id="rect11" />
  <text
     x="870"
     y="128"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="16"
     font-weight="700"
     id="text12">Subscriber（订阅者）</text>
  <text
     x="870"
     y="152"
     text-anchor="middle"
     fill="#93c5fd"
     font-size="12"
     id="text13">&quot;谁能分享文件？&quot;</text>
  <text
     x="740"
     y="182"
     fill="#cbd5e1"
     font-size="11"
     id="text14">· 主动搜索特定服务</text>
  <text
     x="740"
     y="206"
     fill="#cbd5e1"
     font-size="11"
     id="text15">· 携带 matching_filter_rx</text>
  <text
     x="740"
     y="230"
     fill="#cbd5e1"
     font-size="11"
     id="text16">· 附加条件:&quot;PD快充/20000mAh+&quot;</text>
  <text
     x="740"
     y="252"
     fill="#94a3b8"
     font-size="11"
     id="text17">· 用 NMI 发送，含 subscribe_id</text>
  <!-- DW band -->
  <rect
     x="410"
     y="120"
     width="280"
     height="120"
     rx="8"
     fill="#052e16"
     stroke="#16a34a"
     id="rect17" />
  <text
     x="550"
     y="146"
     text-anchor="middle"
     fill="#22c55e"
     font-size="13"
     font-weight="700"
     id="text18">Discovery Window</text>
  <text
     x="550"
     y="168"
     text-anchor="middle"
     fill="#86efac"
     font-size="11"
     id="text19">信道 6 · 16 TU</text>
  <text
     x="550"
     y="196"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11"
     id="text20">SDF（服务发现帧）</text>
  <text
     x="550"
     y="216"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11"
     id="text21">在此交汇</text>
  <!-- arrows -->
  <line
     x1="380"
     y1="170"
     x2="410"
     y2="170"
     stroke="#22c55e"
     stroke-width="2"
     id="line21" />
  <polygon
     points="410,170 398,164 398,176"
     fill="#22c55e"
     id="polygon21" />
  <line
     x1="720"
     y1="180"
     x2="690"
     y2="180"
     stroke="#3b82f6"
     stroke-width="2"
     id="line22" />
  <polygon
     points="690,180 702,174 702,186"
     fill="#3b82f6"
     id="polygon22" />
  <!-- matching filter -->
  <rect
     x="200"
     y="300"
     width="700"
     height="120"
     rx="8"
     fill="url(#card)"
     stroke="#fbbf24"
     id="rect22" />
  <text
     x="550"
     y="326"
     text-anchor="middle"
     fill="#fbbf24"
     font-size="14"
     font-weight="700"
     id="text22">Matching Filter 匹配规则（§4.1.3.1）</text>
  <text
     x="220"
     y="354"
     fill="#cbd5e1"
     font-size="12"
     id="text23">· 一串 &lt;length, value&gt; 对：length=0 → 通配（任意值都匹配该位）</text>
  <text
     x="220"
     y="378"
     fill="#cbd5e1"
     font-size="12"
     id="text24">· length&gt;0 → 该位值必须精确相等</text>
  <text
     x="220"
     y="402"
     fill="#86efac"
     font-size="12"
     id="text25">· 每一对都匹配 → trigger 条件满足 → Publisher 回应</text>
  <!-- followup -->
  <rect
     x="350"
     y="450"
     width="400"
     height="80"
     rx="8"
     fill="#1e3a8a"
     stroke="#60a5fa"
     id="rect25" />
  <text
     x="550"
     y="478"
     text-anchor="middle"
     fill="#bfdbfe"
     font-size="13"
     font-weight="700"
     id="text26">对上眼之后 → Follow-up（私聊）</text>
  <text
     x="550"
     y="504"
     text-anchor="middle"
     fill="#cbd5e1"
     font-size="11"
     id="text27">点对点交换更详细的服务信息，不再广播</text>
</svg>
