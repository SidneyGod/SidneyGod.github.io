  <text
     x="312"
     y="55"
     text-anchor="middle"
     fill="#10b981"
     font-size="10"
     font-weight="700"
     id="text5">IV</text>
  <text
     x="312"
     y="66"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text6">24bit</text>
  <rect
     x="350"
     y="40"
     width="65"
     height="30"
     rx="4"
     fill="#052e16"
     stroke="#10b981"
     stroke-width="1"
     id="rect6" />
  <text
     x="382"
     y="55"
     text-anchor="middle"
     fill="#10b981"
     font-size="10"
     font-weight="700"
     id="text7">Key</text>
  <text
