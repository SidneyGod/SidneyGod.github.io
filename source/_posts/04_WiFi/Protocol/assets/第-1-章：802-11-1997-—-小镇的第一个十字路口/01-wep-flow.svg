  <!-- Final frame -->
  <rect
     x="580"
     y="145"
     width="140"
     height="50"
     rx="5"
     fill="#0f172a"
     stroke="#7c3aed"
     stroke-width="1.5"
     id="rect22" />
  <text
     x="650"
     y="167"
     text-anchor="middle"
     fill="#7c3aed"
     font-size="10"
     font-weight="700"
     id="text23">IV + Ciphertext</text>
  <text
     x="650"
     y="185"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text24">最终传输帧</text>
</svg>
