  <line
     x1="382"
     y1="70"
     x2="350"
     y2="95"
     stroke="#10b981"
     stroke-width="1"
     marker-end="url(#arr-green)"
     id="line9" />
  <!-- ===== Middle: RC4 → Keystream ===== -->
  <!-- RC4 -->
  <rect
     x="275"
     y="95"
     width="100"
     height="35"
     rx="5"
     fill="#0f172a"
     stroke="#dc2626"
     stroke-width="1.5"
     id="rect9" />
  <text
     x="325"
     y="113"
     text-anchor="middle"
     fill="#dc2626"
     font-size="11"
     font-weight="700"
     id="text9">RC4</text>
  <text
     x="325"
     y="125"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text10">流密码</text>
  <!-- RC4 to Keystream -->
  <line
     x1="375"
     y1="112"
     x2="420"
     y2="112"
     stroke="#dc2626"
     stroke-width="1.5"
     marker-end="url(#arr-red)"
     id="line10" />
  <!-- Keystream -->
  <rect
     x="420"
     y="95"
     width="80"
     height="35"
     rx="5"
     fill="#2d0a0a"
     stroke="#dc2626"
     stroke-width="1"
     id="rect10" />
  <text
     x="460"
     y="113"
     text-anchor="middle"
     fill="#dc2626"
     font-size="10"
     font-weight="700"
     id="text11">Keystream</text>
  <text
     x="460"
     y="125"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text12">密钥流</text>
  <!-- Keystream down to XOR -->
  <line
     x1="430"
     y1="130"
     x2="360"
     y2="155"
     stroke="#dc2626"
     stroke-width="1"
     marker-end="url(#arr-red)"
     id="line12" />
  <!-- ===== Bottom: Plaintext → CRC-32 → (Plaintext+ICV) → XOR → Ciphertext → Final ===== -->
  <!-- Plaintext -->
  <rect
     x="20"
     y="150"
     width="80"
     height="40"
     rx="5"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="rect12" />
  <text
     x="60"
     y="168"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="10"
     font-weight="700"
     id="text13">Plaintext</text>
  <text
     x="60"
     y="182"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text14">明文</text>
  <!-- Arrow to CRC-32 -->
  <line
     x1="100"
     y1="170"
     x2="130"
     y2="170"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arr)"
     id="line14" />
  <!-- CRC-32 -->
  <rect
     x="130"
     y="150"
     width="70"
     height="40"
     rx="5"
     fill="#1e1b4b"
     stroke="#a855f7"
     stroke-width="1"
     id="rect14" />
  <text
     x="165"
     y="168"
     text-anchor="middle"
     fill="#a855f7"
     font-size="9"
     font-weight="700"
     id="text15">CRC-32</text>
  <text
     x="165"
     y="182"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text16">生成 ICV</text>
  <!-- Arrow to Plaintext+ICV -->
  <line
     x1="200"
     y1="170"
     x2="230"
     y2="170"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arr)"
     id="line16" />
  <!-- Plaintext+ICV -->
  <rect
     x="230"
     y="150"
     width="100"
     height="40"
     rx="5"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1"
     id="rect16" />
  <text
     x="280"
     y="168"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="9"
     font-weight="700"
     id="text17">Plaintext+ICV</text>
  <text
     x="280"
     y="182"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text18">明文+校验值</text>
  <!-- Arrow to XOR -->
  <line
     x1="330"
     y1="170"
     x2="360"
     y2="170"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arr)"
     id="line18" />
  <!-- XOR -->
  <rect
     x="360"
     y="145"
     width="70"
     height="50"
     rx="5"
     fill="#1c1917"
     stroke="#eab308"
     stroke-width="1.5"
     id="rect18" />
  <text
     x="395"
     y="170"
     text-anchor="middle"
     fill="#eab308"
     font-size="13"
     font-weight="700"
     id="text19">XOR</text>
  <text
     x="395"
     y="185"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text20">按位异或</text>
  <!-- Arrow to Ciphertext -->
  <line
     x1="430"
     y1="170"
     x2="465"
     y2="170"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arr)"
     id="line20" />
  <!-- Ciphertext -->
  <rect
     x="465"
     y="150"
     width="80"
     height="40"
     rx="5"
     fill="#2d0a0a"
     stroke="#dc2626"
     stroke-width="1.5"
     id="rect20" />
  <text
     x="505"
     y="168"
     text-anchor="middle"
     fill="#dc2626"
     font-size="10"
     font-weight="700"
     id="text21">Ciphertext</text>
  <text
     x="505"
     y="182"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="8"
     id="text22">密文</text>
  <!-- Arrow to Final -->
  <line
     x1="545"
     y1="170"
     x2="580"
     y2="170"
     stroke="#94a3b8"
     stroke-width="1.5"
     marker-end="url(#arr)"
