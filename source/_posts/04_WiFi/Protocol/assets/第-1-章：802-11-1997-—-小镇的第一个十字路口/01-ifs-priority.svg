         id="polygon18" />
    </marker>
  </defs>
  <text
     x="-175"
     y="19"
     text-anchor="middle"
     fill="#475569"
     font-size="10px"
     transform="rotate(-90)"
     id="text19">Priority decreases</text>
  <!-- Formula box -->
  <rect
     x="444"
     y="80"
     width="190.29703"
     height="68.613861"
     rx="2.8192153"
     fill="#0f172a"
     stroke="#334155"
     stroke-width="0.77749"
     id="rect19" />
  <text
