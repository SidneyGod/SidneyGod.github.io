<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 750 350"
   width="750"
   height="350"
   version="1.1"
   id="svg25"
   sodipodi:docname="01-nav-scenario.svg"
   inkscape:version="1.4.3 (0d15f75, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview25"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.8"
     inkscape:cx="450"
     inkscape:cy="175.27778"
     inkscape:window-width="2240"
     inkscape:window-height="1337"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg25" />
  <style
     id="style1">
    text { font-family: 'Maple Mono Normal NL NF CN', monospace; }
  </style>
  <defs
     id="defs3">
    <linearGradient
       id="bg-grad"
       x1="0"
       y1="0"
       x2="561.2486"
       y2="561.2486"
       gradientTransform="scale(1.3363062,0.62360956)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#0f0f1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#1a1a2e"
         id="stop2" />
    </linearGradient>
    <marker
       id="arr-blue"
       markerWidth="8"
       markerHeight="6"
       refX="7"
       refY="3"
       orient="auto">
      <polygon
         points="0,6 0,0 8,3 "
         fill="#3b82f6"
         id="polygon2" />
    </marker>
    <marker
       id="arr-green"
       markerWidth="8"
       markerHeight="6"
       refX="7"
       refY="3"
       orient="auto">
      <polygon
         points="0,6 0,0 8,3 "
         fill="#10b981"
         id="polygon3" />
    </marker>
  </defs>
  <rect
     width="750"
     height="350"
     fill="url(#bg-grad)"
     id="rect3"
     style="fill:url(#bg-grad);stroke-width:0.912871"
     x="0"
     y="0" />
  <!-- Title -->
  <text
     x="334"
     y="28"
     text-anchor="middle"
     fill="#e2e8f0"
     font-size="15px"
     font-weight="700"
     id="text3">NAV Mechanism: RTS/CTS Exchange with Virtual Carrier Sense</text>
  <text
     x="334"
     y="48"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="12px"
     id="text4">NAV 机制：RTS/CTS 交互与虚拟载波侦听</text>
  <!-- Three stations -->
  <circle
     cx="34"
     cy="80"
     r="20"
     fill="#1e3a5f"
     stroke="#3b82f6"
     stroke-width="1.5"
     id="circle4" />
  <text
     x="34"
     y="84"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="12px"
     font-weight="700"
     id="text5">A</text>
  <text
     x="34"
     y="110"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10px"
     id="text6">Sender</text>
  <circle
     cx="334"
     cy="80"
     r="20"
     fill="#052e16"
     stroke="#10b981"
     stroke-width="1.5"
     id="circle6" />
  <text
     x="334"
     y="84"
     text-anchor="middle"
     fill="#10b981"
     font-size="12px"
     font-weight="700"
     id="text7">B</text>
  <text
     x="334"
     y="110"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10px"
     id="text8">AP/Receiver</text>
  <circle
     cx="634"
     cy="80"
     r="20"
     fill="#4a1d0a"
     stroke="#f97316"
     stroke-width="1.5"
     id="circle8" />
  <text
     x="634"
     y="84"
     text-anchor="middle"
     fill="#f97316"
     font-size="12px"
     font-weight="700"
     id="text9">C</text>
  <text
     x="634"
     y="110"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10px"
     id="text10">Other STA</text>
  <!-- Step 1: A sends RTS to B, C also hears -->
  <line
     x1="54"
     y1="130"
     x2="314"
     y2="130"
     stroke="#3b82f6"
     stroke-width="2"
     marker-end="url(#arr-blue)"
     id="line10" />
  <text
     x="184"
     y="125"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="11px"
     font-weight="700"
     id="text11">RTS (Duration=300us)</text>
  <!-- RTS broadcast reach indicator -->
  <line
     x1="314"
     y1="130"
     x2="484"
     y2="130"
     stroke="#3b82f6"
     stroke-width="1"
     stroke-dasharray="4, 3"
     opacity="0.4"
     id="line11" />
  <text
     x="534"
     y="125"
     fill="#3b82f6"
     font-size="9px"
     opacity="0.6"
     id="text12">C 也能听到</text>
  <text
     x="184"
     y="147"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9px"
     id="text13">Step 1: A 按喇叭，B 和 C 都听到</text>
  <!-- Step 2: B sends CTS (broadcast), A and C hear -->
  <line
     x1="314"
     y1="175"
     x2="54"
     y2="175"
     stroke="#10b981"
     stroke-width="2"
     marker-end="url(#arr-green)"
     id="line13" />
  <line
     x1="314"
     y1="175"
     x2="614"
     y2="175"
     stroke="#10b981"
     stroke-width="2"
     marker-end="url(#arr-green)"
     id="line14" />
  <text
     x="184"
     y="170"
     text-anchor="middle"
     fill="#10b981"
     font-size="11px"
     font-weight="700"
     id="text14">CTS</text>
  <text
     x="484"
     y="170"
     text-anchor="middle"
     fill="#10b981"
     font-size="11px"
     font-weight="700"
     id="text15">CTS</text>
  <text
     x="184"
     y="192"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9px"
     id="text16">Step 2: B 广播 CTS，A 和 C 都收到</text>
  <!-- Step 3: A sends DATA -->
  <line
     x1="54"
     y1="220"
     x2="314"
     y2="220"
     stroke="#3b82f6"
     stroke-width="2.5"
     marker-end="url(#arr-blue)"
     id="line16" />
  <text
     x="184"
     y="215"
     text-anchor="middle"
     fill="#3b82f6"
     font-size="12px"
     font-weight="700"
     id="text17">DATA</text>
  <text
     x="184"
     y="237"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9px"
     id="text18">Step 3: A 发送数据</text>
  <!-- Step 4: B sends ACK -->
  <line
     x1="314"
     y1="265"
     x2="54"
     y2="265"
     stroke="#10b981"
     stroke-width="2"
     marker-end="url(#arr-green)"
     id="line18" />
  <text
     x="184"
     y="260"
     text-anchor="middle"
     fill="#10b981"
     font-size="11px"
     font-weight="700"
     id="text19">ACK</text>
  <text
     x="184"
     y="282"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="9px"
     id="text20">Step 4: B 确认收到</text>
  <!-- NAV at C -->
  <rect
     x="619"
     y="178"
     width="30"
     height="100"
     rx="4"
     fill="#f97316"
     opacity="0.2"
     stroke="#f97316"
     stroke-width="1"
     id="rect20" />
  <text
     x="634"
     y="232"
     text-anchor="middle"
     fill="#f97316"
     font-size="10px"
     font-weight="700"
     id="text21">NAV</text>
  <text
     x="660"
     y="200"
     fill="#f97316"
     font-size="9px"
     id="text22">NAV &gt; 0</text>
  <text
     x="660"
     y="215"
     fill="#f97316"
     font-size="9px"
     id="text23">即使信道空闲</text>
  <text
     x="660"
     y="230"
     fill="#f97316"
     font-size="9px"
     id="text24">C 也不能发送</text>
  <line
     x1="614"
     y1="175"
     x2="616"
     y2="178"
     stroke="#f97316"
     stroke-width="1.5"
     id="line24" />
  <line
     x1="614"
     y1="278"
     x2="654"
     y2="278"
     stroke="#f97316"
     stroke-width="1"
     stroke-dasharray="3, 2"
     id="line25" />
  <!-- Bottom note -->
  <rect
     x="30.111107"
     y="300"
     width="607.77783"
     height="35"
     rx="3.0388889"
     fill="#0f172a"
     stroke="#334155"
     stroke-width="0.87162"
     id="rect25" />
  <text
     x="334"
     y="322"
     text-anchor="middle"
     fill="#94a3b8"
     font-size="10px"
     id="text25">关键：NAV 是虚拟载波侦听 — NAV &gt; 0 时，即使物理信道空闲，也不能发送（IEEE 802.11 Section 9.2.5.4）</text>
</svg>
